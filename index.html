<style>
/* ===================== DESIGN SYSTEM ===================== */
:root{
  --bg:#0A0A0C; --bg2:#0F0F13; --card:#15151A; --card2:#1B1B22; --card3:#22222B;
  --line:#232329; --line2:#31313B;
  --txt:#F5F5F7; --mut:#A8A8B6; --dim:#84848F;
  --ind:#6366F1; --ind2:#818CF8; --ind-soft:rgba(99,102,241,.13);
  --grn:#34D399; --grn-soft:rgba(52,211,153,.12);
  --amb:#FBBF24; --amb-soft:rgba(251,191,36,.12);
  --red:#FB7185; --red-soft:rgba(251,113,133,.12);
  --tea:#2DD4BF; --vio:#A78BFA;
  --r-s:9px; --r-m:12px; --r-l:16px; --r-xl:20px;
  --sh:0 1px 2px rgba(0,0,0,.35);
  --sh-md:0 4px 16px rgba(0,0,0,.35);
  --sh-lg:0 20px 60px rgba(0,0,0,.55);
  --tr:.16s cubic-bezier(.4,0,.2,1);
  --sb:248px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --glow:none; --glow-t:none; --bd:1px;
  /* surfaces "solides" — indirection nécessaire au mode verre */
  --s-bg:#0A0A0C; --s-bg2:#0F0F13; --s-card:#15151A; --s-card2:#1B1B22; --s-card3:#22222B;
  --glass:100%; --glass-blur:0px;
  --wp-op:0; --wp-blur:0px; --wp-veil:.3; --wp-fit:cover;
  --bg:var(--s-bg); --bg2:var(--s-bg2); --card:var(--s-card); --card2:var(--s-card2); --card3:var(--s-card3);
  --topbar:var(--s-bg);
}

/* ===================== THÈMES ===================== */
html[data-theme="oled"]{
  --s-bg:#000000; --s-bg2:#08080A; --s-card:#0E0E11; --s-card2:#141418; --s-card3:#1C1C22;
  --line:#1D1D22; --line2:#2C2C34; --txt:#FAFAFC; --mut:#A0A0AE; --dim:#78788A;
  --sh:0 1px 2px rgba(0,0,0,.6); --sh-md:0 4px 18px rgba(0,0,0,.6); --sh-lg:0 20px 60px rgba(0,0,0,.8);
}
html[data-theme="ardoise"]{
  --s-bg:#0E1319; --s-bg2:#131A22; --s-card:#18212B; --s-card2:#1F2A36; --s-card3:#273544;
  --line:#233040; --line2:#33455A; --txt:#EDF2F7; --mut:#9AAABD; --dim:#7387A0;
}
html[data-theme="foret"]{
  --s-bg:#0B1412; --s-bg2:#0F1B18; --s-card:#13241F; --s-card2:#1A2F28; --s-card3:#223C33;
  --line:#1F362E; --line2:#2E4E42; --txt:#EAF5F0; --mut:#98B5AA; --dim:#77988B;
}
html[data-theme="clair"]{
  --s-bg:#F4F5F8; --s-bg2:#FFFFFF; --s-card:#FFFFFF; --s-card2:#F7F8FB; --s-card3:#EDEFF4;
  --line:#E2E5EC; --line2:#CDD2DC; --txt:#14161C; --mut:#5A6072; --dim:#858B9B;
  --red:#E11D48; --grn:#059669; --amb:#D97706; --tea:#0D9488; --vio:#7C3AED;
  --grn-soft:rgba(5,150,105,.10); --amb-soft:rgba(217,119,6,.12); --red-soft:rgba(225,29,72,.10);
  --sh:0 1px 2px rgba(16,24,40,.06); --sh-md:0 4px 16px rgba(16,24,40,.10); --sh-lg:0 20px 50px rgba(16,24,40,.18);
}
html[data-theme="creme"]{
  --s-bg:#F6F1E7; --s-bg2:#FDFAF4; --s-card:#FFFCF6; --s-card2:#F7F1E5; --s-card3:#EFE7D7;
  --line:#E6DDCB; --line2:#D3C6AE; --txt:#221C12; --mut:#645846; --dim:#8C8069;
  --red:#C2410C; --grn:#4D7C0F; --amb:#B45309; --tea:#0F766E; --vio:#7E22CE;
  --grn-soft:rgba(77,124,15,.12); --amb-soft:rgba(180,83,9,.12); --red-soft:rgba(194,65,12,.10);
  --sh:0 1px 2px rgba(80,60,30,.08); --sh-md:0 4px 16px rgba(80,60,30,.12); --sh-lg:0 20px 50px rgba(80,60,30,.20);
}

/* Thèmes Arpagon+ (Premium) */
html[data-theme="aurore"]{
  --s-bg:#071419; --s-bg2:#0A1B22; --s-card:#0F232C; --s-card2:#142D38; --s-card3:#1B3946;
  --line:#173440; --line2:#24505F; --txt:#E8FBF6; --mut:#9CC9C0; --dim:#76A39C;
  --glow:0 0 0 1px rgba(124,245,200,.10),0 0 26px rgba(124,245,200,.10);
}
html[data-theme="aurore"] .hero{background-image:radial-gradient(120% 90% at 0% 0%,rgba(124,245,200,.16),transparent 60%),radial-gradient(90% 80% at 100% 0%,rgba(168,85,247,.16),transparent 60%)}
html[data-theme="sakura"]{
  --s-bg:#FBF1F3; --s-bg2:#FFF8F9; --s-card:#FFFBFC; --s-card2:#FCEFF2; --s-card3:#F6E1E7;
  --line:#F0D9DF; --line2:#E2BFC9; --txt:#2A1A20; --mut:#73525C; --dim:#9A7A84;
  --red:#D6336C; --grn:#2F855A; --amb:#B7791F; --tea:#2C7A7B; --vio:#805AD5;
  --grn-soft:rgba(47,133,90,.10); --amb-soft:rgba(183,121,31,.12); --red-soft:rgba(214,51,108,.10);
  --sh:0 1px 2px rgba(120,40,70,.07); --sh-md:0 4px 16px rgba(120,40,70,.10); --sh-lg:0 20px 50px rgba(120,40,70,.16);
}
html[data-theme="royal"]{
  --s-bg:#0B0906; --s-bg2:#110E09; --s-card:#17130C; --s-card2:#1F1A10; --s-card3:#2A2316;
  --line:#2C2414; --line2:#45391F; --txt:#F7EEDC; --mut:#C9B78F; --dim:#9C8A64;
  --glow:0 0 0 1px rgba(232,197,92,.14),0 0 22px rgba(232,197,92,.08);
}
html[data-theme="royal"] .card,html[data-theme="royal"] .hero{border-color:rgba(232,197,92,.28)}
html[data-theme="royal"] .brand b{background:linear-gradient(90deg,#E8C55C,#FFF1C1,#D4AF37);-webkit-background-clip:text;background-clip:text;color:transparent}
.thc .pl,.acc .pl{position:absolute;top:6px;right:6px;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:99px;background:var(--ind);color:#fff}
.thc{position:relative}.acc{position:relative}
.acc .pl{top:-6px;right:-6px;padding:1px 4px;font-size:9px}
.thc.lock,.acc.lock{opacity:.72}

/* ===================== ACCENTS ===================== */
/* ===================== UNIVERS ===================== */
/* Ces trois thèmes ne changent pas que les couleurs : police, arrondis,
   épaisseur des bordures, halos et décor de fond. Ils passent quand même
   par les mêmes tokens, donc le fond d'écran transparent continue de marcher. */

/* --- Taverne : crème et marron chaud, le thème par défaut --- */
html[data-theme="taverne"]{
  --s-bg:#E8DCC6; --s-bg2:#F2E9D8; --s-card:#FBF5E9; --s-card2:#F3E8D4; --s-card3:#E9DBC2;
  --line:#DCCCAE; --line2:#C2AA85; --txt:#3A2B1B; --mut:#6E5A42; --dim:#957F63;
  --grn:#5C7F3F; --grn-soft:rgba(92,127,63,.14);
  --amb:#C1782A; --amb-soft:rgba(193,120,42,.16);
  --red:#B44A3A; --red-soft:rgba(180,74,58,.14);
  --tea:#4E8A7A; --vio:#8A6199;
  --r-s:9px; --r-m:13px; --r-l:18px; --r-xl:22px;
  --sh:0 1px 2px rgba(90,66,38,.10);
  --sh-md:0 5px 18px rgba(90,66,38,.14);
  --sh-lg:0 20px 52px rgba(90,66,38,.26);
  --font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
html[data-theme="taverne"] .lbl,html[data-theme="taverne"] .chap .rn{
  font-variant:small-caps;text-transform:none;letter-spacing:.1em;color:var(--amb)}
html[data-theme="taverne"] .card,html[data-theme="taverne"] .stat,
html[data-theme="taverne"] .qhead,html[data-theme="taverne"] .quest{
  border-color:var(--line2)}
html[data-theme="taverne"] .hero{border-color:var(--line2)}

/* --- Synthwave : néon magenta/cyan sur nuit violette --- */
html[data-theme="synthwave"]{
  --s-bg:#150B2E; --s-bg2:#1D1040; --s-card:#241450; --s-card2:#2E1A63; --s-card3:#3A2178;
  --line:#3D2280; --line2:#5B32B8; --txt:#FDF4FF; --mut:#C9A8F5; --dim:#9B7BD4;
  --grn:#00F5C4; --grn-soft:rgba(0,245,196,.14);
  --amb:#FFB800; --amb-soft:rgba(255,184,0,.16);
  --red:#FF2E97; --red-soft:rgba(255,46,151,.16);
  --tea:#00E5FF; --vio:#C77DFF;
  --r-s:6px; --r-m:8px; --r-l:12px; --r-xl:14px;
  --bd:1.5px;
  --glow:0 0 14px var(--ind-soft),0 0 30px rgba(255,46,151,.12);
  --glow-t:0 0 12px currentColor;
  --sh:0 1px 2px rgba(0,0,0,.5);
  --sh-md:0 4px 20px rgba(120,20,180,.35);
  --sh-lg:0 20px 60px rgba(120,20,180,.55);
  --font:"Avenir Next","Futura",system-ui,-apple-system,sans-serif;
}
html[data-theme="synthwave"] .card,html[data-theme="synthwave"] .stat,
html[data-theme="synthwave"] .qhead,html[data-theme="synthwave"] .hero,
html[data-theme="synthwave"] .btab{box-shadow:var(--sh-md),var(--glow)}
html[data-theme="synthwave"] .hero .big,html[data-theme="synthwave"] .ring .rv b,
html[data-theme="synthwave"] .tobud .amt{text-shadow:var(--glow-t)}
html[data-theme="synthwave"] .brand b,html[data-theme="synthwave"] .qrank .lv{text-shadow:0 0 10px currentColor}
html[data-theme="synthwave"] .lbl,html[data-theme="synthwave"] .chap .rn,
html[data-theme="synthwave"] .bh{letter-spacing:.18em}

/* --- Boisé : parchemin, bois, ferronnerie --- */
html[data-theme="boise"]{
  --s-bg:#241A11; --s-bg2:#2E2116; --s-card:#37281A; --s-card2:#42311F; --s-card3:#503C27;
  --line:#4A3724; --line2:#6B5033; --txt:#F5E9D5; --mut:#C4AC8A; --dim:#9A8467;
  --grn:#8FB339; --grn-soft:rgba(143,179,57,.14);
  --amb:#D9A441; --amb-soft:rgba(217,164,65,.16);
  --red:#C0562F; --red-soft:rgba(192,86,47,.16);
  --tea:#7BA05B; --vio:#A98467;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --sh:0 2px 3px rgba(0,0,0,.4);
  --sh-md:0 6px 20px rgba(0,0,0,.45);
  --sh-lg:0 22px 60px rgba(0,0,0,.6);
  --font:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
html[data-theme="boise"] .card,html[data-theme="boise"] .stat,html[data-theme="boise"] .qhead,
html[data-theme="boise"] .hero,html[data-theme="boise"] .btab,html[data-theme="boise"] .quest{
  background-image:repeating-linear-gradient(94deg,rgba(255,235,200,.035) 0 2px,transparent 2px 7px)}
html[data-theme="boise"] .lbl,html[data-theme="boise"] .chap .rn{font-variant:small-caps;letter-spacing:.1em;text-transform:none}
html[data-theme="boise"] .brand,html[data-theme="boise"] .qrank .rk,
html[data-theme="boise"] .sh h3{letter-spacing:.01em}
html[data-theme="boise"] .hero .big,html[data-theme="boise"] .ring .rv b{font-weight:700}

/* --- Empire : bleu de nuit, crème et or, lettres à empattements --- */
html[data-theme="france"]{
  --s-bg:#0F1730; --s-bg2:#16203F; --s-card:#1C2950; --s-card2:#24325F; --s-card3:#2E3E73;
  --line:#2A3A6B; --line2:#42558F; --txt:#F6F2E6; --mut:#BCC5DE; --dim:#8C96B4;
  --grn:#5FA98C; --grn-soft:rgba(95,169,140,.14);
  --amb:#D4AF37; --amb-soft:rgba(212,175,55,.16);
  --red:#E03B4B; --red-soft:rgba(224,59,75,.16);
  --tea:#7FA8D9; --vio:#9C7FD9;
  --r-s:4px; --r-m:7px; --r-l:11px; --r-xl:14px;
  --sh:0 1px 2px rgba(0,0,0,.45);
  --sh-md:0 5px 20px rgba(0,0,0,.42);
  --sh-lg:0 22px 60px rgba(0,0,0,.62);
  --font:"Didot","Bodoni MT","Hoefler Text",Garamond,"Times New Roman",serif;
}
/* Bande tricolore en tête de chaque surface */
html[data-theme="france"] .card,html[data-theme="france"] .stat,html[data-theme="france"] .qhead,
html[data-theme="france"] .hero,html[data-theme="france"] .btab,html[data-theme="france"] .tobud,
html[data-theme="france"] .sheet,html[data-theme="france"] .quest{
  border-top:none;position:relative}
html[data-theme="france"] .card::after,html[data-theme="france"] .stat::after,
html[data-theme="france"] .qhead::after,html[data-theme="france"] .btab::after,
html[data-theme="france"] .tobud::after,html[data-theme="france"] .sheet::after,
html[data-theme="france"] .quest::after{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-l) var(--r-l) 0 0;
  background:linear-gradient(90deg,#2C4C9B 0 33.33%,#F6F2E6 33.33% 66.66%,#E03B4B 66.66%);pointer-events:none}
html[data-theme="france"] .qhead::after{height:4px}
/* Cocarde sur la barre latérale et la nav mobile */
html[data-theme="france"] nav.bottom::before,html[data-theme="france"] .topbar::after{
  content:"";position:absolute;left:0;right:0;height:2.5px;
  background:linear-gradient(90deg,#2C4C9B 0 33.33%,#F6F2E6 33.33% 66.66%,#E03B4B 66.66%)}
html[data-theme="france"] nav.bottom{position:fixed}
html[data-theme="france"] nav.bottom::before{top:0}
html[data-theme="france"] .topbar{position:sticky}
html[data-theme="france"] .topbar::after{bottom:0}
html[data-theme="france"] #reward{border-color:var(--amb)}
html[data-theme="france"] #reward::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,#2C4C9B 0 33.33%,#F6F2E6 33.33% 66.66%,#E03B4B 66.66%)}
/* Fleur de lys en filigrane dans le bandeau de quête */
html[data-theme="france"] .qhead{
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2272%22%20height%3D%2272%22%20viewBox%3D%220%200%2072%2072%22%3E%3Cg%20fill%3D%22%2523D4AF37%22%20fill-opacity%3D%220.075%22%3E%3Cg%20transform%3D%22translate%286%206%29%20scale%281.05%29%22%3E%3Cpath%20d%3D%22M12%202c-1.6%203.1-3.1%204.6-3.1%207%200%202%201.4%203.1%203.1%203.1s3.1-1.1%203.1-3.1c0-2.4-1.5-3.9-3.1-7zM8.9%209.4c-3-2-5.2-.1-4.6%203%20.5%202.4%202.9%203%204.6%201.6zM15.1%209.4c3-2%205.2-.1%204.6%203-.5%202.4-2.9%203-4.6%201.6zM6.9%2014.2h10.2v1.9H6.9zM10.1%2016.1c-.9%203-1.9%204.9-3.9%205.9%204%200%205.1-2%205.8-3.9.7%201.9%201.8%203.9%205.8%203.9-2-1-3-2.9-3.9-5.9z%22%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%22translate%2842%2042%29%20scale%281.05%29%22%3E%3Cpath%20d%3D%22M12%202c-1.6%203.1-3.1%204.6-3.1%207%200%202%201.4%203.1%203.1%203.1s3.1-1.1%203.1-3.1c0-2.4-1.5-3.9-3.1-7zM8.9%209.4c-3-2-5.2-.1-4.6%203%20.5%202.4%202.9%203%204.6%201.6zM15.1%209.4c3-2%205.2-.1%204.6%203-.5%202.4-2.9%203-4.6%201.6zM6.9%2014.2h10.2v1.9H6.9zM10.1%2016.1c-.9%203-1.9%204.9-3.9%205.9%204%200%205.1-2%205.8-3.9.7%201.9%201.8%203.9%205.8%203.9-2-1-3-2.9-3.9-5.9z%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");background-size:72px 72px}
html[data-theme="france"] .lbl,html[data-theme="france"] .chap .rn,
html[data-theme="france"] .bh{font-variant:small-caps;text-transform:none;letter-spacing:.14em;color:var(--amb)}
html[data-theme="france"] .hero::before{background:linear-gradient(180deg,#2C4C9B 0 33%,#F6F2E6 33% 66%,#E03B4B 66%)}
html[data-theme="france"] .brand b,html[data-theme="france"] .qrank .rk{letter-spacing:.02em}

/* --- Cyberpunk : terminal, jaune acide, angles vifs --- */
html[data-theme="cyberpunk"]{
  --s-bg:#08090B; --s-bg2:#0D0F12; --s-card:#111419; --s-card2:#171B22; --s-card3:#1F252E;
  --line:#232A34; --line2:#38424F; --txt:#E6FBFF; --mut:#7FA3B0; --dim:#5A7480;
  --grn:#00FF9C; --grn-soft:rgba(0,255,156,.12);
  --amb:#FCEE0A; --amb-soft:rgba(252,238,10,.14);
  --red:#FF3B3B; --red-soft:rgba(255,59,59,.14);
  --tea:#00E5FF; --vio:#B14AED;
  --r-s:2px; --r-m:3px; --r-l:4px; --r-xl:5px;
  --bd:1px;
  --glow:0 0 0 1px rgba(0,229,255,.12);
  --sh:0 1px 0 rgba(0,0,0,.6);
  --sh-md:0 2px 0 rgba(0,229,255,.16);
  --sh-lg:0 0 0 1px rgba(0,229,255,.25),0 20px 50px rgba(0,0,0,.8);
  --font:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
html[data-theme="cyberpunk"] .card,html[data-theme="cyberpunk"] .stat,
html[data-theme="cyberpunk"] .qhead,html[data-theme="cyberpunk"] .btab,
html[data-theme="cyberpunk"] .quest,html[data-theme="cyberpunk"] .hero{
  border-width:1px;box-shadow:var(--sh-md)}
html[data-theme="cyberpunk"] .lbl,html[data-theme="cyberpunk"] .chap .rn,
html[data-theme="cyberpunk"] .bh,html[data-theme="cyberpunk"] .bgrp{letter-spacing:.2em}
html[data-theme="cyberpunk"] .chap .rn::before{content:"// "}
html[data-theme="cyberpunk"] .hero .big,html[data-theme="cyberpunk"] .ring .rv b{letter-spacing:-.01em}
html[data-theme="cyberpunk"] .brand b{text-shadow:0 0 8px currentColor}
html[data-theme="cyberpunk"] .qic,html[data-theme="cyberpunk"] .spend .sic,
html[data-theme="cyberpunk"] .lvbadge{border-radius:2px}

html[data-accent="aurore"]{ --ind:#2BD4A4; --ind2:#7CF5C8; --ind-soft:rgba(43,212,164,.15) }
html[data-accent="corail"]{ --ind:#FF6B4A; --ind2:#FF9A7E; --ind-soft:rgba(255,107,74,.14) }
html[data-accent="platine"]{ --ind:#A7B0C0; --ind2:#D5DBE5; --ind-soft:rgba(167,176,192,.16) }

/* ===================== FOND D'ÉCRAN + VERRE ===================== */
#wp{position:fixed;inset:-4%;z-index:0;pointer-events:none;background-position:center;
  background-repeat:no-repeat;background-size:var(--wp-fit);opacity:var(--wp-op);
  filter:blur(var(--wp-blur));transition:opacity .25s,filter .25s}
#wpv{position:fixed;inset:0;z-index:1;pointer-events:none;background:var(--s-bg);opacity:var(--wp-veil);transition:opacity .25s}
html.wp{background:var(--s-bg)}
html.wp body{background:transparent}
html.wp{
  --bg:transparent;
  --bg2:color-mix(in srgb, var(--s-bg2) var(--glass), transparent);
  --card:color-mix(in srgb, var(--s-card) var(--glass), transparent);
  --card2:color-mix(in srgb, var(--s-card2) var(--glass), transparent);
  --card3:color-mix(in srgb, var(--s-card3) var(--glass), transparent);
  --topbar:color-mix(in srgb, var(--s-bg) calc(var(--glass) - 8%), transparent);
  --glass-blur:16px;
}

html.wp .app,html.wp .ov,html.wp .palov,html.wp .toast,html.wp .fab,html.wp .nav{position:relative;z-index:2}

/* ===================== BUDGET — TABLE D'ENVELOPPES ===================== */
.tobud{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line2);
  border-radius:var(--r-l);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh-md);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tobud .lft{min-width:0}
.tobud .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.tobud .amt{font-size:30px;font-weight:780;letter-spacing:-.025em;line-height:1.15;margin-top:2px}
.tobud .brk{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.tobud .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tobud .acts button{font-size:12.5px;font-weight:650;padding:8px 13px;border-radius:var(--r-s);
  border:1px solid var(--line2);color:var(--mut);background:var(--bg2)}
.tobud .acts button:hover{color:var(--txt);border-color:var(--dim)}

.btab{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--card)}
.btab .bh,.btab .br{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px 104px;align-items:center;gap:8px}
.btab .bh{padding:10px 16px;background:var(--card2);border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.btab .bh span:not(:first-child),.btab .br .n{text-align:right}
.bgrp{display:flex;align-items:center;gap:9px;padding:11px 16px;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:11.5px;font-weight:750;color:var(--mut);
  letter-spacing:.04em;text-transform:uppercase}
.bgrp .tot{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;font-size:12.5px;color:var(--dim)}
.btab .br{padding:9px 16px;border-bottom:1px solid var(--line);position:relative;transition:background var(--tr)}
.btab .br:hover{background:var(--card2)}
.btab .br:last-child{border-bottom:none}
.btab .cn{display:flex;align-items:center;gap:9px;min-width:0;font-size:14px;font-weight:600}
.btab .cn .e{font-size:17px;flex-shrink:0}
.btab .cn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab .cn .cy{font-size:11px;font-weight:700;color:var(--tea);background:rgba(45,212,191,.12);
  border-radius:999px;padding:2px 7px;flex-shrink:0}
.bin{width:100%;text-align:right;padding:6px 9px;font-size:13.5px;font-weight:650;
  background:transparent;border:1px solid transparent;border-radius:var(--r-s);font-variant-numeric:tabular-nums}
.bin:hover{border-color:var(--line2);background:var(--bg2)}
.bin:focus{border-color:var(--ind);background:var(--bg2);box-shadow:0 0 0 3px var(--ind-soft)}
.bin.z{color:var(--dim);font-weight:500}
.btab .sp{text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--mut);padding-right:9px}
.btab .rest{text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;padding-right:4px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.pill.ok{color:var(--grn);background:var(--grn-soft)}
.pill.warn{color:var(--amb);background:var(--amb-soft)}
.pill.bad{color:var(--red);background:var(--red-soft)}
.pill.none{color:var(--dim);background:transparent;font-weight:500}
.brline{position:absolute;left:16px;right:16px;bottom:0;height:2px;border-radius:2px;background:transparent;overflow:hidden}
.brline i{display:block;height:100%;border-radius:2px}
@media(max-width:720px){
  .btab .bh{display:none}
  .btab .br{grid-template-columns:minmax(0,1fr) 92px;grid-template-areas:"c b" "s r";row-gap:2px;padding:11px 14px 13px}
  .btab .cn{grid-area:c} .btab .bwrap{grid-area:b}
  .btab .sp{grid-area:s;text-align:left;font-size:12px;padding:0}
  .btab .rest{grid-area:r;font-size:12.5px}
}

/* ===================== INTERFACE DE QUÊTE ===================== */
/* Toutes les surfaces passent par les tokens (--card, --bg2, --line) :
   le mode fond d'écran transparent continue de fonctionner tel quel. */
.chap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chap .rn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800}
.chap .ln{flex:1;height:1px;background:var(--line2)}

.qhead{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-xl);
  padding:18px;box-shadow:var(--sh-md);display:flex;gap:16px;align-items:center;
  cursor:pointer;transition:border-color var(--tr),transform .1s}
.qhead:hover{border-color:var(--ind)}
.qhead:active{transform:scale(.995)}
.ring{width:76px;height:76px;flex-shrink:0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .rv span{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-top:2px}
.qmeta{flex:1;min-width:0}
.qrank{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qrank .rk{font-size:17px;font-weight:800;letter-spacing:-.02em}
.qrank .lv{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ind2);background:var(--ind-soft);border-radius:999px;padding:3px 9px}
.qmeta .qd{font-size:12px;color:var(--mut);margin-top:3px}
.qxp{height:6px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.qxp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ind),var(--ind2));transition:width .6s cubic-bezier(.4,0,.2,1)}
.qxpi{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px;font-weight:600}

.qlist{display:grid;gap:10px}
.quest{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-l);padding:13px 15px;box-shadow:var(--sh);transition:border-color var(--tr)}
.quest:hover{border-color:var(--line2)}
.quest.on{border-color:rgba(52,211,153,.45);background:var(--grn-soft)}
.qic{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:17px;background:var(--bg2);border:1px solid var(--line2)}
.quest.on .qic{background:var(--grn);border-color:var(--grn);color:#04231A}
.quest.on .qic svg{width:17px;height:17px}
.qtx{flex:1;min-width:0}
.qtx .qt{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.quest.on .qtx .qt{color:var(--grn)}
.qtx .qs{font-size:11.5px;color:var(--dim);margin-top:1px}
.qtx .qb{height:4px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:7px}
.qtx .qb i{display:block;height:100%;border-radius:99px;background:var(--ind2);transition:width .4s}
.quest{align-items:flex-start}
.quest .qic svg{width:18px;height:18px}
.quest:not(.on) .qic{color:var(--ind2)}
.qtx .qt,.qtx .qs{display:block}
.qtx .qw{display:block;font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5;max-width:68ch}
.qtx .qw b{color:var(--txt);font-weight:700}
.qbr{display:flex;align-items:center;gap:10px;margin-top:9px}
.qbr .qb{flex:1;margin-top:0}
.qn{font-size:11px;color:var(--dim);font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.qact{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.qh{font-size:11px;color:var(--dim);font-style:italic}
.qgo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:var(--r-s);
  padding:7px 12px;background:var(--ind);color:#fff;border:1px solid transparent;transition:filter var(--tr),background var(--tr)}
.qgo:hover{filter:brightness(1.07)}
.qgo svg{width:14px;height:14px}
.qgo.ghost{background:transparent;color:var(--txt);border-color:var(--line2)}
.qgo.ghost:hover{background:var(--card2);filter:none}
.qgo:focus-visible,.defi .icb:focus-visible{outline:2px solid var(--ind2);outline-offset:2px}
.defi .qgo{background:var(--amb);color:var(--s-card)}
.quest.honor .qic{border-style:dashed}
.quest.full{box-shadow:none;background:var(--card2)}
.defi{position:relative;background:var(--card);border:1px dashed var(--line2);border-radius:var(--r-l);
  padding:16px 16px 14px;display:flex;flex-direction:column}
.defi .dic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--amb-soft);color:var(--amb)}
.defi .dic svg{width:19px;height:19px}
.defi .dt{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.35;margin-top:12px;text-wrap:balance}
.defi .dw{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5}
.defi .da{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:14px}
.defi .dxp{margin-left:auto;font-size:11px;font-weight:800;color:var(--amb)}
.defi .dok{font-size:12.5px;font-weight:700;color:var(--grn)}
.defi.on{border-style:solid;border-color:rgba(92,127,63,.45);background:var(--grn-soft)}
.defi.on .dic{background:var(--grn);color:var(--s-card)}
.qxpc{font-size:11px;font-weight:800;color:var(--ind2);background:var(--ind-soft);
  border-radius:999px;padding:5px 10px;flex-shrink:0;white-space:nowrap}
.quest.on .qxpc{color:var(--grn);background:transparent;border:1px solid rgba(52,211,153,.4)}

/* Liste de dépenses par poste, façon appli bancaire mobile */
.spend{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.spend:last-child{border-bottom:none}
.spend .sic{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:16px}
.spend .sg{flex:1;min-width:0}
.spend .sn{font-size:13.5px;font-weight:650;display:flex;justify-content:space-between;gap:10px}
.spend .sn b{font-variant-numeric:tabular-nums;flex-shrink:0}
.spend .sb{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.spend .sb i{display:block;height:100%;border-radius:99px}
.spend .ss{font-size:11px;color:var(--dim);margin-top:4px}

.sech{display:flex;align-items:baseline;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
  background:var(--card2)}
.sech .st{font-size:14px;font-weight:750;letter-spacing:-.01em}
.sech .sc{font-size:11.5px;color:var(--dim);margin-right:auto}
.sech b{font-size:16px;font-weight:780;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mb{margin-bottom:14px}

/* ===================== PLAN D'ACHATS ===================== */
.secban{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:0 2px}
.secban b{font-size:15px;font-weight:780;letter-spacing:-.015em}
.secban span{font-size:12px;color:var(--dim)}
.planline{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 13px;border-radius:var(--r-m);background:var(--bg2);border:1px solid var(--line);margin-bottom:12px}
.planline span{font-size:12.5px;color:var(--mut)}
.planline b{font-size:17px;font-weight:780;font-variant-numeric:tabular-nums}
.pmonth{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;margin-bottom:9px}
.pmonth.now{border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-soft)}
.pmonth.past{opacity:.55}
.pmh{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.pmh b{font-weight:750;font-variant-numeric:tabular-nums}
.pnow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ind2);background:var(--ind-soft);border-radius:999px;padding:2px 7px;vertical-align:middle}
.pitem{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.pitem .pn{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .pd{font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap}
.pitem b{font-size:13px;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}

/* ===================== COURSES ===================== */
/* Le sac se dessine en SVG selon l'univers ; il se remplit avec les tickets
   et déborde quand la limite est dépassée. */
.shopbag{display:flex;flex-direction:column;align-items:center;text-align:center}
.wkrow{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:10px 2px 2px;scrollbar-width:none}
.wkrow::-webkit-scrollbar{display:none}
.wk{flex-shrink:0;font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.wk:hover{color:var(--txt);border-color:var(--dim)}
.wk.on{background:var(--ind-soft);border-color:var(--ind);color:var(--ind2)}
.bagw{width:100%;display:flex;justify-content:center;margin:10px 0 2px}
.bagsvg{width:min(230px,64vw);height:auto;overflow:visible}
.bagsvg .bgi{font-size:21px;text-anchor:middle;dominant-baseline:central}
.bagsvg.over{animation:bagwob 1.8s ease-in-out infinite;transform-origin:50% 92%}
.bagsvg .ghost{opacity:.5;filter:grayscale(.4)}
.bagsvg .spill{animation:bagspill .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes bagwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes bagspill{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.bagnum{margin-top:4px;font-size:13px;color:var(--mut)}
.bagnum b{font-size:28px;font-weight:780;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-right:6px}
.bagmsg{font-size:12.5px;font-weight:650;margin-top:2px}
.shlim{width:100%;margin-top:14px;border-top:1px solid var(--line);padding-top:4px;text-align:left}
.shlim .set{border-bottom:none}
.shk{width:100%;text-align:left;margin-top:10px}
.shbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);margin-bottom:6px}
.shbar i{display:block;height:100%}
.shkl{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.shkl .dt{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.shkl span{flex:1;color:var(--mut)}
.shkl b{font-variant-numeric:tabular-nums;font-size:12.5px}
.shi{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.shi:last-of-type{border-bottom:none}
.shck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:flex;
  align-items:center;justify-content:center;color:var(--dim)}
.shck:hover{border-color:var(--ind);color:var(--ind2)}
.shck svg{width:13px;height:13px}
.shi.part .shck{border-color:var(--amb)}
.shi.done .shck{background:var(--grn);border-color:var(--grn);color:var(--s-card)}
.she{font-size:20px;width:26px;text-align:center;flex-shrink:0;line-height:1}
.shn{flex:1;min-width:0;display:flex;flex-direction:column}
.shn b{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shn small{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shn b{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.6px;width:fit-content;max-width:100%}
.shi.done .shn b{color:var(--mut);background-size:100% 1.6px}
.shn .pg{height:3px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:5px;max-width:160px}
.shn .pg i{display:block;height:100%;background:var(--amb);border-radius:99px}
.shq{font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.shgrp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:14px 0 2px}
.shl{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--r-m);border:1px solid transparent;margin-top:3px}
.shl.on{background:var(--ind-soft);border-color:var(--ind)}
.stp{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:2px;flex-shrink:0}
.stp button{width:28px;height:28px;border-radius:50%;font-size:16px;font-weight:700;color:var(--mut)}
.stp button:hover{background:var(--card3);color:var(--txt)}
.stp b{min-width:20px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
input.shp{width:72px;flex-shrink:0;padding:7px 9px;font-size:12.5px;text-align:right}
@media(max-width:400px){input.shp{width:60px}.shl{gap:6px;padding:6px 4px}}
.wk.cur{font-weight:800}
.wk.ok{color:var(--grn);border-color:rgba(52,211,153,.4)}
.wk.bad{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.bagmsg.amb{color:var(--amb)}.bagmsg.red{color:var(--red)}
.shcalc{font-size:13px;color:var(--mut);margin-top:4px;font-variant-numeric:tabular-nums}
.shcalc span{font-size:11px;color:var(--dim)}
.shcalc b{color:var(--txt)}
.shfc{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.shfc small{display:block;font-size:11px;color:var(--mut);margin-top:2px;line-height:1.3}
.shfc .tot{border-color:var(--ind);background:var(--ind-soft)}
@media(max-width:420px){.shfc b{font-size:15px}.shfc div{padding:8px 8px}}
.shfc div{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-m);padding:8px 11px;text-align:left}
.shfc span{display:block;font-size:11px;color:var(--dim);font-weight:650}
.shfc b{font-size:17px;font-weight:780;font-variant-numeric:tabular-nums;letter-spacing:-.015em}

/* --- La liste : une feuille écrite, propre à chaque univers --- */
:root{--ink:var(--ind2)}
html[data-theme="taverne"]{--ink:#5B3E24}
html[data-theme="boise"]{--ink:#D9A441}
html[data-theme="france"]{--ink:#D4AF37}
html[data-theme="synthwave"]{--ink:#FF2E97}
html[data-theme="cyberpunk"]{--ink:#00FF9C}
.slist{position:relative}
.slist .ttl{align-items:baseline;flex-wrap:wrap}
.slt::before{content:"✎ ";color:var(--ink)}
.sln{text-transform:none;letter-spacing:0;font-weight:600;color:var(--dim)}
.sle{font-size:14px;font-weight:780;color:var(--txt);text-transform:none;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.slr{font-size:12px;color:var(--mut);margin:-6px 0 4px}
.slist .shi{border-bottom-style:dashed}
.slist .shq{min-width:62px;text-align:right}
/* cahier : la marge rouge */
.slist::before{content:"";position:absolute;top:0;bottom:0;left:50px;width:1.5px;background:var(--red);opacity:.2;pointer-events:none}
.shi.just .shck{animation:rpop .4s cubic-bezier(.16,1,.3,1)}
.shi.just.done .shn b{animation:shstrike .45s ease-out both}
@keyframes shstrike{from{background-size:0 1.6px}to{background-size:100% 1.6px}}
.slist.anim .shi,.shi.new{animation:shwrite .5s ease-out both;animation-delay:calc(var(--i) * 70ms)}
.shi.new{animation-delay:0s}
@keyframes shwrite{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.shadd{display:flex;gap:6px;align-items:center;margin-top:10px}
.shadd input{padding:9px 12px;font-size:13.5px;background:transparent;border-style:dashed}
.shadd input:focus{border-style:solid}
.shfoot{display:flex;align-items:flex-end;gap:10px;margin-top:10px;min-height:38px;flex-wrap:wrap}
.pent{margin-left:auto;font-size:12px;font-style:italic;color:var(--ink);font-weight:650}
.shpen{position:relative;width:130px;height:38px;flex-shrink:0}
.shpen .scrib{position:absolute;left:0;bottom:2px;width:100px;height:28px;overflow:visible}
.shpen .scrib path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:0}
.shpen .pen{position:absolute;left:92px;bottom:12px;width:30px;height:30px;transform:translate(6px,-5px) rotate(-14deg);transform-origin:8% 92%}
.shpen .pen svg{width:100%;height:100%;overflow:visible}
/* À l'arrivée : la liste s'écrit ligne à ligne, puis le crayon signe et se relève */
.slist.anim .scrib path{animation:shink 1.1s ease-in-out both;animation-delay:calc(var(--n) * 70ms + .3s)}
.slist.anim .pen{animation:shpenmv 1.5s ease-in-out both;animation-delay:calc(var(--n) * 70ms + .3s)}
.slist.anim .pent{animation:shfade .4s both;animation-delay:calc(var(--n) * 70ms + 1.6s)}
@keyframes shink{from{stroke-dashoffset:150}to{stroke-dashoffset:0}}
@keyframes shpenmv{
  0%{left:0;transform:translate(0,2px)}
  14%{left:12px;transform:translate(0,-8px)}
  28%{left:24px;transform:translate(0,6px)}
  42%{left:46px;transform:translate(0,-2px)}
  56%{left:66px;transform:translate(0,-8px)}
  70%{left:84px;transform:translate(0,-6px)}
  80%{left:92px;transform:translate(0,0)}
  100%{left:92px;transform:translate(6px,-5px) rotate(-14deg)}}
@keyframes shfade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
html[data-theme="synthwave"] .shpen .scrib path{filter:drop-shadow(0 0 3px #FF2E97)}
html[data-theme="cyberpunk"] .shpen .pen{animation-timing-function:steps(14,end)}

/* Taverne : parchemin, petites capitales, encre brune */
html[data-theme="taverne"] .slist::before,html[data-theme="boise"] .slist::before,html[data-theme="france"] .slist::before,
html[data-theme="synthwave"] .slist::before,html[data-theme="cyberpunk"] .slist::before{display:none}
html[data-theme="taverne"] .slist{background:radial-gradient(ellipse at 15% 0%,rgba(193,120,42,.12),transparent 60%),
  radial-gradient(ellipse at 100% 100%,rgba(120,86,50,.12),transparent 55%),var(--card);
  border-color:var(--line2);box-shadow:var(--sh),inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--line)}
html[data-theme="taverne"] .slist .ttl,html[data-theme="boise"] .slist .ttl,html[data-theme="france"] .slist .ttl{
  font-variant:small-caps;text-transform:none;letter-spacing:.06em;font-size:14.5px}
html[data-theme="taverne"] .slt::before{content:"❦ "}
html[data-theme="taverne"] .slist .shn b,html[data-theme="boise"] .slist .shn b{font-style:italic;font-size:14.5px}
html[data-theme="taverne"] .slist .shi{border-bottom-color:var(--line2);border-bottom-style:dotted}
/* Boisé : parchemin sombre aux bords brûlés */
html[data-theme="boise"] .slist{box-shadow:var(--sh-md),inset 0 0 26px rgba(0,0,0,.5);border-color:#6B5033}
html[data-theme="boise"] .slt::before{content:"✠ "}
html[data-theme="boise"] .slist .shi{border-bottom-color:rgba(217,164,65,.22)}
/* Empire : papier bleu nuit, fleur de lys, filets dorés */
html[data-theme="france"] .slt::before{content:"⚜ "}
html[data-theme="france"] .slist .shi{border-bottom:1px solid rgba(212,175,55,.22)}
html[data-theme="france"] .slist .shck{border-color:rgba(212,175,55,.6)}
/* Synthwave : néon */
html[data-theme="synthwave"] .slist{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,46,151,.25),0 0 22px rgba(255,46,151,.2)}
html[data-theme="synthwave"] .slt::before{content:"✦ ";text-shadow:0 0 8px currentColor}
html[data-theme="synthwave"] .slist .shi{border-bottom:1px solid rgba(0,229,255,.22)}
html[data-theme="synthwave"] .slist .shi.done .shn b{text-shadow:0 0 6px currentColor}
/* Cyberpunk : terminal */
html[data-theme="cyberpunk"] .slist{border-left:3px solid var(--amb)}
html[data-theme="cyberpunk"] .slt::before{content:"> ";color:var(--grn)}
html[data-theme="cyberpunk"] .slist .shck{border-radius:2px}
html[data-theme="cyberpunk"] .slist .shn b{text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}
html[data-theme="cyberpunk"] .slist .shi{border-bottom-style:dotted}
html[data-theme="cyberpunk"] .pent::after{content:"_";animation:shcur 1s steps(1) infinite}
@keyframes shcur{50%{opacity:0}}

/* ===================== COMPAGNON ===================== */
/* Fixé en bas à gauche sur toutes les vues. Il donne les quêtes,
   parle dans une bulle et annonce les récompenses en haut de l'écran. */
#mate{position:fixed;left:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:46;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
#mate.off{display:none}
#mate{transition:opacity .25s,transform .25s}
/* Il s'efface complètement quand une modale ou la palette est ouverte */
#ov.on ~ #mate,#palov.on ~ #mate{opacity:0;pointer-events:none;transform:translateY(8px)}
/* Il s'estompe pendant le défilement, puis revient tout seul */
#mate.shy{opacity:.22;pointer-events:none}
#mate.shy:hover{opacity:.9;pointer-events:auto}
.mrow{display:flex;align-items:flex-end;gap:4px}
/* Replié : il glisse hors champ, il n'en reste qu'un liseré cliquable */
#mate.peek .masc{transform:translateX(-64%);opacity:.42;filter:none}
#mate.peek .masc:hover{transform:translateX(-42%);opacity:.8}
#mate.peek .mtalk{opacity:.75}
.mtalk{pointer-events:auto;width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--card);border:1px solid var(--line2);box-shadow:var(--sh-md);
  font-size:14px;line-height:1;margin-bottom:6px;transition:transform .15s,border-color var(--tr)}
.mtalk:hover{transform:scale(1.12);border-color:var(--ind)}
html.wp .mtalk{backdrop-filter:blur(var(--glass-blur))}
/* Sur PC il habite le bas de la barre latérale, au lieu de recouvrir les cartes */
@media(min-width:960px){#mate{left:18px;bottom:112px}}
@media(max-width:400px){#mate{left:6px;bottom:calc(74px + env(safe-area-inset-bottom))}}

.masc{width:104px;height:auto;pointer-events:auto;cursor:pointer;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.32));transition:transform .18s cubic-bezier(.16,1,.3,1)}
.masc:hover{transform:translateY(-4px) scale(1.04)}
.masc:active{transform:scale(.97)}
@media(max-width:520px){.masc{width:78px}}
@media(max-width:360px){.masc{width:66px}}

.mbub{pointer-events:auto;max-width:min(280px,72vw);background:var(--card);border:1px solid var(--line2);
  border-radius:14px 14px 14px 4px;padding:11px 13px;box-shadow:var(--sh-lg);position:relative;
  font-size:13px;line-height:1.5;opacity:0;transform:translateY(6px) scale(.96);
  transition:opacity .22s,transform .22s cubic-bezier(.16,1,.3,1)}
html.wp .mbub{backdrop-filter:blur(var(--glass-blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.4)}
.mbub.on{opacity:1;transform:none}
.mbub b{color:var(--ind2)}
.mbub .mact{display:block;margin-top:8px;font-size:12px;font-weight:750;color:var(--ind2)}
.mbub .mx{position:absolute;top:4px;right:5px;width:22px;height:22px;border-radius:50%;
  color:var(--dim);font-size:15px;line-height:20px;text-align:center}
.mbub .mx:hover{background:var(--card3);color:var(--txt)}
@media(max-width:520px){.mbub{font-size:12.5px;max-width:66vw}}

/* Bandeau de récompense, en haut de l'écran */
#reward{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-130%);z-index:80;
  margin-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:11px;
  background:var(--card2);border:1px solid var(--ind);border-radius:999px;padding:9px 16px 9px 11px;
  box-shadow:var(--sh-lg),0 0 26px var(--ind-soft);transition:transform .42s cubic-bezier(.16,1,.3,1);
  max-width:calc(100vw - 24px)}
#reward.on{transform:translateX(-50%) translateY(0)}
html.wp #reward{backdrop-filter:blur(var(--glass-blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.4)}
#reward .rx{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;background:var(--ind-soft);color:var(--ind2);
  border:1.5px solid var(--ind)}
#reward .rt{min-width:0}
#reward .rt b{display:block;font-size:13.5px;font-weight:750;letter-spacing:-.01em}
#reward .rt span{display:block;font-size:11.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes rpop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
#reward.on .rx{animation:rpop .5s cubic-bezier(.16,1,.3,1)}


/* ----- Série, badges, tenues ----- */
.streak{display:flex;align-items:center;gap:11px;margin-top:12px;padding:10px 12px;border-radius:14px;
  background:var(--card2);border:1px solid var(--line)}
.streak .fl{font-size:24px;line-height:1;filter:grayscale(1);opacity:.55;transition:filter .3s,opacity .3s}
.streak.ok .fl,.streak.risk .fl{filter:none;opacity:1}
.streak.ok .fl{animation:flick 1.6s ease-in-out infinite}
.streak.risk{border-color:var(--amb)}
.streak.ok{border-color:rgba(255,140,60,.55);box-shadow:0 0 18px rgba(255,140,60,.15)}
.streak .sk{flex:1;min-width:0}
.streak .sk b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
.streak .sk span{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.streak .qgo{flex-shrink:0;font-size:12px}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
#reward.fire{border-color:#FF8C3C;box-shadow:var(--sh-lg),0 0 26px rgba(255,140,60,.35)}
#reward.fire .rx{background:rgba(255,140,60,.18);border-color:#FF8C3C;color:#FF8C3C;font-size:17px}
#reward.badge .rx{font-size:18px;border-color:var(--amb);background:rgba(242,193,78,.18)}
#reward.lvl{border-color:var(--amb);box-shadow:var(--sh-lg),0 0 30px rgba(242,193,78,.35)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 8px;
  border-radius:14px;background:var(--card2);border:1px solid var(--line);opacity:.55}
.bdg.on{opacity:1;border-color:var(--amb);box-shadow:0 0 14px rgba(242,193,78,.12)}
.bdg .be{font-size:26px;line-height:1.1}
.bdg b{font-size:12.5px;font-weight:750}
.bdg span{font-size:10.5px;color:var(--dim);line-height:1.35}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:6px}
.wear{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:14px;
  background:var(--card2);border:1.5px solid var(--line);color:var(--txt);cursor:pointer;font:inherit}
.wear svg{width:46px;height:40px}
.wear .wn{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center}
.wear .wl{font-size:10.5px;color:var(--dim)}
.wear.on{border-color:var(--ind);background:var(--ind-soft)}
.wear.lock{opacity:.5;cursor:default}
.wear.lock svg{filter:grayscale(1) brightness(.6)}
.maura{animation:aura 3.2s ease-in-out infinite;transform-origin:60px 70px}
@keyframes aura{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.streak.ok .fl,.maura{animation:none}}
/* Animations du personnage */
.masc .mbody{animation:mbob 3.6s ease-in-out infinite;transform-origin:60px 145px}
.masc .mhair{animation:msway 4.8s ease-in-out infinite;transform-origin:58px 20px}
.masc .mcape{animation:msway 4.2s ease-in-out infinite;transform-origin:58px 56px}
.masc .marm{animation:mwave 3.2s ease-in-out infinite;transform-origin:74px 58px}
.masc .meye{animation:mblink 5.4s infinite;transform-box:fill-box;transform-origin:center}
.masc .mspark{animation:mspk 2.6s ease-in-out infinite}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes msway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes mwave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(9deg)}}
@keyframes mblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes mspk{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* ===================== PROGRESSION ===================== */
.xpbar{height:7px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ind),var(--ind2));transition:width .5s cubic-bezier(.4,0,.2,1)}
.xpinfo{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:5px}

.msn{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.msn:last-child{border-bottom:none}
.msn .ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--line2);
  display:flex;align-items:center;justify-content:center;color:var(--bg2)}
.msn.done .ck{background:var(--grn);border-color:var(--grn);color:#04231A}
.msn .ck svg{width:12px;height:12px}
.msn .gr{flex:1;min-width:0}
.msn .t{font-size:13.5px;font-weight:650}
.msn.done .t{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line2)}
.msn .d{font-size:11.5px;color:var(--dim);margin-top:1px}
.msn .pg{height:4px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.msn .pg i{display:block;height:100%;border-radius:99px;background:var(--ind2)}
.msn .rw{font-size:11px;font-weight:750;color:var(--ind2);background:var(--ind-soft);
  border-radius:999px;padding:4px 9px;flex-shrink:0}
.msn.done .rw{color:var(--grn);background:var(--grn-soft)}
.sbar{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px}
.sbar .n{flex:1;color:var(--mut)}
.sbar .b{width:96px;height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;flex-shrink:0}
.sbar .b i{display:block;height:100%;border-radius:99px}
.sbar .p{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:12px}

/* Réglages d'apparence (vue Paramètres) */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-top:10px}
.thc{border:1.5px solid var(--line);border-radius:var(--r-m);padding:8px;text-align:left;background:var(--bg2);transition:border-color var(--tr),transform .08s}
.thc:hover{border-color:var(--line2)}
.thc.on{border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-soft)}
.thc .sw{height:34px;border-radius:8px;border:1px solid rgba(128,128,140,.28);display:flex;overflow:hidden;margin-bottom:6px}
.thc .sw i{flex:1}
.thc .nm{font-size:12px;font-weight:650;color:var(--txt);display:block}
.thc .uv{display:block;font-size:11px;color:var(--dim);line-height:1.35;margin-top:2px}
.acrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.acc{width:32px;height:32px;border-radius:50%;border:2px solid transparent;position:relative;transition:transform .1s}
.acc:hover{transform:scale(1.08)}
.acc.on{border-color:var(--txt);box-shadow:0 0 0 3px var(--ind-soft)}
.rng{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rng label{flex:1;font-size:13.5px;font-weight:600}
.rng input[type=range]{flex:1.4;width:auto;padding:0;background:none;border:none;accent-color:var(--ind)}
.rng .v{width:52px;text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.wpprev{height:96px;border-radius:var(--r-m);border:1px solid var(--line2);background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12.5px;margin-top:10px;background-color:var(--bg2)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:var(--ind-soft)}
html{scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
body{background:var(--bg);color:var(--txt);font-family:var(--font);
  font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;transition:background var(--tr),color var(--tr),border-color var(--tr),box-shadow var(--tr),transform .08s}
button:active{transform:scale(.98)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ind2);outline-offset:2px;border-radius:6px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 13px;
  color:var(--txt);width:100%;transition:border-color var(--tr),box-shadow var(--tr)}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{border-color:var(--ind);box-shadow:0 0 0 3px var(--ind-soft)}
input::placeholder,textarea::placeholder{color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===================== LAYOUT ===================== */
.app{min-height:100vh}
.side{display:none}
.main{padding-bottom:96px;min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:var(--topbar);border-bottom:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.tb-in{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .lg{width:24px;height:24px;flex-shrink:0;display:block}
.brand .lg svg{width:100%;height:100%;display:block}
:root{--trim-lg:#FFFFFF}
html[data-theme="clair"],html[data-theme="creme"]{--trim-lg:#FFFFFF}
.brand b{color:var(--ind2)}
.vtitle{display:none;font-size:15px;font-weight:750;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;gap:2px}
.mbtn{font-size:13.5px;font-weight:650;padding:8px 12px;border-radius:var(--r-s);min-width:126px;text-align:center;border:1px solid transparent}
.mbtn:hover{background:var(--card);border-color:var(--line)}
.today{font-size:11px;font-weight:700;color:var(--ind2);background:var(--ind-soft);border-radius:999px;padding:5px 11px;display:none}
.today.on{display:inline-block}
.icb{width:38px;height:38px;border-radius:var(--r-s);color:var(--mut);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icb:hover{background:var(--card);color:var(--txt)}
.icb.on{color:var(--ind2);background:var(--ind-soft)}
.icb svg{width:18px;height:18px}
.wrap{padding:16px}
.view{animation:vin .2s cubic-bezier(.4,0,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Grille 12 colonnes */
.dg{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.dg>*{grid-column:span 12;min-width:0}
.autofill{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.autofit{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* Desktop ≥960px : sidebar + pleine largeur */
@media(min-width:960px){
  .app{display:grid;grid-template-columns:var(--sb) 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px}
  .side .brand{font-size:19px;padding:8px 12px 6px}
  .side .tagline{font-size:11px;color:var(--dim);padding:0 12px 18px}
  .sgrp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:14px 12px 6px}
  .sbtn{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-s);
    font-size:13.5px;font-weight:600;color:var(--mut);width:100%;text-align:left;margin-bottom:1px;position:relative}
  .sbtn svg{width:17px;height:17px;flex-shrink:0}
  .sbtn:hover{background:var(--card);color:var(--txt)}
  .sbtn.on{background:var(--ind-soft);color:var(--ind2)}
  .sbtn.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--ind)}
  .sbtn .kbd{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .side .foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 2px}
  .pchip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);width:100%;text-align:left}
  .pchip:hover{background:var(--card)}
  .pavatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ind),var(--ind2));
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
  .pchip .n{font-size:12.5px;font-weight:650}
  .pchip .d{font-size:11px;color:var(--dim)}
  .main{padding-bottom:40px}
  .topbar .brand{display:none}
  .vtitle{display:block}
  .tb-in{padding:10px 28px}
  .wrap{padding:24px 28px;max-width:1760px;margin:0 auto}
  nav.bottom{display:none}
  .fab{right:32px;bottom:32px}
  /* spans desktop */
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
  .c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
}
@media(min-width:1500px){.wrap{padding:28px 40px}.dg{gap:16px}}
/* Zone 960-1199 : la grille dashboard se réorganise pour éviter les colonnes trop étroites */
@media(min-width:960px) and (max-width:1199px){
  .c8{grid-column:span 12}.c7{grid-column:span 6}.c5{grid-column:span 6}.c4{grid-column:span 6}.c3{grid-column:span 12}
  .cdefi{grid-column:span 12}.defi{height:auto}
}
/* Petits mobiles : la topbar reste intacte */
@media(max-width:420px){
  .topbar .brand{display:none}
  .mbtn{min-width:102px;font-size:13px;padding:8px 6px}
  .tb-in{padding:10px 10px}
}
.statgrid{max-width:1280px}
/* Bandeau de contexte temporel */
.ctxbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ind-soft);
  border:1px solid rgba(99,102,241,.3);border-radius:var(--r-m);padding:9px 14px;margin-bottom:14px;font-size:13px}
.ctxbar b{color:var(--ind2)}
.ctxbar button{color:var(--ind2);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:8px}
.ctxbar button:hover{background:rgba(99,102,241,.2)}
/* Garde "modifications non enregistrées" */
.warnbar{background:var(--amb-soft);border:1px solid rgba(251,191,36,.4);color:var(--amb);
  border-radius:var(--r-s);padding:9px 13px;font-size:12.5px;font-weight:600;margin-bottom:12px;
  animation:vin .18s}
/* Modale large */
@media(min-width:640px){.sheet.wide{max-width:640px}}
/* Checklist d'onboarding */
.onb{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(167,139,250,.1));border:1px solid rgba(99,102,241,.3)}
.onb .step{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:13.5px}
.onb .step .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.onb .step.done .ck{background:var(--grn);border-color:var(--grn);color:#06281B}
.onb .step.done span{color:var(--dim);text-decoration:line-through}
.onb .step .ck svg{width:13px;height:13px}
/* ===================== PALETTE DE COMMANDES ===================== */
.pal-ov{position:fixed;inset:0;background:rgba(6,6,9,.6);z-index:80;display:none;justify-content:center;
  padding-top:14vh;backdrop-filter:blur(5px)}
.pal-ov.on{display:flex}
.pal{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:var(--r-l);
  width:min(580px,92%);height:fit-content;max-height:60vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--sh-lg),inset 0 1px 0 rgba(255,255,255,.05);animation:palin .16s cubic-bezier(.3,1.1,.5,1)}
@keyframes palin{from{opacity:0;transform:translateY(-8px) scale(.99)}to{opacity:1;transform:none}}
.pal input{border:none;background:none;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:15px}
.pal input:focus{box-shadow:none;border-color:var(--line2)}
.pal-list{overflow-y:auto;padding:7px}
.pal-grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:8px 11px 4px}
.pal-it{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-s);font-size:13.5px;
  color:var(--mut);cursor:pointer;width:100%;text-align:left}
.pal-it svg{width:16px;height:16px;flex-shrink:0}
.pal-it .sub{margin-left:auto;font-size:11.5px;color:var(--dim)}
.pal-it .kbd{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.pal-it.sel{background:var(--ind-soft);color:var(--txt)}
.pal-it.sel svg{color:var(--ind2)}
.pal-foot{border-top:1px solid var(--line);padding:8px 14px;font-size:11px;color:var(--dim);display:flex;gap:14px}
.pal-foot b{border:1px solid var(--line2);border-radius:5px;padding:0 5px;font-size:11px;color:var(--mut)}

/* ===================== COMPOSANTS ===================== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--sh)}
.card.flush{padding:6px 16px}
.card.hover:hover{border-color:var(--line2);background:var(--card2);box-shadow:var(--sh-md)}
.mb{margin-bottom:14px}
.hero{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line2);
  border-radius:var(--r-xl);padding:20px 22px;box-shadow:var(--sh-md)}
/* le liseré tricolore reste propre au thème France */
html[data-theme="france"] .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.85}
html.wp .hero{backdrop-filter:blur(var(--glass-blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.4)}
.hero .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.035em;margin-top:1px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.hero .sub{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.hero .ldg{border-bottom:1px solid var(--line);padding-bottom:10px}
.hero .lrow{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;gap:12px}
.hero .lrow .ll{font-size:13px;color:var(--mut);font-weight:600}
.hero .lrow b{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.hero .trend{display:block;margin:6px 0 0;font-size:11.5px;font-weight:700}
.hero .flow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  border-radius:999px;padding:5px 11px;border:1px solid var(--line2);color:var(--mut);background:var(--bg2);
  font-variant-numeric:tabular-nums}
.hero .flow.up{color:var(--grn);border-color:rgba(52,211,153,.35);background:var(--grn-soft)}
.hero .flow.dn{color:var(--mut)}
.hero .trend{margin-left:auto;font-size:11.5px;font-weight:700}
.hero .burn{height:6px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);
  overflow:hidden;margin-top:14px}
.hero .burn i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.hero .bl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
  margin-top:5px;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.stat .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700}
.stat .v{font-size:22px;font-weight:750;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.stat .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.ttl{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.03em;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grn{color:var(--grn)}.red{color:var(--red)}.amb{color:var(--amb)}.tea{color:var(--tea)}.ind{color:var(--ind2)}.dim{color:var(--dim)}.vio{color:var(--vio)}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}

.act{display:flex;gap:2px;opacity:0;transition:opacity var(--tr)}

.mini{width:32px;height:32px;border-radius:var(--r-s);color:var(--dim);display:flex;align-items:center;justify-content:center}

.empty{text-align:center;color:var(--dim);font-size:13.5px;padding:36px 16px;line-height:1.7}

/* Table desktop des opérations */
.thead{display:none}
@media(min-width:960px){
  .thead{display:grid;grid-template-columns:46px 1.6fr 110px 120px 110px 130px 84px;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);font-weight:700}
  .trow{display:grid;grid-template-columns:46px 1.6fr 110px 120px 110px 130px 84px;gap:10px;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:none}
  .trow:hover{background:var(--card2)}
  .thead button{font-size:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;font-weight:inherit;
    display:flex;align-items:center;gap:4px;padding:0}
  .thead button:hover{color:var(--txt)}
  .thead button.on{color:var(--ind2)}
  .tfoot{display:flex;justify-content:space-between;align-items:center;padding:11px 0 8px;border-top:1px solid var(--line2);
    font-size:12.5px;color:var(--dim);flex-wrap:wrap;gap:8px}
  .tcell{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.mob{display:none}
}
@media(max-width:959px){.trow{display:none}}

.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:650;border:1px solid var(--line2);color:var(--mut)}
.chip:hover{border-color:var(--dim);color:var(--txt)}
.chip.on{background:var(--txt);color:var(--s-bg);border-color:var(--txt)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dash{width:100%;border:1.5px dashed var(--line2);color:var(--mut);border-radius:var(--r-l);padding:12px;
  font-size:13.5px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}
.dash svg{width:15px;height:15px}
.dash:hover{border-color:var(--ind);color:var(--ind2);background:var(--ind-soft)}
.btn{background:linear-gradient(180deg,var(--ind2),var(--ind));color:#fff;font-weight:700;border-radius:var(--r-m);

.btn.danger{background:var(--red);color:#fff}
.btn.danger:hover{box-shadow:0 4px 14px rgba(251,113,133,.3)}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--mut);box-shadow:none}
.btn.ghost:hover{border-color:var(--dim);color:var(--txt);background:var(--card3)}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:12px 0 5px;display:block}
/* Saisie épurée : le montant occupe la place, le reste s'efface */
.amtwrap{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line2);padding-bottom:6px;margin-top:4px}
.amtwrap input,.amtwrap input:focus,.amtwrap input:hover{
  border:0!important;outline:0!important;background:transparent!important;
  padding:0!important;margin:0!important;box-shadow:none!important;border-radius:0!important;
  width:100%;min-width:0;font-size:40px;font-weight:780;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;color:var(--txt);line-height:1.1}
.amtwrap input::placeholder{color:var(--line2)}
.amtwrap .cur{font-size:22px;font-weight:700;color:var(--dim);flex-shrink:0}
.amtwrap:focus-within{border-bottom-color:var(--ind)}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.crow input,.crow select{width:auto;flex:1;min-width:120px;padding:9px 11px;font-size:13px}
.pillseg{display:inline-flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}

.pillseg button.on.g{color:var(--grn)}.pillseg button.on.a{color:var(--amb)}
.err{color:var(--red);font-size:12px;margin-top:5px}
.card a{color:var(--ind2);text-underline-offset:2px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 11px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
button.tag:hover{border-color:var(--dim);color:var(--txt)}
.tag.h{color:var(--red);border-color:rgba(251,113,133,.45);background:var(--red-soft)}
.tag.m{color:var(--amb);border-color:rgba(251,191,36,.45);background:var(--amb-soft)}
.tag.g{color:var(--grn);border-color:rgba(52,211,153,.45);background:var(--grn-soft)}
.tag.i{color:var(--ind2);border-color:rgba(99,102,241,.45);background:var(--ind-soft)}
.tag.v{color:var(--vio);border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.12)}

.fab{position:fixed;bottom:86px;right:16px;width:56px;height:56px;border-radius:var(--r-l);

nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--topbar);border-top:1px solid var(--line);

.nb{flex:1;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--dim)}
.nb svg{width:18px;height:18px}
.nb.on{color:var(--ind2)}

.ov{position:fixed;inset:0;background:rgba(6,6,9,.7);z-index:60;display:flex;align-items:flex-end;justify-content:center;

.big-in{font-size:30px!important;font-weight:750;letter-spacing:-.02em}

.cat{border:1px solid transparent;border-radius:var(--r-m);padding:7px 4px;font-size:11px;font-weight:650;

.cat:hover{background:var(--bg2);color:var(--mut)}

.cat.on .e{transform:scale(1.12)}
.two{display:flex;gap:10px}
.two>*{flex:1;min-width:0}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-m);padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;border-radius:9px;padding:8px;font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--card3);color:var(--txt);box-shadow:var(--sh)}
.seg button.on.g{color:var(--grn)}.seg button.on.a{color:var(--amb)}.seg button.on.i{color:var(--ind2)}
.sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:12px}
.sfoot .hint{font-size:11px;color:var(--dim)}
.sfoot .hint b{border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--mut)}
.sfoot .btn{width:auto;min-width:150px}

/* ===================== TOAST ===================== */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(160%);
  background:var(--card3);border:1px solid var(--line2);color:var(--txt);box-shadow:var(--sh-lg);
  font-size:13.5px;font-weight:600;padding:11px 12px 11px 18px;border-radius:var(--r-m);z-index:70;
  transition:transform .26s cubic-bezier(.16,1,.3,1),opacity .2s;max-width:min(92%,440px);
  display:flex;align-items:center;gap:12px;pointer-events:none;opacity:0}
.toast.on{transform:translateX(-50%);pointer-events:auto;opacity:1}
.toast .tact{color:var(--ind2);font-weight:750;font-size:13px;white-space:nowrap;padding:6px 8px;border-radius:8px}
.toast .tact:hover{background:var(--ind-soft)}
.toast .tclose{width:28px;height:28px;border-radius:8px;color:var(--dim);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .tclose:hover{background:var(--line);color:var(--txt)}
.toast .tclose svg{width:13px;height:13px}
@media(min-width:960px){.toast{bottom:28px;left:auto;right:28px;transform:translateY(160%)}
  .toast.on{transform:none}}

.sw{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:background var(--tr);flex-shrink:0}
.sw.on{background:var(--ind)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on i{left:21px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:none}
.set .n{font-size:13.5px;font-weight:550}
.set .d{font-size:11.5px;color:var(--dim);margin-top:1px}
.set input,.set select{width:112px;text-align:right;padding:8px 11px}
.link{color:var(--ind2);font-size:13px;font-weight:700;padding:7px 10px;border-radius:var(--r-s)}
.link:hover{background:var(--ind-soft)}
svg{display:block}
.hidden-month{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
</style>

/* Tout est synthétisé par WebAudio : pas un octet de fichier son.
   Le contexte audio ne démarre qu'au premier geste (règle des navigateurs). */
var AC = null;
function ac() {
  if (AP.sound === false) return null;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    return AC;
  } catch (e) { return null; }
}
/* Une note : forme d'onde, fréquence de départ/arrivée, durée, volume */
function tone(o) {
  var a = ac(); if (!a) return;
  var t = a.currentTime + (o.at || 0);
  var osc = a.createOscillator(), g = a.createGain();
  osc.type = o.w || "sine";
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + o.d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(o.v || 0.07, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.d);
  osc.connect(g); g.connect(a.destination);
  osc.start(t); osc.stop(t + o.d + 0.02);
}

/* ----- Bulle de dialogue : ce qu'il a à te dire, selon l'état réel ----- */
function mateLine(m) {
  var DS = discipline(m), T = budgetTotals(m), st = DS.stats;
  var ms = missionsFor(m), open_ = ms.filter(function (x) { return !x.done; });
  var over = S.budgets.filter(function (b) {
    return b.month === m && (st.byCat[b.categoryId] || 0) > b.amount;
  });

  if (!S.transactions.length)
    return { t: "On commence ? Note ton premier revenu, je m'occupe du reste.", a: "Ajouter une opération", f: "App.newTx()" };
  if (st.income === 0)
    return { t: "Je ne vois aucun revenu sur <b>" + mLabel(m) + "</b>. Sans ça je ne peux rien calculer.", a: "Déclarer un revenu", f: "App.newTx()" };
  if (over.length) {
    var c0 = cat(over[0].categoryId);
    return { t: "Attention : l'enveloppe <b>" + (c0 ? c0.n : "?") + "</b> est dépassée. On rééquilibre ?", a: "Voir mes enveloppes", f: "App.go('bud')" };
  }
  if (T.income > 0 && T.toBudget > 20)
    return { t: "Il te reste <b>" + money(T.toBudget) + "</b> à répartir. Chaque euro mérite une mission.", a: "Répartir", f: "App.go('bud')" };
  if (activeDays(m) < 3)
    return { t: "Trois jours de suivi, c'est le minimum pour que le score veuille dire quelque chose.", a: "Noter une dépense", f: "App.newTx()" };
  if (open_.length)
    return { t: "Quête en cours : <b>" + esc(open_[0].t) + "</b>. " + open_[0].why, a: open_[0].cta ? open_[0].cta[0] : "Voir mes quêtes", f: open_[0].cta ? open_[0].cta[1] : "App.openProgress()" };
  if (ms.length && !open_.length)
    return { t: "Toutes les quêtes du mois sont bouclées. Beau travail.", a: "Voir ma progression", f: "App.openProgress()" };
  return { t: "Score du mois : <b>" + DS.score + "/100</b>. On garde le cap.", a: "Voir le détail", f: "App.openProgress()" };
}

/* Les annonces passent l'une après l'autre (quête, niveau, badge, série)

var rewQ = [], rewBusy = false;

  rewQ.push({ b: badge, t: title, s: sub, f: sfx, ms: ms || 4200, c: cls || "" });
  if (!rewBusy) rewNext();
}
function rewNext() {
  var el = document.getElementById("reward"), x = rewQ.shift();
  if (!el || !x) { rewBusy = false; return; }
  rewBusy = true;
  el.className = x.c;
  el.innerHTML = '<span class="rx">' + x.b + '</span><span class="rt">' +
    '<b>' + x.t + '</b><span>' + x.s + '</span></span>';
  void el.offsetWidth;
  el.classList.add("on");
  if (x.f) x.f();
  setTimeout(function () {
    el.classList.remove("on");
    setTimeout(rewNext, 380);

}
