/* ---------- IMPORT CSV ---------- */
/* Découpe une ligne CSV en respectant les guillemets ("a;b" reste un seul champ) */
function csvSplit(line, sep) {
  var out = [], cur = "", q = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (q) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
/* Montant au format français ou anglais : -1.234,56 / 1 234,56 / 1,234.56 / 12.3 */
function parseAmount(v) {
  var s = String(v || "").replace(/[\s\u00a0\u202f€$£"]/g, "");
  if (!s) return NaN;
  var c = s.lastIndexOf(","), d = s.lastIndexOf(".");
  if (c >= 0 && d >= 0) s = c > d ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (c >= 0) s = s.match(/,/g).length > 1 ? s.replace(/,/g, "") : s.replace(",", ".");
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, "");
  return parseFloat(s);
}
function csvFingerprint(date, amount, label) {
  return "csv:" + date + "|" + amount.toFixed(2) + "|" + String(label || "").slice(0, 40).toLowerCase();
}
function importCSV(text) {
  var lines = text.replace(/^\uFEFF/, "").replace(/\r/g, "").split("\n").filter(function (l) { return l.trim(); });
  if (!lines.length) return { added: 0, skipped: 0 };
  var sep = (lines[0].split(";").length > lines[0].split(",").length) ? ";" : ",";
  var head = csvSplit(lines[0].toLowerCase(), sep);
  function idx() { for (var a = 0; a < arguments.length; a++) for (var i = 0; i < head.length; i++) if (head[i].indexOf(arguments[a]) >= 0) return i; return -1; }
  var iD = idx("date"), iA = idx("montant", "amount"), iN = idx("libell", "note", "description", "label");
  if (iD < 0 || iA < 0) throw new Error("Colonnes date/montant introuvables — colonnes détectées : " + head.join(", "));
  /* Anti-doublon : un relevé réimporté n'ajoute rien */
  var seen = {};
  S.transactions.forEach(function (t) {
    if (t.ext) seen[t.ext] = 1;
    seen[csvFingerprint(t.date, (t.type === "income" ? 1 : -1) * t.amount, t.note)] = 1;
  });
  var added = 0, skipped = 0;
  for (var l = 1; l < lines.length; l++) {
    var c = csvSplit(lines[l], sep);
    var raw = parseAmount(c[iA]);
    if (isNaN(raw) || raw === 0) continue;
    var d = String(c[iD] || "").trim();
    var fr = d.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{4})/);
    if (fr) d = fr[3] + "-" + fr[2] + "-" + fr[1];
    if (!/^\d{4}-\d{2}-\d{2}/.test(d)) continue;
    d = d.slice(0, 10);
    var note = (iN >= 0 ? String(c[iN] || "").trim() : "") || "Import CSV";
    var fp = csvFingerprint(d, raw, note);
    if (seen[fp]) { skipped++; continue; }
    seen[fp] = 1;
    var credit = raw > 0;
    S.transactions.push({ id: uid(), ext: fp, type: credit ? "income" : "expense", amount: Math.abs(raw),
      categoryId: guessCat(note, credit), date: d, payMethod: credit ? undefined : "Carte", note: note.slice(0, 90) });
    added++;
  }
  return { added: added, skipped: skipped };
}

function dl(content, name, type) {
  try {
    var b = new Blob([content], { type: type }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 100);
  } catch (e) { toast("⚠️ Téléchargement bloqué"); }
}

/* ---------- TOAST (file d'attente : aucun message écrasé) ---------- */
function hideToast() {
  clearTimeout(toastT); toastT = null; tShowing = false;
  document.getElementById("toast").classList.remove("on");
  if (tq.length) setTimeout(pumpToast, 220);
}
function pumpToast() {
  if (tShowing || !tq.length) return;
  var it = tq.shift();
  tShowing = true;
  var t = document.getElementById("toast");
  t.innerHTML = "<span style='flex:1'>" + esc(it.m) + "</span>" +
    (it.label ? '<button class="tact" id="toastAct">' + esc(it.label) + '</button>' : "") +
    '<button class="tclose" onclick="hideToast()" aria-label="Fermer">' + ic("x") + '</button>';
  if (it.label) document.getElementById("toastAct").onclick = function () { hideToast(); if (it.fn) it.fn(); };
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, it.label ? 6000 : 2400);
}
function toast(m, actionLabel, actionFn) {
  tq.push({ m: m, label: actionLabel, fn: actionFn });
  if (tq.length > 3) tq = tq.slice(-3);
  pumpToast();
}
window.hideToast = hideToast;

/* ---------- DÉMARRAGE ---------- */
/* Complète une sauvegarde (chargement ou restauration) avec les valeurs par défaut */
function normalize(d) {
  var o = Object.assign({}, DEF, d);
  o.settings = Object.assign({}, DEF.settings, d.settings || {});
  ["transactions", "fixed", "budgets", "goals", "wishlist", "debts"].forEach(function (k) { if (!(o[k] instanceof Array)) o[k] = []; });
  if (!o.shop || !o.shop.items) o.shop = { items: [], limit: 0 };
  if (!o.game) o.game = { xp: 0, claimed: {}, seen: {} };
  if (!o.game.claimed) o.game.claimed = {};
  if (!o.game.seen) o.game.seen = {};
  if (!o.game.badges) o.game.badges = {};
  /* première ouverture après la mise à jour : on habille d'office le compagnon
     avec ce que ton niveau a déjà débloqué */
  if (!(o.game.wear instanceof Array)) {
    var lvn = levelOf(o.game.xp || 0).lvl.n;
    o.game.wear = ACCS.filter(function (x) { return x.lv <= lvn; }).map(function (x) { return x.id; });
  }
  return o;
}
function loadData() {
  var raw = LS.get(PID === "main" ? "budgetv2:data" : "budgetv2:data:" + PID);
  if (raw) {
    try {
      S = normalize(JSON.parse(raw));
      return;
    } catch (e) {}
  }
  S = JSON.parse(JSON.stringify(DEF));
  if (PID === "main") {
    var v1 = migrateV1();
    if (v1.length) { S.transactions = v1; saveNow(); setTimeout(function () { toast(v1.length + " opérations importées de ta v1 ✓"); }, 700); }
  }
}

/* Retours : lien de connexion (#login=…) et paiement Stripe (#premium=ok / annule) */
function handleHash() {
  var hash = location.hash;
  if (/login=|premium=/.test(hash)) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  var lm = hash.match(/login=([A-Za-z0-9_-]+)/);
  if (lm && API) {
    apiFetch("/auth/verify", { method: "POST", body: { token: lm[1] } }).then(function (j) {
      LS.set(SES_KEY, j.session); setMe(j.me); render(); toast("Connecté ✓");
      cloudCheck();
    }).catch(accErr);
  }
  var pm = hash.match(/premium=(\w+)/);
  if (pm && pm[1] === "ok") {
    setTimeout(function () { toast("🎉 Bienvenue dans Premium ! Ta sauvegarde en ligne s'active"); }, 600);
    /* le webhook Stripe peut avoir quelques secondes de retard */
    [1500, 5000, 12000].forEach(function (ms) {
      setTimeout(function () { if (!isPremium()) apiFetch("/me").then(function (j) { setMe(j.me); render(); if (isPremium()) cloudCheck(); }).catch(function () {}); }, ms);
    });
  } else if (pm) setTimeout(function () { toast("Paiement annulé, rien n'a été débité"); }, 600);
}

function boot() {
  loadAppearance();
  handleHash();
  window.addEventListener("hashchange", handleHash);
  month = curMonth();
  try {
    var meta = JSON.parse(LS.get("budgetv2:profiles") || "null");
    if (meta && meta.list) { PROFILES = meta.list; PID = meta.active || "main"; }
  } catch (e) {}
  loadData();
  render();
  setTimeout(function () { var l = mateLine(month); mateSay(l.t, l.a, l.f, 14000); }, 1400);
  var last = LS.get("budgetv2:lastmonth");
  if (last && last !== curMonth()) setTimeout(function () { toast("📅 Nouveau mois — pense à copier tes budgets"); }, 1200);
  LS.set("budgetv2:lastmonth", curMonth());
  document.getElementById("sheet").addEventListener("input", function () { sheetCtx.dirty = true; sheetCtx.warned = false; });
  document.getElementById("palq").addEventListener("keydown", function (e) { App.palKey(e); });
  /* Le compagnon réagit au défilement (aussi sur mobile, sans clavier) */
  window.addEventListener("scroll", mateShy, { passive: true });
  var wv = document.getElementById("view");
  if (wv) wv.addEventListener("scroll", mateShy, { passive: true });
  document.addEventListener("keydown", function (e) {
    var ov = document.getElementById("ov").classList.contains("on");
    var pal = document.getElementById("palov").classList.contains("on");
    /* Palette : Ctrl+K / Cmd+K partout */
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      if (pal) App.closePal(); else { if (ov) App.closeSheet(true); App.openPal(); }
      return;
    }
    if (pal) return; /* la palette gère son propre clavier */
    var tg = e.target.tagName;
    if (ov) {
      /* UX-008 : Entrée soumet le formulaire de la modale */
      if (e.key === "Enter" && tg === "INPUT" && sheetCtx.submit) { e.preventDefault(); sheetCtx.submit(); return; }
      if (e.key === "Escape") { App.closeSheet(); return; }
      /* A11Y-001 : piège du focus dans la modale */
      if (e.key === "Tab") {
        var f = document.getElementById("sheet").querySelectorAll("button,input,select,textarea");
        if (f.length) {
          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
          else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
        }
      }
      return;
    }
    if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA") return;
    /* Séquence G puis lettre (navigation Linear-style) */
    var now = Date.now();
    if (gSeq && now - gSeq < 900 && GKEYS[e.key.toLowerCase()]) {
      App.go(GKEYS[e.key.toLowerCase()]); gSeq = 0; e.preventDefault(); return;
    }
    if (e.key === "g" || e.key === "G") { gSeq = now; return; }
    gSeq = 0;
    if (e.key === "n" || e.key === "N") { App.newTx(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" && !MONTHLESS[tab]) App.shift(-1);
    else if (e.key === "ArrowRight" && !MONTHLESS[tab]) App.shift(1);
    else if (e.key === "Escape") App.closeSheet(true);
  });
  accountInit();
  /* Hors-ligne : seulement depuis une vraie adresse web (pas le lanceur PC) */
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }
  /* Rappel d'export : sans Premium, tout est sur cet appareil */
  setTimeout(function () {
    if (isPremium() || S.transactions.length < 10) return;
    var le = +(LS.get("budgetv2:lastexport") || 0);
    if (Date.now() - le > 15 * 86400000) toast("💾 Pense à exporter ta sauvegarde : tes données ne sont que sur cet appareil", "Exporter", function () { App.exportJSON(); });
  }, 4000);
  if (!LS.set("budgetv2:test", "1")) setTimeout(function () { toast("⚠️ Le navigateur bloque l'enregistrement local"); }, 1500);
  else LS.del("budgetv2:test");
}
boot();
</script>
