/* ---------- PROGRESSION : score, niveaux, missions ---------- */
/* Tout est recalculé depuis tes opérations réelles. Rien à cocher :
   une mission ne peut pas être validée à la main, donc le score ne ment pas. */

var LEVELS = [
  { n: 1, xp: 0,    t: "Novice",        d: "Tu commences à regarder où va l'argent" },
  { n: 2, xp: 120,  t: "Attentif",      d: "Tu notes tes dépenses régulièrement" },
  { n: 3, xp: 320,  t: "Méthodique",    d: "Tes enveloppes tiennent la route" },
  { n: 4, xp: 620,  t: "Constant",      d: "Le budget devient une routine" },
  { n: 5, xp: 1050, t: "Solide",        d: "Tu épargnes sans y penser" },
  { n: 6, xp: 1650, t: "Stratège",      d: "Tu pilotes tes objectifs, pas juste tes dépenses" },
  { n: 7, xp: 2450, t: "Discipliné",    d: "Les dérapages sont devenus rares" },
  { n: 8, xp: 3500, t: "Architecte",    d: "Tu construis du patrimoine, pas des mois" },
  { n: 9, xp: 4900, t: "Maître",        d: "Ton budget encaisse les imprévus" },
  { n: 10, xp: 6800, t: "Souverain",    d: "Tes finances travaillent pour tes projets" }
];
function levelOf(xp) {
  var cur = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].xp) cur = LEVELS[i];
  var next = LEVELS.filter(function (l) { return l.xp > xp; })[0] || null;
  return {
    lvl: cur, next: next,
    into: xp - cur.xp,
    span: next ? next.xp - cur.xp : 1,
    pct: next ? Math.min(100, (xp - cur.xp) / (next.xp - cur.xp) * 100) : 100
  };
}

/* Nombre de jours distincts avec au moins une opération saisie, sur le mois */
function activeDays(m) {
  var d = {};
  var today = todayISO();
  /* une opération datée dans le futur ne prouve pas qu'on a tenu le carnet ce jour-là */
  S.transactions.forEach(function (t) { if (monthOf(t.date) === m && t.date <= today) d[t.date] = 1; });
  return Object.keys(d).length;
}
function daysInMonth(m) {
  var p = m.split("-");
  if (m === curMonth()) return new Date().getDate();
  return new Date(+p[0], +p[1], 0).getDate();
}

/* Score de discipline 0-100, décomposé pour être lisible et contestable */
function discipline(m) {
  var st = stats(m), T = budgetTotals(m), parts = [];
  var budgets = S.budgets.filter(function (b) { return b.month === m; });

  /* 1. Enveloppes tenues (30 pts) */
  var held = 0;
  budgets.forEach(function (b) { if ((st.byCat[b.categoryId] || 0) <= b.amount) held++; });
  var p1 = budgets.length ? held / budgets.length * 30 : 0;
  parts.push({ k: "Enveloppes tenues", v: p1, max: 30,
    d: budgets.length ? held + " / " + budgets.length : "aucune enveloppe définie" });

  /* 2. Régularité de suivi (25 pts) — un budget non tenu à jour ne vaut rien */
  var ad = activeDays(m), dim = daysInMonth(m);
  /* plancher à 10 jours : une seule saisie le 1er ne vaut plus 25/25 */
  var p2 = Math.min(25, ad / Math.max(10, dim) * 50);
  parts.push({ k: "Régularité de suivi", v: p2, max: 25, d: ad + " jour" + (ad > 1 ? "s" : "") + " sur " + dim });

  /* 3. Taux d'épargne (25 pts) */
  var p3 = st.income > 0 ? Math.min(25, st.rate / 20 * 25) : 0;
  parts.push({ k: "Taux d'épargne", v: p3, max: 25, d: st.rate.toFixed(1) + " % des revenus" });

  /* 4. Dépenses réfléchies (20 pts) — part des achats marqués « inutiles ».
     Les points ne tombent que si tu tries tes achats (utile / inutile) :
     ne rien trier ne doit pas rapporter plus qu'être honnête. */
  var share = st.expenses > 0 ? st.useless / st.expenses : 0;
  var ex = st.txs.filter(function (t) { return t.type === "expense" && t.categoryId !== "epargne"; });
  var rated = ex.filter(function (t) { return t.useful === "useful" || t.useful === "useless"; }).length;
  var rs = ex.length ? rated / ex.length : 0;
  var p4 = st.expenses > 0 ? Math.max(0, 20 - share * 100) * Math.min(1, rs / 0.5) : 0;
  parts.push({ k: "Dépenses réfléchies", v: p4, max: 20,
    d: st.expenses > 0 ? (share * 100).toFixed(0) + " % marqués inutiles · " + Math.round(rs * 100) + " % des achats triés" : "rien à évaluer" });

  var total = parts.reduce(function (a, x) { return a + x.v; }, 0);
  return { score: Math.round(total), parts: parts, stats: st, tot: T };
}

/* ----- Missions ----- */
/* Les quêtes ne sortent plus d'un catalogue fixe : chacune lit tes chiffres,
   décide si elle te concerne, et dit pourquoi en une phrase. Deux natures :
   - « vérifiée » : se valide seule à partir des opérations, impossible à tricher ;
   - « action » : un geste concret hors de l'app (résilier, relancer, comparer),
     validé sur l'honneur. Elle rapporte moins et ne compte pas dans le score.
   Une quête déjà validée reste affichée tout le mois, même si la situation
   qui l'a fait naître a changé entre-temps. */

function monthEnded(m) { return m < curMonth(); }
function monthLen(m) { var p = m.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
/* Moyenne mensuelle d'un poste sur les n mois précédents qui en ont */
function avgSpend(c, m, n) {
  var tot = 0, k = 0;
  for (var i = 1; i <= n; i++) {
    var v = stats(shiftM(m, -i)).byCat[c] || 0;
    if (v > 0) { tot += v; k++; }
  }
  return k ? tot / k : 0;
}
/* Jours écoulés depuis la dernière opération notée (mois en cours seulement) */
function logGap() {
  var last = "";
  S.transactions.forEach(function (t) { if (t.date <= todayISO() && t.date > last) last = t.date; });
  if (!last) return 99;
  return Math.round((new Date(todayISO()) - new Date(last)) / 864e5);
}
function txSum(m, catId) {
  return S.transactions.reduce(function (a, t) {
    return a + (monthOf(t.date) === m && t.categoryId === catId ? t.amount : 0);
  }, 0);
}
function goalFunded(g, m) {
  return (g.hist || []).reduce(function (a, h) { return a + (monthOf(h.d) === m ? h.v : 0); }, 0);
}
function listFr(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1]; }

function missionPool(m) {
  var st = stats(m), T = budgetTotals(m), lv = levelOf(S.game.xp).lvl.n, now = m === curMonth();
  var bs = S.budgets.filter(function (b) { return b.month === m; });
  var over = bs.filter(function (b) { return (st.byCat[b.categoryId] || 0) > b.amount; });
  var P = [];
  function add(o) { o.kind = o.kind || "auto"; P.push(o); }

  /* Revenus : sans eux, rien ne se calcule */
  add({ id: "income", ico: "coins", xp: 15, prio: 100, rel: st.income === 0,
    t: "Déclarer tes revenus", d: "Enregistrer au moins un revenu ce mois",
    why: "Sans revenu noté, ni le reste à vivre ni le taux d'épargne ne veulent dire quoi que ce soit.",
    cur: st.income > 0 ? 1 : 0, goal: 1, cta: ["Ajouter un revenu", "App.newTx()"] });

  /* Carnet : l'objectif grandit avec toi */
  var ad = activeDays(m), gap = now ? logGap() : 0;
  var lg = Math.min(monthLen(m), lv < 2 ? 5 : lv < 4 ? 12 : 20);
  add({ id: "log", ico: "edit", xp: lg <= 5 ? 20 : lg <= 12 ? 35 : 55, prio: gap >= 3 ? 90 : 50, rel: true,
    t: lg <= 5 ? "Tenir le carnet" : lg <= 12 ? "Le réflexe quotidien" : "Suivi sans trou",
    d: "Noter des opérations " + lg + " jours différents ce mois",
    why: now && gap >= 3 && gap < 99 ? "Rien de noté depuis <b>" + gap + " jours</b> : ce sont les petites dépenses oubliées qui font dériver un mois."
      : "Un budget n'est juste que s'il est à jour. " + ad + " jour" + (ad > 1 ? "s" : "") + " noté" + (ad > 1 ? "s" : "") + " jusqu'ici.",
    cur: ad, goal: lg, cta: ["Noter une dépense", "App.newTx()"] });

  /* Enveloppes : on vise tes vrais gros postes, pas une liste générique */
  var ref = Object.keys(st.byCat).length ? st.byCat : stats(shiftM(m, -1)).byCat;
  var top = Object.keys(ref).filter(function (k) { return k !== "epargne" && k !== "remboursement" && !budgetOf(m, k); })
    .sort(function (a, b) { return ref[b] - ref[a]; }).slice(0, 3)
    .map(function (k) { var c = cat(k); return c ? c.n : k; });
  add({ id: "env", ico: "wallet", xp: 25, prio: 80, rel: bs.length < 3,
    t: "Poser tes enveloppes", d: "Définir un budget sur au moins 3 postes",
    why: top.length ? "Tes plus gros postes : <b>" + listFr(top) + "</b>. Commence par eux."
      : "Une enveloppe par poste qui compte : logement, nourriture, transport.",
    cur: bs.length, goal: 3, cta: ["Créer les enveloppes", "App.go('bud')"] });

  /* Équilibre : chaque euro reçoit une mission */
  add({ id: "balance", ico: "scale", xp: 40, prio: 70, rel: T.income > 0 && T.toBudget > 20,
    t: "Donner une mission à chaque euro", d: "Répartir tes revenus à 20 € près",
    why: "Il reste <b>" + money(Math.max(0, T.toBudget)) + "</b> sans affectation : sans plan, ils partiront au fil de l'eau.",
    cur: T.income > 0 && Math.abs(T.toBudget) <= 20 ? 1 : 0, goal: 1, cta: ["Répartir", "App.go('bud')"] });

  /* Freiner : le poste qui dérape par rapport à TA moyenne */
  var day = now ? new Date().getDate() : monthLen(m), brake = null;
  Object.keys(st.byCat).forEach(function (k) {
    if (k === "epargne" || k === "remboursement" || k === "logement") return;
    var avg = avgSpend(k, m, 3), sp = st.byCat[k];
    if (avg < 30) return;
    var proj = sp / Math.max(1, day) * monthLen(m), drift = proj / avg;
    if (drift > 1.15 && (!brake || drift > brake.drift)) brake = { k: k, avg: avg, sp: sp, drift: drift };
  });
  if (brake) {
    var bc = cat(brake.k), cap = Math.max(5, Math.round(brake.avg / 5) * 5);
    add({ id: "brake-" + brake.k, ico: "brake", xp: 45, prio: 75, rel: true, ceil: true,
      t: "Freiner sur " + (bc ? bc.n : brake.k), d: "Finir le mois sous " + money(cap) + " en " + (bc ? bc.n : brake.k),
      why: "Déjà <b>" + money(brake.sp) + "</b> ; d'habitude tu tournes autour de " + money(brake.avg) + " par mois.",
      cur: brake.sp, goal: cap, done: monthEnded(m) && brake.sp <= cap, cta: ["Voir les opérations", "App.go('tx')"] });
  }

  /* Enveloppes tenues jusqu'au bout */
  add({ id: "holdall", ico: "wallet", xp: 60, prio: over.length ? 72 : 45, rel: bs.length >= 3,
    t: "Tenir toutes tes enveloppes", d: "Finir le mois sans dépasser un seul budget",
    why: over.length ? "<b>" + esc((cat(over[0].categoryId) || {}).n || "?") + "</b> est déjà dépassée : réaffecte depuis une enveloppe qui a de la marge."
      : bs.length + " enveloppes posées, aucune dépassée pour l'instant.",
    cur: bs.length - over.length, goal: bs.length || 1, done: monthEnded(m) && bs.length > 0 && !over.length,
    cta: ["Voir mes enveloppes", "App.go('bud')"] });

  /* Épargne : un cran au-dessus du mois dernier, pas un chiffre magique */
  var prev = stats(shiftM(m, -1)), pr = prev.income > 0 ? prev.rate : -1;
  var tgt = pr < 0 ? (lv < 3 ? 5 : 10) : pr < 5 ? 5 : pr < 10 ? 10 : pr < 15 ? 15 : 20;
  var need = Math.round(st.income * tgt / 100);
  add({ id: "save", ico: "coins", xp: tgt >= 15 ? 70 : 45, prio: 55, rel: st.income > 0,
    t: "Mettre " + tgt + " % de côté", d: "Épargner " + money(need) + " sur tes " + money(st.income) + " de revenus",
    why: pr >= 0 ? "Le mois dernier : <b>" + pr.toFixed(0) + " %</b>. Un cran de plus suffit."
      : "Mise de côté dès la paie, l'épargne ne se négocie plus en fin de mois.",
    cur: Math.round(st.saved), goal: Math.max(1, need), cta: ["Noter un virement épargne", "App.newTx()"] });

  /* Objectifs : la mensualité qui tient l'échéance */
  var gs = (S.goals || []).filter(function (g) { return !g.done && g.target > g.saved; });
  gs.sort(function (a, b) { return (a.deadline || "9999").localeCompare(b.deadline || "9999"); });
  if (gs.length) {
    var g = gs[0], rem = g.target - g.saved;
    var left = g.deadline ? Math.max(1, monthsBetween(m, monthOf(g.deadline)) + 1) : 6;
    var gn = Math.max(10, Math.ceil(rem / left / 5) * 5);
    add({ id: "goal-" + g.id, ico: "target", xp: 35, prio: 65, rel: true,
      t: "Nourrir « " + g.name + " »", d: "Verser " + money(gn) + " ce mois",
      why: "Il manque <b>" + money(rem) + "</b>" + (g.deadline ? " d'ici le " + frDate(g.deadline) : "") +
        " : " + money(gn) + " par mois tiennent le rythme.",
      cur: Math.round(goalFunded(g, m)), goal: gn, cta: ["Alimenter", "App.fundGoal('" + g.id + "')"] });
  } else {
    add({ id: "goalset", ico: "target", xp: 20, prio: 30, rel: lv >= 2,
      t: "Fixer un cap", d: "Créer un objectif d'épargne",
      why: "Épargner sans but, c'est épargner jusqu'au premier imprévu. Donne un nom à ce que tu mets de côté.",
      cur: (S.goals || []).length ? 1 : 0, goal: 1, cta: ["Créer un objectif", "App.go('goal')"] });
  }

  /* Dettes : l'échéance du mois */
  var ds = debtStats();
  if (ds.monthly > 0) {
    var paid = txSum(m, "remboursement");
    add({ id: "debt", ico: "scale", xp: 50, prio: 70, rel: true,
      t: "Honorer tes échéances", d: "Rembourser " + money(ds.monthly) + " ce mois",
      why: "Encore <b>" + money(ds.owed) + "</b> à rembourser. Chaque échéance tenue raccourcit la route.",
      cur: Math.round(paid), goal: Math.round(ds.monthly), cta: ["Enregistrer un remboursement", "App.go('debt')"] });
  }

  /* Achats inutiles : seulement si tu en marques */
  var share = st.expenses > 0 ? st.useless / st.expenses : 0;
  add({ id: "useless", ico: "brake", xp: 40, prio: 50, rel: share > 0.05,
    t: "Garder la tête froide", d: "Moins de 5 % d'achats inutiles à la fin du mois",
    why: "<b>" + money(st.useless) + "</b> d'achats marqués inutiles, soit " + (share * 100).toFixed(0) + " % de tes dépenses.",
    cur: share <= 0.05 ? 1 : 0, goal: 1, done: monthEnded(m) && st.expenses > 0 && share <= 0.05, ceil: true,
    cta: ["Voir les opérations", "App.go('tx')"] });

  /* --- Actions concrètes, hors de l'app --- */
  if (now) {
    var abo = st.byCat.abonnements || prev.byCat.abonnements || 0;
    add({ id: "subs", kind: "act", ico: "scissors", xp: 20, prio: 45, rel: abo > 0,
      t: "Faire le tri dans tes abonnements", d: "Résilier ou suspendre celui que tu n'as pas utilisé ce mois",
      why: "<b>" + money(abo) + "</b> par mois, soit " + money(abo * 12) + " par an." });
    var lent = (S.debts || []).filter(function (x) { return x.kind === "lent" && x.remaining > 0; })
      .sort(function (a, b) { return b.remaining - a.remaining; })[0];
    if (lent) add({ id: "chase-" + lent.id, kind: "act", ico: "msg", xp: 15, prio: 40, rel: true,
      t: "Relancer " + (lent.party || lent.name), d: "Demander le remboursement de " + money(lent.remaining),
      why: "C'est ton argent : une relance polie maintenant vaut mieux qu'un oubli dans six mois." });
  }
  return P;
}

function missionsFor(m) {
  var cl = S.game.claimed;
  var all = missionPool(m).map(function (x) {
    var key = m + ":" + x.id, done = x.kind === "act" ? !!cl[key] : x.done != null ? x.done : x.cur >= x.goal;
    /* anciennes clés « save5 », « save10 »… : une seule quête épargne par mois */
    if (x.id === "save" && !cl[key]) for (var ck in cl) if (ck.indexOf(m + ":save") === 0) { cl[key] = 1; break; }
    if (x.kind === "auto" && cl[key]) done = true;
    return {
      id: x.id, kind: x.kind, ico: x.ico, t: x.t, d: x.d, why: x.why, xp: x.xp, prio: x.prio, rel: x.rel,
      cur: x.cur, goal: x.goal, ceil: !!x.ceil, cta: x.cta, done: done, key: key,
      pct: x.kind === "act" ? 0 : Math.min(100, x.goal ? x.cur / x.goal * 100 : 0)
    };
  }).filter(function (x) { return x.rel || cl[x.key]; })
    .sort(function (a, b) { return b.prio - a.prio; });
  /* Au plus 5 quêtes ouvertes : 4 mesurées et un geste concret, glissé en
     troisième position pour qu'il apparaisse aussi sur l'accueil. */
  var open_ = all.filter(function (x) { return !x.done; });
  var autos = open_.filter(function (x) { return x.kind === "auto"; }).slice(0, 4);
  var acts = open_.filter(function (x) { return x.kind === "act"; }).slice(0, 5 - autos.length);
  var pick = autos.slice(0, 2).concat(acts.slice(0, 1), autos.slice(2), acts.slice(1));
  return pick.concat(all.filter(function (x) { return x.done; }));
}

/* Ligne de progression lisible : « 3 / 5 jours », « reste 40 € »… */
function questProgress(x) {
  if (x.kind === "act") return "Sur l'honneur";
  if (x.ceil && x.goal > 1) return x.cur > x.goal ? "dépassé de " + money(x.cur - x.goal) : "marge : " + money(x.goal - x.cur);
  if (x.goal === 1) return x.done ? "fait" : "à faire";
  if (x.goal > 50) return money(x.cur) + " / " + money(x.goal);
  return x.cur + " / " + x.goal;
}

/* Crédite l'XP des quêtes vérifiées nouvellement accomplies. Une quête déjà
   créditée pour un mois donné ne peut pas l'être deux fois. */
function grantXp(m) {
  var ms = missionsFor(m), gained = 0, names = [];
  ms.forEach(function (x) {
    if (x.kind === "auto" && x.done && !S.game.claimed[x.key]) {
      S.game.claimed[x.key] = 1;
      S.game.xp += x.xp; gained += x.xp; names.push(x.t);
    }
  });
  if (gained) { saveNow(); }
  return { gained: gained, names: names };
}

/* Solde tous les mois finis depuis la dernière visite (au plus 12), pas
   seulement le précédent : un mois sauté ne fait plus perdre ses quêtes. */
function settleMonths() {
  var cur = curMonth(), from = S.game.settled || shiftM(cur, -2), out = { gained: 0, names: [] };
  if (monthsBetween(from, cur) > 13) from = shiftM(cur, -13);
  for (var m = shiftM(from, 1); m < cur; m = shiftM(m, 1)) {
    var g = grantXp(m); out.gained += g.gained; out.names = out.names.concat(g.names);
  }
  if (S.game.settled !== shiftM(cur, -1)) { S.game.settled = shiftM(cur, -1); saveNow(); }
  return out;
}

/* Annonce chaque niveau franchi (on peut en passer deux d'un coup) */
function levelUps(before) {
  var now = levelOf(S.game.xp).lvl.n;
  for (var n = before + 1; n <= now; n++) levelUpPop(LEVELS[n - 1]);
}

/* ---------- SÉRIE DE JOURS 🔥 ----------
   Un jour compte quand tu ouvres le carnet pour de vrai : une opération
   saisie ce jour-là (quelle que soit sa date) ou « rien dépensé aujourd'hui ».
   Joker : un seul jour manqué est pardonné par tranche de 7 jours. */
var STREAK_STEPS = [[3, 10], [7, 25], [14, 40], [30, 80], [60, 120], [100, 200], [200, 300], [365, 500]];
function isoShift(iso, n) {
  var d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function gameDays() {
  if (!S.game.days) {
    /* première fois : on reprend les 60 derniers jours d'opérations */
    S.game.days = {};
    var t = todayISO(), lim = isoShift(t, -60);
    S.transactions.forEach(function (x) { if (x.date <= t && x.date >= lim) S.game.days[x.date] = 1; });
  }
  return S.game.days;
}
function streak() {
  var D = gameDays(), t = todayISO(), today = !!D[t];
  var d = today ? t : isoShift(t, -1), n = 0, joker = null, jokers = [];
  for (var i = 0; i < 2000; i++) {
    if (D[d]) n++;
    else if (D[isoShift(d, -1)] && (!joker || (new Date(joker) - new Date(d)) / 864e5 >= 7)) {
      joker = d; jokers.push(d);
    } else break;
    d = isoShift(d, -1);
  }
  /* le joker est-il encore dispo pour les 7 prochains jours ? */
  var used = jokers.filter(function (j) { return (new Date(t) - new Date(j)) / 864e5 < 7; }).length > 0;
  return { n: n, today: today, joker: !used, best: Math.max(n, S.game.best || 0) };
}
/* Marque aujourd'hui. Renvoie vrai si c'est la première fois de la journée. */
function markToday() {
  var D = gameDays(), t = todayISO();
  if (D[t]) return false;
  D[t] = 1;
  /* on ne garde qu'un peu plus d'un an d'historique */
  var lim = isoShift(t, -400);
  Object.keys(D).forEach(function (k) { if (k < lim) delete D[k]; });
  return true;
}
/* Récompense du geste quotidien : +5 XP la première fois du jour,
   bonus aux paliers de série. */
function dailyReward() {
  if (!markToday()) { sfxTap(); return; }
  var t = todayISO(), st = streak(), before = levelOf(S.game.xp).lvl.n, xp = 0;
  if (!S.game.claimed["d:" + t]) { S.game.claimed["d:" + t] = 1; xp += 5; }
  S.game.xp += xp;
  if (st.n > (S.game.best || 0)) S.game.best = st.n;
  var step = STREAK_STEPS.filter(function (x) { return x[0] === st.n && !S.game.claimed["s:" + x[0]]; })[0];
  saveNow(); render();
  celebrate("🔥", "Série : " + st.n + " jour" + (st.n > 1 ? "s" : ""),
    (xp ? "+" + xp + " XP · " : "") + (st.n === 1 ? "Reviens demain pour la faire grandir" : "Carnet tenu aujourd'hui"), sfxStreak, 2600, "fire");
  if (step) {
    S.game.claimed["s:" + step[0]] = 1; S.game.xp += step[1]; saveNow(); render();
    celebrate("+" + step[1], step[0] + " jours d'affilée !", "Bonus de série", sfxReward, 4200, "fire");
  }
  levelUps(before);
  setTimeout(checkBadges, 400);
}

/* ---------- BADGES ----------
   Gagnés une fois pour toutes. Chaque test relit tes vraies données. */
function finishedMonths() {
  var seen = {}, cur = curMonth();
  S.transactions.forEach(function (t) { var m = monthOf(t.date); if (m < cur) seen[m] = 1; });
  return Object.keys(seen).sort().slice(-24);
}

    ok: function (c) { return c.months.some(function (m) {
      var st = stats(m), bs = S.budgets.filter(function (b) { return b.month === m; });

  { id: "zero", e: "🧊", n: "Tête froide", d: "Un mois fini avec 10 achats triés et zéro inutile",
    ok: function (c) { return c.months.some(function (m) {
      var st = stats(m), r = st.txs.filter(function (t) { return t.type === "expense" && (t.useful === "useful" || t.useful === "useless"); });

function weekKey() {
  var d = new Date(), wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function defiOfWeek() {
  var wk = weekKey(), m = curMonth(), st = stats(m);
  var ref = Object.keys(st.byCat).length ? st.byCat : stats(shiftM(m, -1)).byCat;
  var top = Object.keys(ref).sort(function (a, b) { return ref[b] - ref[a]; }).slice(0, 3);
  var pool = DEFIS.filter(function (x) { return !x.c || top.indexOf(x.c) >= 0; });
  var seed = 0;
  for (var i = 0; i < wk.length; i++) seed = (seed * 31 + wk.charCodeAt(i)) >>> 0;
  var skip = (S.game.skip && S.game.skip[wk]) || 0;
  var x = pool[(seed + skip * 7) % pool.length], c = x.c ? cat(x.c) : null;
  return { t: x.t, key: "w:" + wk, xp: 15, skip: skip, done: !!S.game.claimed["w:" + wk],

}

function bundle() {

  PROFILES.forEach(function (p) {
    var raw = LS.get(p.id === "main" ? "budgetv2:data" : "budgetv2:data:" + p.id);

  PROFILES.forEach(function (p) {

  ACC.busy = true; if (manual) render();
  var base = LS.get(SYNC_KEY);
  return apiFetch("/backup", { method: "PUT", body: { data: bundle(), base: base ? +base : null, force: !!force } })
    .then(function (j) {

      if (manual) { render(); toast("Sauvegardé en ligne ✓"); }
    })

      ACC.busy = false;
      if (e.status === 409) { ACC.conflict = true; render(); toast("⚠️ Données modifiées sur un autre appareil — choisis quelle version garder dans Paramètres"); }

    ACC.busy = false;
    if (!j.data) { if (manual) { render(); toast("Aucune sauvegarde en ligne pour l'instant"); } return; }
    applyBundle(j.data);

  if (!isPremium()) return;

    var local = +(LS.get(SYNC_KEY) || 0), dirty = !!LS.get(DIRTY_KEY);

    /* Nouvel appareil sans rien de saisi : on récupère simplement la sauvegarde */

/* Import du fond d'écran : redimensionné + recompressé pour tenir dans localStorage */
function setWallpaper(file) {
  if (!file) return;
  if (String(file.type).indexOf("image/") !== 0) { toast("⚠️ Choisis un fichier image (JPG, PNG, WebP)"); return; }
  var fr = new FileReader();
  fr.onerror = function () { toast("⚠️ Lecture du fichier impossible"); };
  fr.onload = function () {
    var img = new Image();
    img.onerror = function () { toast("⚠️ Image illisible ou corrompue"); };
    img.onload = function () {
      var max = 1800, w = img.width, h = img.height, sc = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(w * sc)); cv.height = Math.max(1, Math.round(h * sc));
      var cx = cv.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      var q = 0.82, url = "";
      try { url = cv.toDataURL("image/jpeg", q); } catch (e) { toast("⚠️ Impossible de traiter cette image"); return; }
      while (url.length > 2500000 && q > 0.35) { q -= 0.12; url = cv.toDataURL("image/jpeg", q); }
      if (url.length > 3200000) { toast("⚠️ Image trop lourde — essaie une plus petite"); return; }
      if (!LS.set(WP_KEY, url)) { toast("⚠️ Stockage local plein : fond non enregistré"); return; }
      WP = url;
      if (AP.wpOpacity < 8) AP.wpOpacity = AP_DEF.wpOpacity;
      saveAppearance(); render();
      toast("Fond d'écran appliqué ✓");
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- SERVICES ---------- */
function stats(m) {
  var txs = S.transactions.filter(function (t) { return monthOf(t.date) === m; });
  /* L'épargne est un transfert vers un autre compte : elle ne compte ni dans
     "ce qui sort" ni dans "il te reste". Elle est suivie à part (saved). */
  var inc = 0, exp = 0, useless = 0, fixedExp = 0, byCat = {}, spend = {};
  txs.forEach(function (t) {
    if (t.type === "income") { inc += t.amount; return; }
    byCat[t.categoryId] = (byCat[t.categoryId] || 0) + t.amount;
    if (t.categoryId === "epargne") return;
    exp += t.amount; spend[t.categoryId] = (spend[t.categoryId] || 0) + t.amount;
    if (t.fixedId) fixedExp += t.amount;
    if (t.useful === "useless") useless += t.amount;
  });
  var saved = byCat["epargne"] || 0;
  return { txs: txs, income: inc, expenses: exp, left: inc - exp, saved: saved,
    fixedExp: fixedExp, varExp: exp - fixedExp,
    rate: inc > 0 ? saved / inc * 100 : 0, byCat: byCat, spend: spend, useless: useless };
}
/* ---------- OPÉRATIONS FIXES ----------
   Un modèle (S.fixed) par charge ou recette fixe. Chaque mois, jusqu'au mois
   en cours, on crée l'opération si elle n'existe pas encore. Supprimer une
   occurrence la marque "sautée" pour ce mois ; repasser en Variable arrête
   le modèle à partir du mois concerné. */
function daysIn(m) { var p = m.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
/* Rattrapage unique : les virements d'épargne déjà importés et rangés en Divers
   passent en Épargne, pour ne plus faire baisser « Il te reste ». */
function fixSavingsCats() {
  if (S.settings.epFix1) return;
  var r = CAT_RULES[0][1], n = 0;
  S.transactions.forEach(function (t) {
    if (t.type !== "expense" || t.categoryId !== "divers") return;
    var l = String(t.note || "").toLowerCase();
    for (var i = 0; i < r.length; i++) if (l.indexOf(r[i]) >= 0) { t.categoryId = "epargne"; n++; return; }
  });
  S.settings.epFix1 = true; save();
  if (n) setTimeout(function () { toast(n + " virement(s) d'épargne reclassé(s) ✓"); }, 600);
}
function syncFixed() {
  if (!S.fixed || !S.fixed.length) return false;
  var cm = curMonth(), added = false;
  S.fixed.forEach(function (f) {
    var have = {};
    S.transactions.forEach(function (t) { if (t.fixedId === f.id) have[monthOf(t.date)] = 1; });
    for (var m = f.start; m <= cm && (!f.end || m <= f.end); m = shiftM(m, 1)) {
      if (have[m] || (f.skip && f.skip[m])) continue;
      S.transactions.push({ id: uid(), type: f.type, amount: f.amount, categoryId: f.categoryId,
        date: m + "-" + pad(Math.min(f.day, daysIn(m))), payMethod: f.payMethod, note: f.note,
        useful: f.type === "income" ? null : f.useful, fixedId: f.id });
      added = true;
    }
  });
  if (added) save();
  return added;
}
function fixedOf(id) { for (var i = 0; i < (S.fixed || []).length; i++) if (S.fixed[i].id === id) return S.fixed[i]; return null; }
function budgetOf(m, c) { for (var i = 0; i < S.budgets.length; i++) if (S.budgets[i].month === m && S.budgets[i].categoryId === c) return S.budgets[i]; return null; }
function carryFor(c) {
  if (!S.settings.rollover) return 0;
  var carry = 0;
  for (var i = 1; i <= 12; i++) {
    var m = shiftM(month, -i), b = budgetOf(m, c);
    if (!b) continue;
    carry += Math.max(0, b.amount - (stats(m).byCat[c] || 0));
  }
  return carry;
}
function debtStats() {
  var owed = 0, lent = 0, monthly = 0, active = 0;

  return { owed: owed, lent: lent, net: lent - owed, monthly: monthly, active: active };
}

function donut(byCat, total) {
  var items = [];
  for (var k in byCat) { var c = cat(k); items.push({ n: c ? c.n : k, e: catE(c), c: c ? c.c : "#666", v: byCat[k] }); }
  items.sort(function (a, b) { return b.v - a.v; });
  if (items.length > 6) {
    var rest = items.slice(5), sum = 0;
    rest.forEach(function (r) { sum += r.v; });
    items = items.slice(0, 5);
    items.push({ n: "Autres (" + rest.length + ")", e: "", c: "#5B5B66", v: sum });
  }
  if (!items.length) return '<div class="empty"><div class="big">◔</div>Aucune dépense ce mois-ci</div>';
  var R = 56, r = 38, cx = 64, cy = 64, ang = -Math.PI / 2, paths = "";
  items.forEach(function (it) {
    var a = it.v / total * Math.PI * 2, e = ang + a, big = a > Math.PI ? 1 : 0;
    var x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang), x2 = cx + R * Math.cos(e), y2 = cy + R * Math.sin(e);
    var x3 = cx + r * Math.cos(e), y3 = cy + r * Math.sin(e), x4 = cx + r * Math.cos(ang), y4 = cy + r * Math.sin(ang);
    if (a > 6.28) paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2) + '" fill="none" stroke="' + it.c + '" stroke-width="' + (R - r) + '"/>';
    else paths += '<path d="M' + x1 + ' ' + y1 + 'A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + x2 + ' ' + y2 + 'L' + x3 + ' ' + y3 + 'A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + x4 + ' ' + y4 + 'Z" fill="' + it.c + '"/>';
    ang = e;
  });
  var leg = items.map(function (it) {
    var pct = (it.v / total * 100).toFixed(0);
    return '<div style="display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 0">' +
      '<span style="width:9px;height:9px;border-radius:3px;background:' + it.c + ';flex-shrink:0"></span>' +
      '<span class="dim" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + it.e + " " + esc(it.n) + '</span>' +
      '<span class="dim" style="font-size:11px">' + pct + '%</span>' +
      '<b style="font-size:13px;min-width:70px;text-align:right">' + money(it.v) + '</b></div>';
  }).join("");
  return '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">' +
    '<div style="position:relative;width:128px;height:128px;flex-shrink:0">' +
    '<svg width="128" height="128" viewBox="0 0 128 128">' + paths + '</svg>' +
    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
    '<span style="font-size:11px" class="dim">Total</span><b style="font-size:13.5px">' + money(total) + '</b></div></div>' +
    '<div style="flex:1;min-width:170px">' + leg + '</div></div>';
}
function barsH(items) {
  if (!items.length) return '<div class="empty"><div class="big">▁▃▅</div>Aucune donnée</div>';
  var max = Math.max.apply(null, items.map(function (i) { return i.value; })) || 1;
  return items.map(function (i) {

function chartMonths(n) {
  var data = [];
  for (var i = n - 1; i >= 0; i--) { var m = shiftM(month, -i), s = stats(m); data.push({ l: MN[+m.split("-")[1] - 1].slice(0, 3), inc: s.income, exp: s.expenses, left: s.left }); }
  var max = 1;

  var W = 340, H = 165, bw = (W - 34) / data.length;

    if (!inc.length) h += '<div class="card mb"><div class="empty" style="padding:20px">Aucune recette ce mois.<br>' +
      '<button class="cta" onclick="App.newTx()">+ Ajouter une recette</button></div></div>';
    h += section("Ce qui sort", "expense", exp, te, "red");
    if (!exp.length) h += '<div class="card mb"><div class="empty" style="padding:20px">Aucune dépense ce mois.</div></div>';
    h += '<div class="card"><div class="sech"><span class="st">Ce qu\'il te reste</span><span class="sc"></span>' +
      '<b class="' + (ti - te >= 0 ? "grn" : "red") + '" style="font-size:19px">' + money(ti - te, 1) + '</b></div></div>';
    return h;
  }

  var tot = list.reduce(function (a, t) { return a + t.amount; }, 0);
  return h + section(filter === "income" ? "Ce qui rentre" : "Ce qui sort", filter, list, tot,
    filter === "income" ? "grn" : "red");
}

/* ---------- PLAN D'ACHATS DE L'ANNÉE ---------- */
/* Deux budgets distincts et volontairement séparés :
   - l'enveloppe du mois, qui ne couvre QUE les dépenses courantes ;
   - le plan de l'année, qui couvre les achats datés (vélo en décembre,
     running en mars). Le mois où un achat tombe à échéance, son montant
     s'ajoute à l'allocation de ce mois-là — sans polluer les autres. */
function planYear(m) { return String(m).slice(0, 4); }
function planItems(year) {
  return (S.wishlist || []).filter(function (w) {
    return w.status !== "achete" && w.targetMonth && planYear(w.targetMonth) === String(year);
  });
}
/* Achats arrivant à échéance sur le mois donné */
function planDue(m) {
  return (S.wishlist || []).filter(function (w) {
    return w.status !== "achete" && w.targetMonth === m;
  });
}
function planDueTotal(m) {
  return planDue(m).reduce(function (a, w) { return a + w.amount; }, 0);
}
/* Nombre de mois entre deux YYYY-MM (négatif si déjà passé) */
function monthsBetween(from, to) {
  var a = from.split("-"), b = to.split("-");
  return (+b[0] - +a[0]) * 12 + (+b[1] - +a[1]);
}
/* Ce qu'il faut mettre de côté ce mois-ci pour tenir tout le plan à venir.
   Chaque achat est lissé sur les mois qui restent jusqu'à son échéance. */
function planMonthlySetAside(m) {
  var total = 0;
  (S.wishlist || []).forEach(function (w) {
    if (w.status === "achete" || !w.targetMonth) return;
    var left = monthsBetween(m, w.targetMonth);
    if (left < 0) return;
    total += w.amount / Math.max(1, left + 1);
  });
  return total;
}
function planSummary(m) {
  var year = planYear(m);
  var items = planItems(year);
  var due = planDue(m), dueTot = planDueTotal(m);
  return {
    year: year,
    items: items,
    yearTotal: items.reduce(function (a, w) { return a + w.amount; }, 0),
    due: due, dueTotal: dueTot,
    setAside: planMonthlySetAside(m)
  };
}

var BGROUPS = [
  { n: "Essentiels",   ids: ["logement", "courses", "nourriture", "transport", "sante"] },
  { n: "Vie courante", ids: ["loisirs", "shopping", "abonnements"] },
  { n: "Engagements",  ids: ["remboursement", "divers"] },
  { n: "Mise de côté", ids: ["epargne"] }
];
function budgetTotals(m) {
  var st = stats(m), tb = 0, ts = 0, tc = 0;
  CATS.forEach(function (c) {
    if (c.t !== "expense") return;
    var b = budgetOf(m, c.id);
    if (!b) return;
    tb += b.amount; tc += carryFor(c.id); ts += st.byCat[c.id] || 0;
  });
  var P = planSummary(m);
  /* L'allocation du mois = enveloppes courantes + achats datés de ce mois. */
  var plan = P.dueTotal, aside = P.setAside - plan > 0 ? P.setAside - plan : 0;
  return { budgeted: tb, spent: ts, carry: tc, income: st.income,
    plan: plan, aside: aside, allocation: tb + plan,
    toBudget: st.income - tb - plan - aside, stats: st, planInfo: P };
}
function budRow(c, st) {
  var b = budgetOf(month, c.id), sp = st.byCat[c.id] || 0;
  var carry = b ? carryFor(c.id) : 0;
  var avail = (b ? b.amount : 0) + carry, rest = avail - sp;
  var pct = avail > 0 ? Math.min(100, sp / avail * 100) : 0;
  var cls = !b ? "none" : rest < 0 ? "bad" : pct > 85 ? "warn" : "ok";
  var col = rest < 0 ? "var(--red)" : pct > 85 ? "var(--amb)" : "var(--grn)";
  return '<div class="br">' +
    '<div class="cn"><span class="e">' + catE(c) + '</span><span class="nm">' + c.n + '</span>' +
    (carry > 0 ? '<span class="cy" title="Reporté des mois précédents">+' + money(carry) + '</span>' : "") + '</div>' +
    '<div class="bwrap"><input class="bin' + (b ? "" : " z") + '" inputmode="decimal" aria-label="Budget ' + c.n + '" ' +
    'value="' + (b ? b.amount : "") + '" placeholder="0" ' +
    'onchange="App.setBudget(\'' + c.id + '\',this.value)" onfocus="this.select()"></div>' +
    '<div class="sp">' + (sp > 0 ? money(sp) : '<span class="dim">—</span>') + '</div>' +
    '<div class="rest"><span class="pill ' + cls + '">' + (b || sp ? money(rest) : "—") + '</span></div>' +
    (b ? '<div class="brline"><i style="width:' + pct + '%;background:' + col + '"></i></div>' : "") +
    '</div>';
}
function vBud() {
  var T = budgetTotals(month), st = T.stats;
  var prevM = shiftM(month, -1);
  var missing = S.budgets.filter(function (b) { return b.month === prevM; })
    .filter(function (b) { return !budgetOf(month, b.categoryId); }).length;

  /* Bandeau « Prêt à budgéter » — logique enveloppe : chaque euro reçoit une mission */
  var tb = T.toBudget;
  var col = Math.abs(tb) < 0.01 ? "var(--grn)" : tb > 0 ? "var(--ind2)" : "var(--red)";
  var msg = T.income === 0 ? "Ajoute tes recettes du mois pour répartir"
    : T.plan > 0 ? "Mois chargé : " + planDue(month).length + " achat(s) prévu(s) s'ajoutent à ton courant"
    : Math.abs(tb) < 0.01 ? "Tout est affecté — budget à l'équilibre ✓"
    : tb > 0 ? "Reste à répartir dans tes enveloppes"
    : "Tu as engagé plus que tes recettes";
  var P = T.planInfo;
  var h = '<div class="tobud"><div class="lft"><div class="k">Prêt à budgéter — ' + mLabel(month) + '</div>' +
    '<div class="amt" style="color:' + col + '">' + money(tb) + '</div>' +
    '<div class="brk"><span>Recettes <b style="color:var(--txt)">' + money(T.income) + '</b></span>' +
    '<span>Courant <b style="color:var(--txt)">' + money(T.budgeted) + '</b></span>' +
    (T.plan > 0 ? '<span>Achats du mois <b class="vio">' + money(T.plan) + '</b></span>' : "") +
    (T.aside > 0 ? '<span>Mise de côté plan <b class="tea">' + money(T.aside) + '</b></span>' : "") +
    '<span>Dépensé <b style="color:var(--txt)">' + money(T.spent) + '</b></span></div>' +
    '<div class="dim" style="font-size:11.5px;margin-top:5px">' + msg + '</div></div>' +
    '<div class="acts">' +
    (missing > 0 ? '<button onclick="App.copyBudgets()">Reprendre ' + mLabel(prevM) + ' (' + missing + ')</button>' : "") +
    (tb > 0.01 && T.budgeted > 0 ? '<button onclick="App.spreadRest()">Répartir le reste</button>' : "") +
    (T.budgeted > 0 ? '<button onclick="App.clearBudgets()">Tout remettre à zéro</button>' : "") +
    '</div></div>';

  /* Table d'enveloppes groupées */
  h += '<div class="secban"><b>Budget du mois</b><span>Dépenses courantes uniquement — ' +
    money(T.budgeted) + '</span></div>';
  h += '<div class="btab"><div class="bh"><span>Catégorie</span><span>Budgété</span><span>Dépensé</span><span>Reste</span></div>';
  var seen = {};
  BGROUPS.forEach(function (g) {
    var cs = g.ids.map(function (id) { return cat(id); }).filter(Boolean);
    if (!cs.length) return;
    var gb = 0, gs = 0;
    cs.forEach(function (c) { seen[c.id] = 1; var b = budgetOf(month, c.id); if (b) gb += b.amount; gs += st.byCat[c.id] || 0; });
    h += '<div class="bgrp"><span>' + g.n + '</span><span class="tot">' + money(gs) + ' / ' + money(gb) + '</span></div>';
    cs.forEach(function (c) { h += budRow(c, st); });
  });
  var rest = CATS.filter(function (c) { return c.t === "expense" && !seen[c.id]; });
  if (rest.length) {
    h += '<div class="bgrp"><span>Autres</span></div>';
    rest.forEach(function (c) { h += budRow(c, st); });
  }
  h += '</div>';

  /* ---- Plan d'achats de l'année, nettement séparé ---- */
  h += '<div class="secban" style="margin-top:18px"><b>Plan d\'achats ' + P.year + '</b>' +
    '<span>Achats datés — ' + money(P.yearTotal) + ' sur l\'année</span></div>';
  h += '<div class="card">';
  if (!P.items.length) {
    h += '<div class="empty" style="padding:22px">Aucun achat planifié en ' + P.year + '.<br>' +
      '<span class="dim" style="font-size:12px">Un vélo en décembre, des running en mars…</span><br>' +
      '<button class="cta" onclick="App.newWish()">+ Planifier un achat</button></div>';
  } else {
    h += '<div class="planline"><span>À mettre de côté ce mois-ci pour tenir le plan</span>' +
      '<b class="tea">' + money(P.setAside) + '</b></div>';
    var byM = {};
    P.items.forEach(function (w) { (byM[w.targetMonth] = byM[w.targetMonth] || []).push(w); });
    Object.keys(byM).sort().forEach(function (mk) {
      var tot = byM[mk].reduce(function (a, w) { return a + w.amount; }, 0);
      var isNow = mk === month, past = monthsBetween(month, mk) < 0;
      h += '<div class="pmonth' + (isNow ? " now" : "") + (past ? " past" : "") + '">' +
        '<div class="pmh"><b>' + mLabel(mk) + (isNow ? ' <span class="pnow">ce mois</span>' : "") + '</b>' +
        '<b>' + money(tot) + '</b></div>';
      byM[mk].forEach(function (w) {
        var left = monthsBetween(month, mk);
        h += '<div class="pitem"><span class="pn">' + esc(w.name) + '</span>' +
          '<span class="pd">' + (left > 0 ? left + " mois — " + money(w.amount / (left + 1)) + " /mois"
            : left === 0 ? "à payer maintenant" : "échéance passée") + '</span>' +
          '<b>' + money(w.amount) + '</b></div>';
      });
      h += '</div>';
    });
    h += '<button class="dash" style="margin-top:12px" onclick="App.newWish()">' + ic("plus") + 'Planifier un achat</button>';
  }
  h += '</div>';

  h += '<div class="card" style="margin-top:14px"><div class="set" style="border:none;padding:2px 0">' +
    '<div><div class="n">Report du non-utilisé</div><div class="d">Ce qui reste d\'un mois s\'ajoute à l\'enveloppe du suivant</div></div>' +
    '<button class="sw' + (S.settings.rollover ? " on" : "") + '" onclick="App.toggleRollover()" role="switch" aria-checked="' + S.settings.rollover + '"><i></i></button></div></div>';
  h += '<div class="dim" style="font-size:11.5px;margin-top:10px;line-height:1.7">' +
    'Les deux budgets restent séparés : l\'enveloppe du mois ne couvre que le quotidien, ' +
    'le plan de l\'année couvre les achats datés. Le mois de l\'échéance, l\'achat s\'ajoute automatiquement à ton allocation.<br>' +
    'Tape directement un montant dans la colonne <b>Budgété</b> — c\'est enregistré à la validation. ' +
    'Laisse vide pour supprimer l\'enveloppe.</div>';
  return h;
}

function vGoal() {
  var h = '<div class="chips">' + [["goals", "Objectifs"], ["wishes", "Achats souhaités"]].map(function (k) {
    return '<button class="chip' + (goalSub === k[0] ? " on" : "") + '" onclick="App.setGoalSub(\'' + k[0] + '\')">' + k[1] + '</button>';

    h += '<div class="autofill">';
    if (!S.goals.length) h += '<div class="card" style="grid-column:1/-1"><div class="empty"><div class="big">◎</div>Aucun objectif pour l\'instant.<br>Épargne, voyage, Australie… fixe un cap.<br><button class="cta" onclick="App.newGoal()">+ Créer un objectif</button></div></div>';
    S.goals.forEach(function (g) {
      var pct = Math.min(100, g.saved / g.target * 100);

        '<div class="dim" style="font-size:13px;margin-top:3px"><b style="color:' + (g.done ? "var(--grn)" : "var(--txt)") + '">' + money(g.saved) + '</b> / ' + money(g.target) +
        (g.deadline ? ' · ' + frDate(g.deadline) : "") + '</div>' +
        '<div class="bar" style="height:8px"><i style="width:' + pct + '%;background:' + (g.done ? "var(--grn)" : "linear-gradient(90deg,var(--ind),var(--ind2))") + '"></i></div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px">' +
        '<span class="dim" style="font-size:12px">' + pct.toFixed(0) + ' %</span>' +
        (g.done ? "" : '<button class="link" onclick="App.fundGoal(\'' + g.id + '\')">+ Alimenter</button>') + '</div></div>';

    var avg = (flows[0] + flows[1] + flows[2]) / 3;
    h += '<div class="statgrid mb">' +
      '<div class="stat"><div class="k">À financer</div><div class="v">' + money(toFund) + '</div><div class="s">' + act.length + ' achats en liste</div></div>' +
      '<div class="stat"><div class="k">Flux moyen / mois</div><div class="v ' + (avg >= 0 ? "grn" : "red") + '">' + money(avg) + '</div><div class="s">3 derniers mois</div></div></div>';
    var ord = { haute: 0, moyenne: 1, basse: 2 }, ST = { financer: "À financer", etudier: "À étudier", differe: "Différé" };
    h += '<div class="autofill">';
    if (!wl.length) h += '<div class="card" style="grid-column:1/-1"><div class="empty"><div class="big">🛒</div>Aucun achat en liste.<br><button class="cta" onclick="App.newWish()">+ Premier achat souhaité</button></div></div>';
    wl.slice().sort(function (a, b) { return (a.status === "achete") - (b.status === "achete") || ord[a.priority] - ord[b.priority]; }).forEach(function (w) {
      h += '<div class="card" style="' + (w.status === "achete" ? "opacity:.55;border-color:rgba(52,211,153,.3)" : "") + '">' +
        '<div style="display:flex;align-items:center;gap:8px"><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px">' + esc(w.name) + '</b>' +
        '<b>' + money(w.amount) + '</b><button class="mini" onclick="App.delWish(\'' + w.id + '\')" aria-label="Supprimer">' + ic("trash") + '</button></div>' +
        '<div style="display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap">' +
        '<span class="tag ' + (w.priority === "haute" ? "h" : w.priority === "moyenne" ? "m" : "") + '" style="cursor:default">' + w.priority + '</span>' +
        (w.status === "achete" ? '<span class="grn" style="font-size:12px;font-weight:700">Acheté ✓</span>' :
          '<button class="tag" onclick="App.cycleWish(\'' + w.id + '\')">' + ST[w.status] + ' ↻</button>') +
        (w.targetMonth ? '<span class="dim" style="font-size:11px">→ ' + mLabel(w.targetMonth) + '</span>' : "") +

    var casc = stats(month).left, proj = "";
    [1, 2, 3].forEach(function (i) {
      var m = shiftM(month, i);
      var planned = act.filter(function (w) { return w.targetMonth === m && w.status !== "differe"; }).reduce(function (a, w) { return a + w.amount; }, 0);
      casc = casc + avg - planned;
      proj += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13.5px">' +
        '<span class="dim">' + mLabel(m) + '</span><span class="dim" style="font-size:11.5px">' + (planned > 0 ? "− " + money(planned) + " d'achats" : "—") + '</span>' +
        '<b class="' + (casc >= 0 ? "grn" : "red") + '">' + money(casc) + '</b></div>';
    });
    h += '<div class="card" style="margin-top:14px;max-width:520px"><div class="ttl">Projection prévisionnelle</div>' + proj +
      '<div class="dim" style="font-size:11.5px;margin-top:8px">Reste actuel + flux moyen 3 mois − achats planifiés (hors Différé). Estimation.</div></div>';
  }
  return h;
}

function vTrends() {

      '<button class="btn ghost" style="margin-top:10px" onclick="upsell(\'Les tendances\')">Découvrir</button></div>';
  }
  var sv = 0, lf = 0, n = 0;
  for (var i = 1; i <= 3; i++) { var st = stats(shiftM(curMonth(), -i)); if (st.income || st.expenses) { sv += st.saved; lf += st.left; n++; } }
  var avgS = n ? sv / n : 0, avgL = n ? lf / n : 0;

    (st === "tote" ? '<path d="M30 4 L32.5 1.5 Q34 0 35.5 1.5 L38.5 4.5 Q40 6 38.5 7.5 L36 10Z" style="fill:var(--red)"/>' : "") + '</svg>';
}
function shopListCard(freq, trips, ref, title, anim) {
  var key = periodKey(freq, ref);
  var rows = shopData().items.filter(function (it) { return it.freq === freq; }).map(function (it) {
    var b = shopBought(trips, it);
    return { it: it, b: b, done: shopChecked(it, key, trips) };
  });
  rows.sort(function (a, b) {
    return (a.done - b.done) || (kindIdx(a.it.kind) - kindIdx(b.it.kind)) || a.it.name.localeCompare(b.it.name);
  });
  var done = 0, est = 0, left = 0, toPay = 0;
  rows.forEach(function (r) {
    est += itemCost(r.it);
    if (r.done) { done++; if (r.b < r.it.qty) toPay++; } else left += itemCost(r.it);
  });
  var h = '<div class="card mb slist' + (anim ? " anim" : "") + '" style="--n:' + rows.length + '">' +
    '<div class="ttl"><span class="slt">' + title + ' <span class="sln">· ' + done + ' / ' + rows.length + '</span></span>' +
    (est > 0 ? '<span class="sle">≈ ' + money(est) + '</span>' : "") + '</div>';
  if (est > 0 && done && left > 0.004) h += '<div class="slr">Encore ≈ <b>' + money(left) + '</b> à acheter</div>';
  if (!rows.length) h += '<div class="empty" style="padding:12px">Rien à acheter chaque ' + (freq === "week" ? "semaine" : "mois") + ' pour l\'instant.</div>';
  rows.forEach(function (r, i) {
    var it = r.it, K = shopKind(it.kind);
    h += '<div class="shi' + (r.done ? " done" : r.b > 0 ? " part" : "") + (shopJust === it.id ? " just" : "") +
      (shopNew === it.id ? " new" : "") + '" style="--i:' + i + '">' +
      '<button class="shck" onclick="App.shopTick(\'' + it.id + '\')" aria-pressed="' + r.done + '" aria-label="' +
      (r.done ? "Décocher " : "Cocher ") + esc(it.name) + '">' + (r.done ? ic("check", 3) : "") + '</button>' +
      '<span class="she">' + esc(it.e || K.e) + '</span>' +
      '<span class="shn"><b>' + esc(it.name) + '</b><small>' + esc(qtyTxt(it)) + ' · ' + K.n +
      (r.b > 0 && r.b < it.qty ? ' · ' + fmtQ(r.b) + ' sur un ticket' : "") + '</small></span>' +
      '<span class="shq">' + (it.price > 0 ? "≈ " + money(itemCost(it)) : '<span class="dim">prix ?</span>') + '</span>' +
      '<button class="mini" onclick="App.editShopItem(\'' + it.id + '\')" aria-label="Modifier ' + esc(it.name) + '">' + ic("edit") + '</button></div>';
  });
  h += '<div class="shadd"><input id="shadd_' + freq + '" placeholder="Écris un article… ex : 6 pommes, riz 1 kg, lait 2 L 2,20 €" ' +
    'onkeydown="if(event.key===\'Enter\'){event.preventDefault();App.shopQuick(\'' + freq + '\')}" aria-label="Ajouter un article">' +
    '<button class="mini" onclick="App.shopQuick(\'' + freq + '\')" aria-label="Ajouter">' + ic("plus") + '</button></div>';
  h += '<div class="shfoot">' + (toPay ? '<button class="qgo" onclick="App.shopPay(\'' + freq + '\')">' + ic("check", 2.4) +
    'Noter le ticket (' + toPay + ' coché' + (toPay > 1 ? "s" : "") + ')</button>' : "") +
    '<span class="pent">' + (rows.length && done === rows.length ? "Tout est acheté ✓" : rows.length ? "Liste à jour" : "") + '</span>' +
    '<span class="shpen" aria-hidden="true"><svg class="scrib" viewBox="0 0 100 28"><path d="M2 18 C10 4 16 28 26 14 S40 6 48 16 S62 24 70 12 S84 8 96 16"/></svg>' +
    '<span class="pen">' + penSvg() + '</span></span></div></div>';
  return h;
}

/* Contenu et prix d'une liste : semaine, mois, ou total (4 semaines + mois) */
function shopListSum(which) {
  var R = { t: 0, n: 0, k: {}, e: [] };
  shopData().items.forEach(function (it) {
    if (which !== "total" && it.freq !== which) return;
    var mult = which === "total" && it.freq === "week" ? SHOP_WEEKS : 1, v = itemCost(it) * mult;
    R.t += v; R.n++;
    R.k[it.kind] = (R.k[it.kind] || 0) + v;
    for (var i = 0; i < Math.min(which === "total" ? 1 : 3, Math.ceil(it.qty)); i++) R.e.push(it.e || shopKind(it.kind).e);
  });
  return R;
}
function vShop() {
  var m = month, wk = shopWeekOf(m), mode = shopMode;
  shopWeek = wk;
  var mTrips = shopTrips(m + "-01", m + "-" + pad(daysIn(m))), wTrips = shopTrips(wk, addDays(wk, 6));
  var W = shopListSum("week"), M = shopListSum("month"), T = shopListSum("total"), L = mode === "week" ? W : mode === "month" ? M : T;
  var mLim = shopLimit(m), spent = shopSum(mTrips);
  var anim = shopAnim; shopAnim = false;
  var h = '<div class="dg">';

  /* --- Les trois sacs : la semaine et le mois sont des images de ta liste ;
     le total (4 semaines + le mois) se compare à ta limite et peut déborder --- */
  var titles = { week: " de la semaine", month: " du mois", total: " — total du mois" };
  h += '<div class="c5">' + chapter(bagName() + titles[mode]) +
    '<div class="card shopbag"><div class="pillseg">' +
    [["week", "Semaine"], ["month", "Mois"], ["total", "Total"]].map(function (x) {
      return '<button class="' + (mode === x[0] ? "on" : "") + '" onclick="App.setShopMode(\'' + x[0] + '\')">' + x[1] + '</button>';
    }).join("") + '</div>';
  var pct = 82, over = false, col = "var(--ind2)";
  if (mode === "total" && mLim > 0) {
    pct = T.t / mLim * 100; over = T.t > mLim + 0.004;
    col = over ? "var(--red)" : pct >= 85 ? "var(--amb)" : "var(--grn)";
  }
  h += '<div class="bagw">' + bagSvg(L.n ? pct : 0, L.e.length ? L.e : ["🛒"], 0, mode !== "total" || !(mLim > 0)) + '</div>';
  if (mode === "week") h += '<div class="bagnum"><b>≈ ' + money(W.t) + '</b>/ semaine</div>' +
    '<div class="bagmsg dim">' + W.n + ' article' + (W.n > 1 ? "s" : "") + ' dans ta liste de la semaine</div>';
  else if (mode === "month") h += '<div class="bagnum"><b>≈ ' + money(M.t) + '</b>/ mois</div>' +
    '<div class="bagmsg dim">' + M.n + ' achat' + (M.n > 1 ? "s" : "") + ' ponctuel' + (M.n > 1 ? "s" : "") + ', une fois par mois</div>';
  else {
    h += '<div class="bagnum"><b style="color:' + (mLim > 0 ? col : "var(--txt)") + '">≈ ' + money(T.t) + '</b>' + (mLim > 0 ? "/ " + money(mLim) : "/ mois") + '</div>' +
      '<div class="shcalc">' + SHOP_WEEKS + ' × ' + money(W.t) + ' <span>semaine</span> + ' + money(M.t) + ' <span>mois</span> = <b>' + money(T.t) + '</b></div>' +
      '<div class="bagmsg" style="color:' + (over ? "var(--red)" : "var(--mut)") + '">' +
      (!(mLim > 0) ? "Fixe ta limite du mois pour voir si ça déborde"
        : over ? "Ça déborde de " + money(T.t - mLim) + " !" : "Encore " + money(mLim - T.t) + " de marge") + '</div>';
    h += '<div class="shlim"><div class="set"><div><div class="n">Limite du mois</div>' +
      '<div class="d">Le sac Total déborde au-delà</div></div>' +
      '<input inputmode="decimal" placeholder="0" value="' + (mLim || "") + '" onchange="App.setShopLimit(this.value)" onfocus="this.select()" aria-label="Limite du mois"></div>' +
      '<div class="set"><div><div class="n">Dépensé ce mois</div><div class="d">D\'après tes tickets de courses</div></div>' +
      '<b class="' + (mLim > 0 && spent > mLim ? "red" : "") + '" style="font-size:16px">' + money(spent) + '</b></div></div>';
  }
  if (L.t > 0) {
    var parts = [];
    SHOP_KINDS.forEach(function (x) { if (L.k[x.id]) parts.push({ n: x.e + " " + x.n, v: L.k[x.id], c: x.c }); });
    h += '<div class="shk"><div class="lbl" style="margin-top:4px">Ce qu\'il y a dans le sac</div><div class="shbar">' +
      parts.map(function (p) { return '<i style="width:' + (p.v / L.t * 100) + '%;background:' + p.c + '"></i>'; }).join("") + '</div>' +
      parts.map(function (p) {
        return '<div class="shkl"><i class="dt" style="background:' + p.c + '"></i><span>' + p.n + '</span><b>' + money(p.v) + '</b></div>';
      }).join("") + '</div>';
  } else if (L.n) h += '<div class="dim" style="font-size:12px;margin-top:8px">Ajoute un prix à tes articles (✎) pour voir le montant.</div>';
  h += '<button class="btn" style="margin-top:14px" onclick="App.newShop()">+ Noter des courses</button></div></div>';

  /* --- La liste --- */
  h += '<div class="c7">' + chapter("Ta liste de courses");
  if (!shopData().items.length) h += '<div class="card mb onb"><div class="ttl">Liste vide</div>' +
    '<div class="dim" style="font-size:13px;line-height:1.6">Note une fois ce que tu achètes chaque semaine (pommes ×6, pain…) et chaque mois ' +
    '(papier toilette, dentifrice…), avec les kg ou litres si tu veux. Tu vois tout de suite combien ça va coûter, et tu coches au fur et à mesure ce que tu as vraiment acheté.</div>' +
    '<button class="cta" style="margin-top:12px;border:none;cursor:pointer;color:var(--ind2);background:var(--ind-soft);padding:9px 16px;border-radius:999px;font-weight:700" onclick="App.shopStarter()">Partir d\'une liste type</button></div>';
  h += shopListCard("week", wTrips, wk, "Chaque semaine — " + weekLabel(wk), anim) +
    shopListCard("month", mTrips, m + "-01", "Chaque mois — " + MN[+m.split("-")[1] - 1], anim) + '</div>';
  shopJust = shopNew = null;

  /* --- Les tickets du mois --- */
  var tk = mTrips.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  h += '<div class="c12">' + chapter("Tickets de " + MN[+m.split("-")[1] - 1] + " — " + money(shopSum(mTrips))) + '<div class="card">';
  if (!tk.length) h += '<div class="empty" style="padding:22px">Aucunes courses notées ce mois.<br><button class="cta" onclick="App.newShop()">+ Noter des courses</button></div>';
  tk.forEach(function (t) {
    var ls = t.lines || [];
    var sub = ls.length ? ls.slice(0, 4).map(function (l) { return esc(l.e || "") + " " + esc(l.n) + (l.q !== 1 ? " ×" + fmtQ(l.q) : ""); }).join(", ") +
      (ls.length > 4 ? "…" : "") : "articles non détaillés";
    h += '<div class="row"><div class="av" style="background:var(--grn-soft)">' + catE(cat("courses")) + '</div>' +
      '<div class="gr"><div class="t">' + esc(t.note || "Courses") + '</div><div class="s">' + frDate(t.date) + ' · ' + sub + '</div></div>' +
      '<div class="amt">−' + money(t.amount) + '</div>' +
      '<div class="act"><button class="mini" onclick="App.editShop(\'' + t.id + '\')" aria-label="Modifier">' + ic("edit") + '</button>' +
      '<button class="mini" onclick="App.delTx(\'' + t.id + '\')" aria-label="Supprimer">' + ic("trash") + '</button></div></div>';
  });
  h += '</div></div>';
  return h + '</div>';
}

function sheetShop() {
  var t = tmp, D = shopData();
  var h = sheetHead(t.id ? "Modifier le ticket" : "Noter des courses", bagName() + " · " + mLabel(monthOf(t.date)));
  h += '<div class="amtwrap"><input id="f_amt" inputmode="decimal" placeholder="0,00" aria-label="Total du ticket" value="' + esc(t.amount) + '">' +
    '<span class="cur">' + S.settings.currency + '</span></div><div class="err" id="e_amt"></div>' +
    '<div class="dim" style="font-size:11.5px;margin-top:5px">Total du ticket. Laisse vide : on additionne les prix des articles (les prix estimés de ta liste servent par défaut).</div>';
  h += '<div class="crow"><input type="date" id="s_date" aria-label="Date" value="' + t.date + '">' +
    '<select id="s_pay" aria-label="Moyen de paiement">' +
    PAYS.map(function (p) { return '<option' + (t.pay === p ? " selected" : "") + '>' + p + '</option>'; }).join("") + '</select></div>' +
    '<input id="s_note" style="margin-top:8px" placeholder="Magasin (Lidl, marché…) — facultatif" value="' + esc(t.note) + '">';

  [["week", "Ma liste de la semaine"], ["month", "Ma liste du mois"]].forEach(function (g) {

    if (!its.length) return;
    var rg = shopRange(g[0], t.date), trips = shopTrips(rg[0], rg[1], t.id);
    its.sort(function (a, b) { return (kindIdx(a.kind) - kindIdx(b.kind)) || a.name.localeCompare(b.name); });
    h += '<div class="shgrp">' + g[1] + '</div>';
    its.forEach(function (it) {
      var miss = Math.max(0, it.qty - shopBought(trips, it));
      h += shLine(it.id, it.e || shopKind(it.kind).e, it.name,
        (miss > 0 ? "il en manque " + fmtQ(miss) : "déjà sur un ticket ✓") + (it.size > 0 ? " · " + sizeTxt(it) : ""),
        it.price, t.lines[it.id] || { q: 0, p: 0 });

  if (t.extra.length) {
    h += '<div class="shgrp">Hors liste</div>';
    t.extra.forEach(function (x, i) { h += shLine("x:" + i, x.e || shopKind(x.k).e, x.n, shopKind(x.k).n, 0, x); });

  if (!D.items.length) h += '<div class="dim" style="font-size:12px;margin-top:12px;line-height:1.6">Astuce : remplis ta liste depuis la page Courses, ' +
    'tu n\'auras plus qu\'à appuyer sur + ici.</div>';
  h += '<div class="shgrp">Ajouter un article hors liste</div><div class="crow" style="margin-top:4px">' +
    '<input id="s_xn" placeholder="Bonbons, éponges…" onkeydown="if(event.key===\'Enter\'){event.preventDefault();event.stopPropagation();App.shAddExtra()}">' +
    '<select id="s_xk" aria-label="Type">' + SHOP_KINDS.map(function (k) { return '<option value="' + k.id + '">' + k.e + " " + k.n + '</option>'; }).join("") + '</select>' +
    '<button class="btn ghost" style="width:auto;padding:9px 14px" onclick="App.shAddExtra()">Ajouter</button></div>' +
    '<div class="dim" id="s_sum" style="font-size:12px;margin-top:12px"></div>';
  h += sheetFoot(t.id ? "Enregistrer" : "Mettre dans le sac", "App.saveShop()");
  openSheet(h, { wide: true, submit: function () { App.saveShop(); } });
  App.shSum();
}

/* ---------- API ---------- */
var App = {
  /* ----- Compagnon ----- */
  /* Clic sur le personnage : il se replie sur le bord, sans disparaître. */
  mateTap: function () {
    AP.peek = !AP.peek;
    saveAppearance();
    var el = document.getElementById("mate");
    if (el) el.classList.toggle("peek", !!AP.peek);
    if (AP.peek) App.mateHush(); else sfxVoice("ok");
    sfxTap();
  },
  /* Le bouton bulle reste accessible dans les deux états. */
  mateSpeak: function () {
    var DS = discipline(month);
    sfxVoice(DS.score >= 75 ? "happy" : DS.score >= 45 ? "ok" : "worry");
    var l = mateLine(month);
    mateSay(l.t, l.a, l.f, 12000);
  },
  mateHover: function () { sfxHover(); },
  toggleSound: function () {
    AP.sound = AP.sound === false;
    saveAppearance(); render();
    if (AP.sound !== false) sfxVoice("happy");
    toast(AP.sound === false ? "Sons coupés" : "Sons activés");
  },
  mateHush: function () {
    var b = document.getElementById("mbub");
    if (b) b.classList.remove("on");
    clearTimeout(mateT);
  },
  setGender: function (g) { AP.gender = g === "m" ? "m" : "f"; saveAppearance(); render(); },
  toggleMate: function () {
    AP.mate = AP.mate === false;
    saveAppearance(); render();
    toast(AP.mate === false ? "Compagnon masqué" : "Compagnon affiché");
  },

  /* ----- Quêtes à valider sur l'honneur ----- */
  questDo: function (id) {
    var x = missionsFor(curMonth()).filter(function (q) { return q.id === id && q.kind === "act"; })[0];
    if (!x || S.game.claimed[x.key]) return;
    App.claim(x.key, x.xp, x.t);
  },
  noSpend: function () {
    if (streak().today) return;
    dailyReward();
  },
  toggleWear: function (id) {
    var a = ACCS.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    if (levelOf(S.game.xp).lvl.n < a.lv) { toast("🔒 Se débloque au niveau " + a.lv); return; }
    var w = S.game.wear || (S.game.wear = []), i = w.indexOf(id);
    if (i >= 0) w.splice(i, 1); else w.push(id);
    saveNow(); renderMate(); render(); sfxTap();
  },
  defiDo: function () {
    var D = defiOfWeek();
    if (D.done) return;
    App.claim(D.key, D.xp, D.t);
  },
  defiSkip: function () {
    var wk = weekKey();
    S.game.skip = S.game.skip || {};
    if (S.game.skip[wk]) return;
    S.game.skip[wk] = 1; saveNow(); render(); sfxTap();
  },
  claim: function (key, xp, name) {
    var before = levelOf(S.game.xp).lvl.n;
    S.game.claimed[key] = 1; S.game.xp += xp; saveNow();
    var lv = levelOf(S.game.xp);
    var inSheet = document.getElementById("ov").classList.contains("on");
    render();
    if (inSheet) App.openProgress();
    setTimeout(function () { rewardPop(xp, [name]); levelUps(before); checkBadges(); }, 120);
  },

  /* ----- Progression ----- */
  openProgress: function () {
    var DS = discipline(month), LV = levelOf(S.game.xp), ms = missionsFor(month);
    var scol = DS.score >= 75 ? "var(--grn)" : DS.score >= 45 ? "var(--amb)" : "var(--red)";
    var h = sheetHead("Niveau " + LV.lvl.n + " · " + LV.lvl.t, mLabel(month));

    h += '<div style="display:flex;align-items:baseline;gap:10px;margin-top:14px">' +
      '<b style="font-size:38px;font-weight:800;letter-spacing:-.03em;color:' + scol + '">' + DS.score + '</b>' +
      '<span class="dim" style="font-size:13px">/ 100 de discipline ce mois</span></div>';

    h += '<label class="lbl">D\'où vient ce score</label>';
    DS.parts.forEach(function (p) {
      var pc = p.max ? p.v / p.max * 100 : 0;
      var c = pc >= 75 ? "var(--grn)" : pc >= 40 ? "var(--amb)" : "var(--red)";
      h += '<div class="sbar"><span class="n">' + p.k + '<br><span class="dim" style="font-size:11px">' + p.d + '</span></span>' +
        '<span class="b"><i style="width:' + pc + '%;background:' + c + '"></i></span>' +
        '<span class="p" style="color:' + c + '">' + Math.round(p.v) + '/' + p.max + '</span></div>';
    });

    var SK = streak(), got = S.game.badges || {};
    h += '<label class="lbl">Série</label><div class="streak' + (SK.today ? " ok" : SK.n ? " risk" : "") + '" style="margin-top:0">' +
      '<span class="fl" aria-hidden="true">🔥</span><div class="sk"><b>' + SK.n + ' jour' + (SK.n > 1 ? "s" : "") + '</b>' +
      '<span>Record : ' + SK.best + ' · ' + (SK.joker ? "joker disponible" : "joker utilisé cette semaine") + '</span></div></div>' +
      '<div class="dim" style="font-size:11.5px;margin-top:6px">Prochain bonus : ' +
      ((STREAK_STEPS.filter(function (x) { return x[0] > SK.n; })[0]) || [0, 0]).map(function (v, i) { return i ? "+" + v + " XP" : v + " jours"; }).join(" → ") +
      '. Un jour manqué par semaine est pardonné.</div>';

    var nb = BADGES.filter(function (b) { return got[b.id]; }).length;
    h += '<label class="lbl">Badges — ' + nb + ' / ' + BADGES.length + '</label><div class="bgrid">' +
      BADGES.map(function (b) {
        return '<div class="bdg' + (got[b.id] ? " on" : "") + '" title="' + esc(b.d) + '"><span class="be">' + (got[b.id] ? b.e : "🔒") + '</span>' +
          '<b>' + esc(b.n) + '</b><span>' + (got[b.id] ? "Obtenu le " + frDate(got[b.id]) : esc(b.d)) + '</span></div>';
      }).join("") + '</div>';

    h += '<label class="lbl">Tenues du compagnon</label>' + wearPicker();

    h += '<label class="lbl">Quêtes du mois</label><div class="qlist">';
    ms.forEach(function (x) { h += questCard(x, false); });
    if (!ms.length) h += '<div class="dim" style="font-size:13px">Aucune quête pour ce mois.</div>';
    h += '</div>';

    h += '<div class="xpbar" style="margin-top:16px"><i style="width:' + LV.pct + '%"></i></div>' +
      '<div class="xpinfo"><span>' + S.game.xp + ' XP au total</span><span>' +
      (LV.next ? "Prochain palier : " + LV.next.t : "Palier maximum") + '</span></div>';

    h += '<div class="dim" style="font-size:11.5px;margin-top:14px;line-height:1.65">' +
      'Les quêtes sont choisies d\'après tes propres chiffres et changent avec eux. ' +
      'Celles qui se mesurent se valident seules à partir de tes opérations ; les gestes concrets ' +
      '(résilier, relancer) se valident sur l\'honneur, rapportent moins et ne comptent pas dans le score. ' +
      'Le score mesure la qualité de ton suivi, pas ta capacité à te priver.</div>';

    h += sheetFoot("Fermer", "App.closeSheet(true)");
    openSheet(h, { wide: true, guard: false });
  },

  /* ----- Bilan annuel ----- */
  recapOpen: function () { recapIdx = 0; sheetRecap(); },
  recapGo: function (d) {
    var n = recapSlides(yearRecap(recapYear())).length;
    recapIdx = Math.max(0, Math.min(n - 1, recapIdx + d)); sheetRecap();
  },
  recapShare: function () {
    if (!premOK()) { App.closeSheet(true); upsell("L'image à partager"); return; }
    var R = yearRecap(recapYear()), cv = recapImage(R), name = "arpagon-" + R.y + ".png";
    cv.toBlob(function (b) {
      if (!b) { toast("⚠️ Image impossible à créer"); return; }
      var f = typeof File === "function" ? new File([b], name, { type: "image/png" }) : null;
      if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: "Mon année Arpagon " + R.y }).catch(function () {});
      } else {
        var u = URL.createObjectURL(b), a = document.createElement("a");
        a.href = u; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 200);
        toast("Image téléchargée — à poster en story ✓");
      }
    }, "image/png");
  },

  /* ----- Compte & Premium ----- */
  accLogin: function () {
    var el = document.getElementById("acc_mail"), m = el ? el.value.trim() : "";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)) { toast("⚠️ Adresse e-mail invalide"); return; }
    ACC.busy = true; render();
    apiFetch("/auth/request", { method: "POST", body: { email: m } })
      .then(function () { ACC.busy = false; render(); toast("📬 Lien envoyé à " + m + " — ouvre-le sur cet appareil"); })
      .catch(function (e) { ACC.busy = false; render(); accErr(e); });
  },
  accLogout: function () {
    apiFetch("/logout", { method: "POST" }).catch(function () {}).then(function () {
      LS.del(SES_KEY); LS.del(SYNC_KEY); setMe(null); ACC.conflict = false; render(); toast("Déconnecté — tes données restent sur cet appareil");
    });
  },
  accCgv: function (v) { ACC.cgv = !!v; },
  accBuy: function (plan) {
    if (!ACC.cgv) { toast("⚠️ Coche l'acceptation des CGV avant de payer"); return; }
    apiFetch("/billing/checkout", { method: "POST", body: { plan: plan, acceptCgv: true } })
      .then(function (j) { if (j.url) location.href = j.url; }).catch(accErr);
  },
  accPortal: function () {

  },
  accPush: function () { cloudPush(true); },
  accPull: function () {
    sheetConfirm("Récupérer la version en ligne ?", "Les données de cet appareil seront remplacées par ta dernière sauvegarde en ligne.", "Récupérer", function () { cloudPull(true); });
  },
  accKeepCloud: function () { cloudPull(true); },
  accKeepLocal: function () { cloudPush(true, true); },
  accDelete: function () {
    sheetConfirm("Supprimer ton compte ?", "Ton compte, ta sauvegarde en ligne et ton abonnement éventuel sont supprimés définitivement. Les données de cet appareil restent.", "Supprimer", function () {
      apiFetch("/account", { method: "DELETE" }).then(function () {
        LS.del(SES_KEY); LS.del(SYNC_KEY); setMe(null); render(); toast("Compte supprimé");
      }).catch(accErr);
    });
  },

  /* ----- Apparence ----- */
  setTheme: function (id) {
    var tp = THEMES.filter(function (x) { return x.id === id; })[0];
    if (tp && tp.prem && !premOK()) { upsell("Le thème " + tp.n); return; }
    AP.theme = id;
    /* Un univers arrive avec sa couleur signature — libre à toi d'en changer ensuite. */
    var t = THEMES.filter(function (x) { return x.id === id; })[0];
    if (t && t.acc) AP.accent = t.acc;
    saveAppearance(); render();
  },
  setAccent: function (id) {
    var ap = ACCENTS.filter(function (x) { return x.id === id; })[0];
    if (ap && ap.prem && !premOK()) { upsell("La couleur " + ap.n); return; }
    AP.accent = id; saveAppearance(); render();
  },
  setAP: function (k, v, suf) {
    if (k === "wpFit") { AP.wpFit = v; saveAppearance(); render(); return; }
    AP[k] = +v;
    LS.set(AP_KEY, JSON.stringify(AP));
    applyAppearance();
    var el = document.getElementById("apv_" + k);

      { l: "Nouvelle dépense", i: "plus", g: "Actions", run: function () { App.newTx(); } },

      { l: "Revenir à aujourd'hui", i: "clock", g: "Actions", run: function () { App.goToday(); } }
    ];

      acts.push({ l: "Aller à " + t.l, i: t.i, g: "Navigation", kbd: GHINTS[t.id] || "", run: (function (id) { return function () { App.go(id); }; })(t.id) });
    });

    acts.forEach(function (a) { if (!q || a.l.toLowerCase().indexOf(q) >= 0) items.push(a); });

      }).sort(function (a, b) { return b.date.localeCompare(a.date); }).slice(0, 5).forEach(function (t) {
        var c = cat(t.categoryId);
        items.push({ l: (t.note || (c ? c.n : "—")), i: "search", g: "Opérations",
          sub: frDate(t.date) + " · " + (t.type === "income" ? "+" : "−") + money(t.amount),

  palInput: function () {

      h += '<button class="pal-it' + (i === palIdx ? " sel" : "") + '" onclick="App.palRun(' + i + ')">' + ic(it.i) +

  },
  palKey: function (e) {
    if (e.key === "ArrowDown") { palIdx = Math.min(palIdx + 1, palItems.length - 1); App.palInput(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { palIdx = Math.max(palIdx - 1, 0); App.palInput(); e.preventDefault(); }
    else if (e.key === "Enter") { App.palRun(palIdx); e.preventDefault(); }
    else if (e.key === "Escape") { App.closePal(); e.preventDefault(); }

  newTx: function () { tmp = { type: "expense", amount: "", categoryId: "", date: month === curMonth() ? todayISO() : month + "-01", payMethod: "Carte", note: "", useful: null }; sheetTx(); },
  editTx: function (id) {
    var t = S.transactions.filter(function (x) { return x.id === id; })[0];

  setFixed: function (v) { App.grab(); tmp.fixed = v; sheetTx(); sheetCtx.dirty = true; },
  setType: function (t) { App.grab(); tmp.type = t; tmp.categoryId = ""; if (t === "income") tmp.useful = null; sheetTx(); sheetCtx.dirty = true; },
  setCat: function (c) { App.grab(); tmp.categoryId = c; sheetTx(); sheetCtx.dirty = true; },
  setUseful: function (u) { App.grab(); tmp.useful = tmp.useful === u ? null : u; sheetTx(); sheetCtx.dirty = true; },
  grab: function () {
    var a = document.getElementById("f_amt"), d = document.getElementById("f_date"),
        p = document.getElementById("f_pay"), n = document.getElementById("f_note");
    if (a) tmp.amount = a.value; if (d) tmp.date = d.value; if (p) tmp.payMethod = p.value; if (n) tmp.note = n.value;
  },
  saveTx: function () {
    App.grab();
    var amt = num(tmp.amount), ok = true;
    document.getElementById("e_amt").textContent = ""; document.getElementById("e_cat").textContent = "";
    if (amt <= 0) { document.getElementById("e_amt").textContent = "Montant invalide"; ok = false; }
    if (!tmp.categoryId) { document.getElementById("e_cat").textContent = "Choisis une catégorie"; ok = false; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(tmp.date)) { document.getElementById("e_amt").textContent = "Date invalide"; ok = false; }
    if (!ok) return;
    var tx = { id: tmp.id || uid(), type: tmp.type, amount: amt, categoryId: tmp.categoryId, date: tmp.date,
      payMethod: tmp.payMethod, note: tmp.note, useful: tmp.type === "income" ? null : tmp.useful };
    if (tmp.lines) tx.lines = tmp.lines;
    if (tmp.ext) tx.ext = tmp.ext;
    if (!S.fixed) S.fixed = [];
    var tm = monthOf(tx.date), fx = tmp.fixedId ? fixedOf(tmp.fixedId) : null;
    if (tmp.fixed) {
      /* Nouveau modèle, ou mise à jour du modèle existant pour les mois suivants */
      if (!fx) { fx = { id: uid(), start: tm, end: null, skip: {} }; S.fixed.push(fx); }
      fx.type = tx.type; fx.amount = amt; fx.categoryId = tx.categoryId; fx.day = +tx.date.slice(8, 10);
      fx.payMethod = tx.payMethod; fx.note = tx.note; fx.useful = tx.useful;
      if (tm < fx.start) fx.start = tm;
      if (fx.end && fx.end < tm) fx.end = null;
      tx.fixedId = fx.id;
    } else if (fx) {
      /* Repassée en Variable : le modèle s'arrête avant ce mois, les mois suivants déjà créés partent */
      fx.end = shiftM(tm, -1);
      S.transactions = S.transactions.filter(function (x) { return !(x.fixedId === fx.id && monthOf(x.date) > tm); });
    }
    var isNew = !tmp.id;
    if (tmp.id) S.transactions = S.transactions.map(function (x) { return x.id === tx.id ? tx : x; });
    else S.transactions.push(tx);
    save(); App.closeSheet(true); render();
    if (isNew) dailyReward();
    if (tx.type === "expense") {
      var b = budgetOf(monthOf(tx.date), tx.categoryId);
      if (b) {
        var sp = stats(monthOf(tx.date)).byCat[tx.categoryId] || 0;
        if (sp > b.amount + carryFor(tx.categoryId)) { toast("⚠️ Budget " + cat(tx.categoryId).n + " dépassé"); return; }
      }
      var st = stats(curMonth());
      if (monthOf(tx.date) === curMonth() && S.settings.alertThreshold > 0 && st.income > 0 && st.left < S.settings.alertThreshold && st.left >= 0) {
        toast("⚠️ Il te reste moins de " + money(S.settings.alertThreshold)); return;
      }
    }
    toast(tx.fixedId && !tmp.id ? "Ajouté ✓ · reviendra chaque mois" : tmp.id ? "Modifié ✓" : "Ajouté ✓");
  },
  delTx: function (id) {
    var i = S.transactions.findIndex(function (t) { return t.id === id; });
    if (i < 0) return;
    undoBuf = { tx: S.transactions[i], index: i };
    var fx = S.transactions[i].fixedId ? fixedOf(S.transactions[i].fixedId) : null;
    if (fx) { fx.skip = fx.skip || {}; fx.skip[monthOf(S.transactions[i].date)] = 1; }
    S.transactions.splice(i, 1);
    save(); render();
    toast("Opération supprimée", "Annuler", function () {
      if (!undoBuf) return;
      S.transactions.splice(Math.min(undoBuf.index, S.transactions.length), 0, undoBuf.tx);
      undoBuf = null; save(); render(); toast("Restauré ✓");
    });
  },

  /* budgets */

  /* Édition en ligne dans la table d'enveloppes */
  setBudget: function (c, v) {
    var amt = String(v).trim() === "" ? 0 : num(v);
    if (amt < 0) { toast("⚠️ Montant négatif ignoré"); render(); return; }
    var had = !!budgetOf(month, c);
    S.budgets = S.budgets.filter(function (x) { return !(x.month === month && x.categoryId === c); });
    if (amt > 0) S.budgets.push({ id: month + ":" + c, month: month, categoryId: c, amount: amt });
    save(); render();
    if (amt > 0) toast(cat(c).n + " : " + money(amt));
    else if (had) toast("Enveloppe " + cat(c).n + " supprimée");
  },
  /* Répartit le reste à budgéter au prorata des enveloppes existantes */
  spreadRest: function () {
    var T = budgetTotals(month);
    if (T.toBudget <= 0.01 || T.budgeted <= 0) { toast("Rien à répartir"); return; }
    var f = (T.budgeted + T.toBudget) / T.budgeted;
    S.budgets.forEach(function (b) {
      if (b.month === month) b.amount = Math.round(b.amount * f * 100) / 100;
    });
    save(); render(); toast("Reste réparti sur tes enveloppes ✓");
  },
  clearBudgets: function () {
    var n = S.budgets.filter(function (b) { return b.month === month; }).length;
    if (!n) return;
    if (!confirm("Supprimer les " + n + " enveloppes de " + mLabel(month) + " ? Tes opérations ne sont pas touchées.")) return;
    var removed = S.budgets.filter(function (b) { return b.month === month; });
    S.budgets = S.budgets.filter(function (b) { return b.month !== month; });
    save(); render();
    toast(n + " enveloppes supprimées", "Annuler", function () {
      S.budgets = S.budgets.concat(removed); save(); render(); toast("Enveloppes restaurées ✓");
    });
  },
  saveBudget: function (c) {
    var amt = num(document.getElementById("f_bud").value);
    S.budgets = S.budgets.filter(function (x) { return !(x.month === month && x.categoryId === c); });
    if (amt > 0) S.budgets.push({ id: month + ":" + c, month: month, categoryId: c, amount: amt });
    save(); App.closeSheet(true); render();
    toast(amt > 0 ? "Enveloppe " + cat(c).n + " : " + money(amt) : "Enveloppe supprimée");

  copyBudgets: function () {
    var from = shiftM(month, -1), n = 0;
    S.budgets.filter(function (b) { return b.month === from; }).forEach(function (b) {
      if (budgetOf(month, b.categoryId)) return; /* fusion : on n'écrase jamais l'existant */
      S.budgets.push({ id: month + ":" + b.categoryId, month: month, categoryId: b.categoryId, amount: b.amount });
      n++;
    });
    save(); render(); toast(n ? n + " enveloppe" + (n > 1 ? "s" : "") + " copiée" + (n > 1 ? "s" : "") + " ✓" : "Rien à copier");
