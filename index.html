function vDash() {
  var s = stats(month), p = stats(shiftM(month, -1)), cur = S.settings, ds = debtStats();
  var delta = p.expenses > 0 ? (s.expenses - p.expenses) / p.expenses * 100 : null;
  var h = '<div class="dg">';

  /* --- Bandeau de quête : rang, score, XP --- */
  var before = levelOf(S.game.xp).lvl.n;
  var G = grantXp(month), DS = discipline(month), LV = levelOf(S.game.xp);
  if (G.gained) {
    setTimeout(function () { rewardPop(G.gained, G.names); }, 350);
    if (LV.lvl.n > before) setTimeout(function () { levelUpPop(LV.lvl); }, 4600);
  }
  var scol = DS.score >= 75 ? "var(--grn)" : DS.score >= 45 ? "var(--amb)" : "var(--red)";
  var chapNo = +month.split("-")[1];
  h += '<div class="c12">' + chapter("Chapitre " + chapNo + " — " + mLabel(month)) +
    '<div class="qhead" onclick="App.openProgress()" role="button" tabindex="0" aria-label="Voir la progression">' +
    '<div class="ring">' + ringSvg(DS.score, scol) +
    '<div class="rv"><b style="color:' + scol + '">' + DS.score + '</b><span>discipline</span></div></div>' +
    '<div class="qmeta"><div class="qrank"><span class="rk">' + LV.lvl.t + '</span>' +
    '<span class="lv">Niveau ' + LV.lvl.n + '</span></div>' +
    '<div class="qd">' + LV.lvl.d + '</div>' +
    '<div class="qxp"><i style="width:' + LV.pct + '%"></i></div>' +
    '<div class="qxpi"><span>' + S.game.xp + ' XP</span><span>' +
    (LV.next ? (LV.next.xp - S.game.xp) + ' XP → ' + LV.next.t : 'palier maximum') + '</span></div>' +
    '</div></div></div>';

  /* --- Quêtes actives, directement sur l'accueil --- */
  var ms = missionsFor(month);
  var open_ = ms.filter(function (x) { return !x.done; });
  var doneN = ms.length - open_.length;
  var show = (open_.length ? open_ : ms).slice(0, 3);
  h += '<div class="c12">' + chapter("Quêtes du mois — " + doneN + " / " + ms.length + " accomplies") +
    '<div class="qlist">';
  show.forEach(function (x) {
    h += '<div class="quest' + (x.done ? " on" : "") + '">' +
      '<span class="qic">' + (x.done ? ic("check", 3) : "◈") + '</span>' +
      '<span class="qtx"><span class="qt">' + x.t + '</span><span class="qs">' + x.d + '</span>' +
      (x.done ? "" : '<span class="qb"><i style="width:' + x.pct + '%"></i></span>') + '</span>' +
      '<span class="qxpc">' + (x.done ? "✓ " : "") + x.xp + ' XP</span></div>';
  });
  h += '</div>';
  if (ms.length > show.length) h += '<button class="link" style="margin-top:9px;padding:4px 0" onclick="App.openProgress()">Voir les ' + ms.length + ' quêtes</button>';
  h += '</div>';

  /* --- Solde du mois --- */
  var burn = s.income > 0 ? Math.min(100, s.expenses / s.income * 100) : (s.expenses > 0 ? 100 : 0);
  var bcol = burn >= 100 ? "var(--red)" : burn >= 80 ? "var(--amb)" : "var(--grn)";
  var lcol = s.left < 0 ? "var(--red)" : s.left === 0 ? "var(--mut)" : "var(--txt)";
  h += '<div class="c8">' + chapter("Ton mois") +
    '<div class="hero">' +
    /* On lit de haut en bas comme un relevé : ce qui rentre, ce qui sort, ce qui reste. */
    '<div class="ldg"><div class="lrow"><span class="ll">Ce qui rentre</span>' +
    '<b class="grn">+ ' + money(s.income) + '</b></div>' +
    '<div class="lrow"><span class="ll">Ce qui sort</span>' +
    '<b class="red">− ' + money(s.expenses) + '</b></div></div>' +
    '<div class="k" style="margin-top:14px">Il te reste</div>' +
    '<div class="big" style="color:' + lcol + '">' + money(s.left) + '</div>' +
    (delta !== null ? '<div class="trend" style="color:' + (delta <= 0 ? "var(--grn)" : "var(--amb)") + '">' +
      (delta <= 0 ? "▼" : "▲") + " " + Math.abs(delta).toFixed(0) + ' % de dépenses vs ' + MN[+shiftM(month, -1).split("-")[1] - 1] + '</div>' : "") +
    '<div class="burn"><i style="width:' + burn + '%;background:' + bcol + '"></i></div>' +
    '<div class="bl"><span>' + burn.toFixed(0) + ' % de tes recettes déjà dépensées</span>' +
    '<span>' + (s.income > 0 ? money(s.income) : "aucune recette notée") + '</span></div>' +
    '</div></div>';

  var gp = cur.monthlyGoal > 0 ? Math.min(100, s.saved / cur.monthlyGoal * 100) : 0;
  h += '<div class="c4">' + chapter("Butin mis de côté") +
    '<div class="card"><div style="font-size:26px;font-weight:780;letter-spacing:-.02em" class="' +
    (s.rate >= 20 ? "grn" : s.rate >= 10 ? "amb" : "") + '">' + s.rate.toFixed(1) + ' %</div>' +
    '<div class="dim" style="font-size:12.5px">' + money(s.saved) + ' / objectif ' + money(cur.monthlyGoal) + '</div>' +
    '<div class="bar"><i style="width:' + gp + '%;background:linear-gradient(90deg,var(--tea),var(--grn))"></i></div>' +
    (s.useless > 0 ? '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
      '<div style="display:flex;justify-content:space-between"><b class="amb" style="font-size:13px">🍿 Achats inutiles</b>' +
      '<b class="amb" style="font-size:13px">' + money(s.useless) + '</b></div>' +
      '<div class="dim" style="font-size:11.5px;margin-top:3px">Sans eux : <b class="grn">' + money(s.left + s.useless) + '</b></div></div>' : "") +
    '</div></div>';

  /* --- Chiffres clés --- */
  var BT = budgetTotals(month);
  h += '<div class="c12"><div class="statgrid">' +
    '<div class="stat" style="cursor:pointer" onclick="App.go(\'bud\')"><div class="k">Prêt à budgéter</div>' +
    '<div class="v ' + (Math.abs(BT.toBudget) < 0.01 ? "grn" : BT.toBudget < 0 ? "red" : "ind") + '">' + money(BT.toBudget) + '</div>' +
    '<div class="s">' + (BT.budgeted > 0 ? money(BT.budgeted) + " en enveloppes" : "aucune enveloppe") + '</div></div>' +
    '<div class="stat"><div class="k">Jours suivis</div><div class="v">' + activeDays(month) + '</div><div class="s">sur ' + daysInMonth(month) + '</div></div>' +
    '<div class="stat"><div class="k">Je dois</div><div class="v ' + (ds.owed > 0 ? "red" : "") + '">' + money(ds.owed) + '</div>' +
    '<div class="s">' + (ds.monthly > 0 ? money(ds.monthly) + ' /mois' : 'aucune dette') + '</div></div>' +
    '<div class="stat"><div class="k">On me doit</div><div class="v ' + (ds.lent > 0 ? "grn" : "") + '">' + money(ds.lent) + '</div>' +
    '<div class="s">prêts accordés</div></div>' +
    '</div></div>';

  /* --- Répartition par poste, façon liste bancaire --- */
  var items = [];
  for (var k in s.byCat) { var c = cat(k); if (c) items.push({ c: c, v: s.byCat[k] }); }
  items.sort(function (a, b) { return b.v - a.v; });
  var maxv = items.length ? items[0].v : 1;
  var spH = '<div class="ttl">Où part l\'argent <button class="link" style="padding:2px 8px" onclick="App.go(\'stat\')">Détail</button></div>';
  if (!items.length) spH += '<div class="empty" style="padding:22px">Aucune dépense ce mois.<br><button class="cta" onclick="App.newTx()">+ Ajouter la première</button></div>';
  items.slice(0, 6).forEach(function (it) {
    var b = budgetOf(month, it.c.id);
    var share = s.expenses > 0 ? it.v / s.expenses * 100 : 0;
    spH += '<div class="spend"><span class="sic" style="background:' + it.c.c + '22;color:' + it.c.c + '">' + it.c.e + '</span>' +
      '<span class="sg"><span class="sn">' + it.c.n + '<b>' + money(it.v) + '</b></span>' +
      '<span class="sb"><i style="width:' + (it.v / maxv * 100) + '%;background:' + it.c.c + '"></i></span>' +
      '<span class="ss">' + share.toFixed(0) + ' % des dépenses' +
      (b ? ' · enveloppe ' + money(b.amount) + (it.v > b.amount ? ' <b class="red">dépassée</b>' : '') : '') +
      '</span></span></div>';
  });
  h += '<div class="c5">' + chapter("Répartition") + '<div class="card">' + spH + '</div></div>';

  /* --- Dernières opérations --- */
  var recent = s.txs.slice().sort(function (a, b) { return b.date.localeCompare(a.date); }).slice(0, 5);
  var rH = '<div class="ttl">Journal <button class="link" style="padding:2px 8px" onclick="App.go(\'tx\')">Tout voir</button></div>';
  if (!recent.length) rH += '<div class="empty" style="padding:22px">Rien de noté.<br><button class="cta" onclick="App.newTx()">+ Première opération</button></div>';
  recent.forEach(function (t) { rH += txRow(t, false); });
  h += '<div class="c4">' + chapter("Activité récente") + '<div class="card">' + rH + '</div></div>';

  /* --- Enveloppes --- */
  var mb = S.budgets.filter(function (b) { return b.month === month; });
  var bH = '<div class="ttl">Enveloppes <button class="link" style="padding:2px 8px" onclick="App.go(\'bud\')">Gérer</button></div>';
  if (!mb.length) bH += '<div class="empty" style="padding:22px">Aucune enveloppe.<br><button class="cta" onclick="App.go(\'bud\')">En définir</button></div>';
  mb.slice(0, 5).forEach(function (b) {
    var c = cat(b.categoryId); if (!c) return;
    var sp = s.byCat[b.categoryId] || 0, pct = Math.min(100, sp / b.amount * 100), over = sp > b.amount;
    bH += '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">' +
      '<span class="dim">' + c.e + ' ' + c.n + '</span><span><b class="' + (over ? "red" : "") + '">' + money(sp) +
      '</b> <span class="dim">/ ' + money(b.amount) + '</span></span></div>' +
      '<div class="bar" style="margin-top:0"><i style="width:' + pct + '%;background:' +
      (over ? "var(--red)" : pct > 80 ? "var(--amb)" : "var(--grn)") + '"></i></div></div>';
  });
  h += '<div class="c3">' + chapter("Enveloppes") + '<div class="card">' + bH + '</div></div>';

  /* --- Onboarding, en bas : il n'écrase plus la page --- */
  if (S.settings.onboard !== false) {
    var d1 = S.transactions.some(function (t) { return t.type === "income"; });
    var d2 = S.transactions.some(function (t) { return t.type === "expense"; });
    var d3 = S.budgets.length > 0;
    if (d1 && d2 && d3) { S.settings.onboard = false; save(); }
    else {
      var step = function (done, label, action) {
        return '<div class="step' + (done ? " done" : "") + '"><span class="ck">' + (done ? ic("check", 2.6) : "") + '</span>' +
          (done ? '<span>' + label + '</span>' : '<button class="link" style="padding:0;font-size:13.5px" onclick="' + action + '">' + label + '</button>') + '</div>';
      };
      h += '<div class="c12"><div class="card onb"><div class="ttl">Prologue — les trois premiers gestes' +
        '<button class="link" style="padding:2px 8px" onclick="App.dismissOnboard()">Masquer</button></div>' +
        step(d1, "Déclarer un revenu (salaire, bourse…)", "App.newTx()") +
        step(d2, "Noter une première dépense", "App.newTx()") +
        step(d3, "Poser une enveloppe de budget", "App.go('bud')") +
        '</div></div>';
    }
  }
  return h + '</div>';
}

function txRow(t, actions) {
  var c = cat(t.categoryId);
  return '<div class="row"><div class="av" style="background:' + (c ? c.c : "#666") + '22">' + (c ? c.e : "❓") + '</div>' +
    '<div class="gr"><div class="t">' + esc(t.note || (c ? c.n : "—")) + (t.useful === "useless" ? ' <span class="amb">🍿</span>' : "") + '</div>' +
    '<div class="s">' + (c ? c.n : "") + ' · ' + t.date.slice(8, 10) + "/" + t.date.slice(5, 7) + (t.payMethod ? " · " + t.payMethod : "") + '</div></div>' +
    '<div class="amt ' + (t.type === "income" ? "grn" : "") + '">' + (t.type === "income" ? "+" : "−") + money(t.amount) + '</div>' +
    (actions ? '<div class="act"><button class="mini" onclick="App.editTx(\'' + t.id + '\')" aria-label="Modifier">' + ic("edit") + '</button>' +
    '<button class="mini" onclick="App.delTx(\'' + t.id + '\')" aria-label="Supprimer">' + ic("trash") + '</button></div>' : "") + '</div>';
}

function sortArrow(k) { return txSort.k === k ? (txSort.d < 0 ? " ↓" : " ↑") : ""; }
function txHead() {
  return '<div class="thead"><span></span><span>Note</span>' +
    '<button class="' + (txSort.k === "cat" ? "on" : "") + '" onclick="App.sortTx(\'cat\')">Catégorie' + sortArrow("cat") + '</button>' +
    '<button class="' + (txSort.k === "date" ? "on" : "") + '" onclick="App.sortTx(\'date\')">Date' + sortArrow("date") + '</button>' +
    '<span>Paiement</span>' +
    '<button class="' + (txSort.k === "amount" ? "on" : "") + '" style="justify-content:flex-end" onclick="App.sortTx(\'amount\')">Montant' + sortArrow("amount") + '</button><span></span></div>';
}
function txLine(t) {
  var c = cat(t.categoryId);
  return '<div class="trow"><div class="av" style="width:34px;height:34px;font-size:15px;background:' + (c ? c.c : "#666") + '22">' + (c ? c.e : "❓") + '</div>' +
    '<span class="tcell" style="font-weight:550">' + esc(t.note || (c ? c.n : "—")) + (t.useful === "useless" ? ' <span class="amb">🍿</span>' : "") + '</span>' +
    '<span class="tcell dim">' + (c ? c.n : "") + '</span>' +
    '<span class="tcell dim">' + frDate(t.date) + '</span>' +
    '<span class="tcell dim">' + (t.payMethod || "—") + '</span>' +
    '<span class="tcell amt ' + (t.type === "income" ? "grn" : "") + '" style="text-align:right">' + (t.type === "income" ? "+" : "−") + money(t.amount, 1) + '</span>' +
    '<div class="act"><button class="mini" onclick="App.editTx(\'' + t.id + '\')" aria-label="Modifier">' + ic("edit") + '</button>' +
    '<button class="mini" onclick="App.delTx(\'' + t.id + '\')" aria-label="Supprimer">' + ic("trash") + '</button></div></div>' +
    txRow(t, true).replace('class="row"', 'class="row mob"');
}
function txSortList(l) {
  return l.sort(function (a, b) {
    var r = 0;
    if (txSort.k === "amount") r = a.amount - b.amount;
    else if (txSort.k === "cat") { var ca = cat(a.categoryId), cb = cat(b.categoryId); r = (ca ? ca.n : "").localeCompare(cb ? cb.n : ""); }
    else r = a.date.localeCompare(b.date);
    return r * txSort.d || b.date.localeCompare(a.date);
  });
}

function vTx() {
  var s = stats(month);
  var list = s.txs.filter(function (t) { return filter === "all" || t.type === filter; });
  var h = '<div class="chips">' + [["all", "Tout"], ["income", "Recettes"], ["expense", "Dépenses"]].map(function (f) {
    return '<button class="chip' + (filter === f[0] ? " on" : "") + '" onclick="App.setFilter(\'' + f[0] + '\')">' + f[1] + '</button>';
  }).join("") + '</div>';

  if (!list.length) return h + '<div class="card flush"><div class="empty"><div class="big">⇅</div>Rien pour ' +
    mLabel(month).toLowerCase() + '.<br><button class="cta" onclick="App.newTx()">+ Nouvelle opération</button></div></div>';

  /* Lecture façon relevé bancaire : d'abord tout ce qui rentre, ensuite tout ce qui sort. */
  function section(title, kind, rows, total, col) {
    if (!rows.length) return '';
    return '<div class="card flush mb"><div class="sech"><span class="st">' + title + '</span>' +
      '<span class="sc">' + rows.length + ' opération' + (rows.length > 1 ? "s" : "") + '</span>' +
      '<b class="' + col + '">' + (kind === "income" ? "+ " : "− ") + money(total, 1) + '</b></div>' +
      txHead() + txSortList(rows).map(txLine).join("") + '</div>';
  }

  if (filter === "all") {
    var inc = list.filter(function (t) { return t.type === "income"; });
    var exp = list.filter(function (t) { return t.type === "expense"; });
    var ti = inc.reduce(function (a, t) { return a + t.amount; }, 0);
    var te = exp.reduce(function (a, t) { return a + t.amount; }, 0);
    h += section("Ce qui rentre", "income", inc, ti, "grn");
    if (!inc.length) h += '<div class="card mb"><div class="empty" style="padding:20px">Aucune recette ce mois.<br>' +
      '<button class="cta" onclick="App.newTx()">+ Ajouter une recette</button></div></div>';
    h += section("Ce qui sort", "expense", exp, te, "red");
    if (!exp.length) h += '<div class="card mb"><div class="empty" style="padding:20px">Aucune dépense ce mois.</div></div>';
    h += '<div class="card"><div class="sech"><span class="st">Ce qu\'il te reste</span><span class="sc"></span>' +
      '<b class="' + (ti - te >= 0 ? "grn" : "red") + '" style="font-size:19px">' + money(ti - te, 1) + '</b></div></div>';
    return h;
  }

  var tot = list.reduce(function (a, t) { return a + t.amount; }, 0);
  return h + section(filter === "income" ? "Ce qui rentre" : "Ce qui sort", filter, list, tot,
    filter === "income" ? "grn" : "red");
}

var BGROUPS = [
  { n: "Essentiels",   ids: ["logement", "nourriture", "transport", "sante"] },
  { n: "Vie courante", ids: ["loisirs", "shopping", "abonnements"] },
  { n: "Engagements",  ids: ["remboursement", "divers"] },
  { n: "Mise de côté", ids: ["epargne"] }
];
function budgetTotals(m) {
  var st = stats(m), tb = 0, ts = 0, tc = 0;
  CATS.forEach(function (c) {
    if (c.t !== "expense") return;
    var b = budgetOf(m, c.id);
    if (!b) return;
    tb += b.amount; tc += carryFor(c.id); ts += st.byCat[c.id] || 0;
  });
  return { budgeted: tb, spent: ts, carry: tc, income: st.income, toBudget: st.income - tb, stats: st };
}
function budRow(c, st) {
  var b = budgetOf(month, c.id), sp = st.byCat[c.id] || 0;
  var carry = b ? carryFor(c.id) : 0;
  var avail = (b ? b.amount : 0) + carry, rest = avail - sp;
  var pct = avail > 0 ? Math.min(100, sp / avail * 100) : 0;
  var cls = !b ? "none" : rest < 0 ? "bad" : pct > 85 ? "warn" : "ok";
  var col = rest < 0 ? "var(--red)" : pct > 85 ? "var(--amb)" : "var(--grn)";
  return '<div class="br">' +
    '<div class="cn"><span class="e">' + c.e + '</span><span class="nm">' + c.n + '</span>' +
    (carry > 0 ? '<span class="cy" title="Reporté des mois précédents">+' + money(carry) + '</span>' : "") + '</div>' +
    '<div class="bwrap"><input class="bin' + (b ? "" : " z") + '" inputmode="decimal" aria-label="Budget ' + c.n + '" ' +
    'value="' + (b ? b.amount : "") + '" placeholder="0" ' +
    'onchange="App.setBudget(\'' + c.id + '\',this.value)" onfocus="this.select()"></div>' +
    '<div class="sp">' + (sp > 0 ? money(sp) : '<span class="dim">—</span>') + '</div>' +
    '<div class="rest"><span class="pill ' + cls + '">' + (b || sp ? money(rest) : "—") + '</span></div>' +
    (b ? '<div class="brline"><i style="width:' + pct + '%;background:' + col + '"></i></div>' : "") +
    '</div>';
}
function vBud() {
  var T = budgetTotals(month), st = T.stats;
  var prevM = shiftM(month, -1);
  var missing = S.budgets.filter(function (b) { return b.month === prevM; })
    .filter(function (b) { return !budgetOf(month, b.categoryId); }).length;

  /* Bandeau « Prêt à budgéter » — logique enveloppe : chaque euro reçoit une mission */
  var tb = T.toBudget;
  var col = Math.abs(tb) < 0.01 ? "var(--grn)" : tb > 0 ? "var(--ind2)" : "var(--red)";
  var msg = T.income === 0 ? "Ajoute tes revenus du mois pour répartir"
    : Math.abs(tb) < 0.01 ? "Tout est affecté — budget à l'équilibre ✓"
    : tb > 0 ? "Reste à répartir dans tes enveloppes"
    : "Tu as budgété plus que tes revenus";
  var h = '<div class="tobud"><div class="lft"><div class="k">Prêt à budgéter — ' + mLabel(month) + '</div>' +
    '<div class="amt" style="color:' + col + '">' + money(tb) + '</div>' +
    '<div class="brk"><span>Revenus <b style="color:var(--txt)">' + money(T.income) + '</b></span>' +
    '<span>Budgété <b style="color:var(--txt)">' + money(T.budgeted) + '</b></span>' +
    '<span>Dépensé <b style="color:var(--txt)">' + money(T.spent) + '</b></span></div>' +
    '<div class="dim" style="font-size:11.5px;margin-top:5px">' + msg + '</div></div>' +
    '<div class="acts">' +
    (missing > 0 ? '<button onclick="App.copyBudgets()">Reprendre ' + mLabel(prevM) + ' (' + missing + ')</button>' : "") +
    (tb > 0.01 && T.budgeted > 0 ? '<button onclick="App.spreadRest()">Répartir le reste</button>' : "") +
    (T.budgeted > 0 ? '<button onclick="App.clearBudgets()">Tout remettre à zéro</button>' : "") +
    '</div></div>';

  /* Table d'enveloppes groupées */
  h += '<div class="btab"><div class="bh"><span>Catégorie</span><span>Budgété</span><span>Dépensé</span><span>Reste</span></div>';
  var seen = {};
  BGROUPS.forEach(function (g) {
    var cs = g.ids.map(function (id) { return cat(id); }).filter(Boolean);
    if (!cs.length) return;
    var gb = 0, gs = 0;
    cs.forEach(function (c) { seen[c.id] = 1; var b = budgetOf(month, c.id); if (b) gb += b.amount; gs += st.byCat[c.id] || 0; });
    h += '<div class="bgrp"><span>' + g.n + '</span><span class="tot">' + money(gs) + ' / ' + money(gb) + '</span></div>';
    cs.forEach(function (c) { h += budRow(c, st); });
  });
  var rest = CATS.filter(function (c) { return c.t === "expense" && !seen[c.id]; });
  if (rest.length) {
    h += '<div class="bgrp"><span>Autres</span></div>';
    rest.forEach(function (c) { h += budRow(c, st); });
  }
  h += '</div>';

  h += '<div class="card" style="margin-top:14px"><div class="set" style="border:none;padding:2px 0">' +
    '<div><div class="n">Report du non-utilisé</div><div class="d">Ce qui reste d\'un mois s\'ajoute à l\'enveloppe du suivant</div></div>' +
    '<button class="sw' + (S.settings.rollover ? " on" : "") + '" onclick="App.toggleRollover()" role="switch" aria-checked="' + S.settings.rollover + '"><i></i></button></div></div>';
  h += '<div class="dim" style="font-size:11.5px;margin-top:10px;line-height:1.7">' +
    'Tape directement un montant dans la colonne <b>Budgété</b> — c\'est enregistré à la validation. ' +
    'Laisse vide pour supprimer l\'enveloppe.</div>';
  return h;
}

    return '<button class="chip' + (goalSub === k[0] ? " on" : "") + '" onclick="App.setGoalSub(\'' + k[0] + '\')">' + k[1] + '</button>';
  }).join("") + '</div>';

    h += '<div class="autofill">';

        '<div class="bar" style="height:8px"><i style="width:' + pct + '%;background:' + (g.done ? "var(--grn)" : "linear-gradient(90deg,#6366F1,#A78BFA)") + '"></i></div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px">' +
        '<span class="dim" style="font-size:12px">' + pct.toFixed(0) + ' %</span>' +
        (g.done ? "" : '<button class="link" onclick="App.fundGoal(\'' + g.id + '\')">+ Alimenter</button>') + '</div></div>';
    });
    h += '</div>' + (S.goals.length ? '<button class="dash" style="margin-top:14px" onclick="App.newGoal()">' + ic("plus") + 'Nouvel objectif</button>' : "");
  } else {
    var wl = S.wishlist || [], act = wl.filter(function (w) { return w.status !== "achete"; });
    var toFund = act.filter(function (w) { return w.status === "financer"; }).reduce(function (a, w) { return a + w.amount; }, 0);
    var flows = [1, 2, 3].map(function (i) { var m = stats(shiftM(month, -i)); return m.income - m.expenses; });
    var avg = (flows[0] + flows[1] + flows[2]) / 3;
    h += '<div class="statgrid mb">' +
      '<div class="stat"><div class="k">À financer</div><div class="v">' + money(toFund) + '</div><div class="s">' + act.length + ' achats en liste</div></div>' +
      '<div class="stat"><div class="k">Flux moyen / mois</div><div class="v ' + (avg >= 0 ? "grn" : "red") + '">' + money(avg) + '</div><div class="s">3 derniers mois</div></div></div>';
    var ord = { haute: 0, moyenne: 1, basse: 2 }, ST = { financer: "À financer", etudier: "À étudier", differe: "Différé" };
    h += '<div class="autofill">';
    if (!wl.length) h += '<div class="card" style="grid-column:1/-1"><div class="empty"><div class="big">🛒</div>Aucun achat en liste.<br><button class="cta" onclick="App.newWish()">+ Premier achat souhaité</button></div></div>';

  /* ----- Banque ----- */
  setBankApi: function (v) {
    var u = String(v || "").trim();
    if (u && !/^https:\/\//.test(u)) { toast("⚠️ L'adresse doit commencer par https://"); return; }
    LS.set(BANK_KEY, u); BANK.state = null; render();
    if (u) App.bankStatus();
  },
  bankStatus: function () {
    bankFetch("/accounts").then(function (j) { BANK.state = j; render(); })
      .catch(function () { BANK.state = { error: true }; render(); });
  },
  bankConnect: function () {
    bankFetch("/banks?country=FR").then(function (j) {
      var list = (j.banks || []).slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
      if (!list.length) { toast("⚠️ Aucune banque disponible"); return; }
      openSheet(sheetHead("Relier une banque", "Tu seras redirigé vers son site pour valider") +
        '<label class="lbl">Ta banque</label><select id="bk_pick">' +
        list.map(function (b) { return '<option value="' + esc(b.name) + '">' + esc(b.name) + '</option>'; }).join("") +
        '</select>' +
        '<div class="dim" style="font-size:11.5px;margin-top:12px;line-height:1.6">' +
        'Tu donnes un accès <b>en lecture seule</b>, valable 90 jours, révocable à tout moment depuis ta banque ou ici.</div>' +
        sheetFoot("Continuer", "App.bankGo()"), { submit: function () { App.bankGo(); } });
    }).catch(function () { toast("⚠️ Relais injoignable"); });
  },
  bankGo: function () {
    var el = document.getElementById("bk_pick");
    if (!el) return;
    bankFetch("/link", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bank: el.value, country: "FR" })
    }).then(function (j) {
      if (j.url) location.href = j.url; else toast("⚠️ Autorisation refusée");
    }).catch(function () { toast("⚠️ Impossible de démarrer l'autorisation"); });
  },
  bankSync: function (only) {
    var st = BANK.state;
    if (!st || !st.connected) { toast("⚠️ Aucune banque reliée"); return; }
    var accs = (st.accounts || []).filter(function (a) { return !only || a.uid === only; });
    if (!accs.length) return;
    BANK.busy = true; render();
    var from = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
    Promise.all(accs.map(function (a) {
      return bankFetch("/accounts/" + encodeURIComponent(a.uid) + "/transactions?from=" + from)
        .then(function (j) { return j.transactions || []; })
        .catch(function () { return []; });
    })).then(function (lists) {
      var all = [];
      lists.forEach(function (l) { all = all.concat(l); });
      var r = bankImport(all);
      BANK.busy = false; render();
      toast(r.added ? r.added + " opération" + (r.added > 1 ? "s" : "") + " importée" + (r.added > 1 ? "s" : "") +
        (r.skipped ? " · " + r.skipped + " déjà connue(s)" : "") + " ✓" : "Rien de nouveau à importer");
    }).catch(function () { BANK.busy = false; render(); toast("⚠️ Import échoué"); });
  },

    if (!confirm("Délier la banque ? Les opérations déjà importées sont conservées.")) return;
    bankFetch("/logout", { method: "POST" }).then(function () {
      BANK.state = { connected: false }; render(); toast("Banque déliée");
    }).catch(function () { toast("⚠️ Échec de la déconnexion"); });
  },

/* ---------- IMPORT CSV ---------- */
function importCSV(text) {
  var lines = text.replace(/\r/g, "").split("\n").filter(function (l) { return l.trim(); });
  if (!lines.length) return 0;
  var sep = (lines[0].split(";").length > lines[0].split(",").length) ? ";" : ",";
  var head = lines[0].toLowerCase().split(sep);
  function idx() { for (var a = 0; a < arguments.length; a++) for (var i = 0; i < head.length; i++) if (head[i].indexOf(arguments[a]) >= 0) return i; return -1; }
  var iD = idx("date"), iA = idx("montant", "amount"), iN = idx("libell", "note", "description", "label");
  if (iD < 0 || iA < 0) throw new Error("Colonnes date/montant introuvables — colonnes détectées : " + head.join(", "));
  var n = 0;
  for (var l = 1; l < lines.length; l++) {
    var c = lines[l].split(sep);
    var raw = parseFloat(String(c[iA] || "").replace(/\s/g, "").replace(/"/g, "").replace(",", "."));
    if (isNaN(raw) || raw === 0) continue;
    var d = String(c[iD] || "").trim().replace(/"/g, "");
    var fr = d.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/);
    if (fr) d = fr[3] + "-" + fr[2] + "-" + fr[1];
    if (!/^\d{4}-\d{2}-\d{2}/.test(d)) continue;
    S.transactions.push({ id: uid(), type: raw < 0 ? "expense" : "income", amount: Math.abs(raw),
      categoryId: raw < 0 ? "divers" : "autres-rev", date: d.slice(0, 10), payMethod: "Carte",
      note: (iN >= 0 ? String(c[iN] || "").replace(/"/g, "").trim() : "") || "Import CSV" });
    n++;
  }
  return n;
}

function dl(content, name, type) {
  try {
    var b = new Blob([content], { type: type }), u = URL.createObjectURL(b), a = document.createElement("a");
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 100);
  } catch (e) { toast("⚠️ Téléchargement bloqué"); }
}

/* ---------- TOAST (file d'attente : aucun message écrasé) ---------- */
function hideToast() {
  clearTimeout(toastT); toastT = null; tShowing = false;
  document.getElementById("toast").classList.remove("on");
  if (tq.length) setTimeout(pumpToast, 220);
}
function pumpToast() {
  if (tShowing || !tq.length) return;
  var it = tq.shift();
  tShowing = true;
  var t = document.getElementById("toast");
  t.innerHTML = "<span style='flex:1'>" + it.m + "</span>" +
    (it.label ? '<button class="tact" id="toastAct">' + it.label + '</button>' : "") +
    '<button class="tclose" onclick="hideToast()" aria-label="Fermer">' + ic("x") + '</button>';
  if (it.label) document.getElementById("toastAct").onclick = function () { hideToast(); if (it.fn) it.fn(); };
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, it.label ? 6000 : 2400);
}
function toast(m, actionLabel, actionFn) {
  tq.push({ m: m, label: actionLabel, fn: actionFn });
  if (tq.length > 3) tq = tq.slice(-3);
  pumpToast();
}
window.hideToast = hideToast;

/* ---------- DÉMARRAGE ---------- */
function loadData() {
  var raw = LS.get(PID === "main" ? "budgetv2:data" : "budgetv2:data:" + PID);
  if (raw) {
    try {
      var d = JSON.parse(raw);
      S = Object.assign({}, DEF, d);
      S.settings = Object.assign({}, DEF.settings, d.settings || {});
      if (!S.debts) S.debts = [];
      if (!S.wishlist) S.wishlist = [];
      if (!S.game) S.game = { xp: 0, claimed: {}, seen: {} };
      if (!S.game.claimed) S.game.claimed = {};
      if (!S.game.seen) S.game.seen = {};
      return;
    } catch (e) {}
  }
  S = JSON.parse(JSON.stringify(DEF));
  if (PID === "main") {
    var v1 = migrateV1();
    if (v1.length) { S.transactions = v1; saveNow(); setTimeout(function () { toast(v1.length + " opérations importées de ta v1 ✓"); }, 700); }
  }
}

function boot() {
  loadAppearance();
  /* Retour depuis la banque : #bank=ok / #bank=echec / #bank=state_invalide */
  if (location.hash.indexOf("bank=") >= 0) {
    var st = location.hash.split("bank=")[1].split("&")[0];
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    setTimeout(function () {
      if (st === "ok") { toast("Banque reliée ✓ — va dans Paramètres pour importer"); App.bankStatus(); }
      else if (st === "state_invalide") toast("⚠️ Retour non vérifié, autorisation annulée");
      else toast("⚠️ La banque a refusé l'autorisation");
    }, 500);
  }
  month = curMonth();
  try {
    var meta = JSON.parse(LS.get("budgetv2:profiles") || "null");
    if (meta && meta.list) { PROFILES = meta.list; PID = meta.active || "main"; }
  } catch (e) {}
  loadData();
  render();
  setTimeout(function () { var l = mateLine(month); mateSay(l.t, l.a, l.f, 14000); }, 1400);
  var last = LS.get("budgetv2:lastmonth");
  if (last && last !== curMonth()) setTimeout(function () { toast("📅 Nouveau mois — pense à copier tes budgets"); }, 1200);
  LS.set("budgetv2:lastmonth", curMonth());
  document.getElementById("sheet").addEventListener("input", function () { sheetCtx.dirty = true; sheetCtx.warned = false; });
  document.getElementById("palq").addEventListener("keydown", function (e) { App.palKey(e); });
  document.addEventListener("keydown", function (e) {
    var ov = document.getElementById("ov").classList.contains("on");
    var pal = document.getElementById("palov").classList.contains("on");
    /* Palette : Ctrl+K / Cmd+K partout */
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {
      e.preventDefault();
      if (pal) App.closePal(); else { if (ov) App.closeSheet(true); App.openPal(); }
      return;
    }
    if (pal) return; /* la palette gère son propre clavier */
    var tg = e.target.tagName;
    if (ov) {
      /* UX-008 : Entrée soumet le formulaire de la modale */
      if (e.key === "Enter" && tg === "INPUT" && sheetCtx.submit) { e.preventDefault(); sheetCtx.submit(); return; }
      if (e.key === "Escape") { App.closeSheet(); return; }
      /* A11Y-001 : piège du focus dans la modale */
      if (e.key === "Tab") {
        var f = document.getElementById("sheet").querySelectorAll("button,input,select,textarea");
        if (f.length) {
          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
          else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
        }
      }
      return;
    }
    if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA") return;
    /* Séquence G puis lettre (navigation Linear-style) */
    var now = Date.now();
    if (gSeq && now - gSeq < 900 && GKEYS[e.key.toLowerCase()]) {
      App.go(GKEYS[e.key.toLowerCase()]); gSeq = 0; e.preventDefault(); return;
    }
    if (e.key === "g" || e.key === "G") { gSeq = now; return; }
    gSeq = 0;
    if (e.key === "n" || e.key === "N") { App.newTx(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" && !MONTHLESS[tab]) App.shift(-1);
    else if (e.key === "ArrowRight" && !MONTHLESS[tab]) App.shift(1);
    else if (e.key === "Escape") App.closeSheet(true);
  });
  if (!LS.set("budgetv2:test", "1")) setTimeout(function () { toast("⚠️ Le navigateur bloque l'enregistrement local"); }, 1500);
  else LS.del("budgetv2:test");
}
boot();
</script>
