<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arpagon">
  <title>Arpagon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182446"/>
      <stop offset="1" stop-color="#0C1226"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2D479"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9C7A1C"/>
    </linearGradient>
    <linearGradient id="cord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8912A"/>
      <stop offset="0.5" stop-color="#F2D479"/>
      <stop offset="1" stop-color="#B8912A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="107" fill="none" stroke="#D4AF37" stroke-opacity="0.28" stroke-width="3"/>

  <!-- corps de la bourse, col resserré -->
  <path d="M232 178q-104 56-104 156 0 106 128 106t128-106q0-100-104-156z" fill="url(#gold)"/>
  <path d="M232 178q-104 56-104 156 0 58 38 86-22-30-22-78 0-98 96-164z" fill="#F2D479" opacity="0.3"/>
  <!-- fronces du col -->
  <path d="M216 196q40 22 80 0" stroke="#9C7A1C" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- lien de serrage noué par-dessus le col -->
  <path d="M196 168q60 34 120 0l14 26q-74 40-148 0z" fill="url(#cord)"/>
  <path d="M256 138q-16 10-16 24 0 10 16 10t16-10q0-14-16-24z" fill="url(#cord)"/>
  <path d="M240 158q-26-6-34 8" stroke="#B8912A" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M272 158q26-6 34 8" stroke="#B8912A" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- la pièce à l'intérieur -->
  <circle cx="256" cy="332" r="58" fill="#0C1226" opacity="0.24"/>
  <circle cx="256" cy="332" r="58" fill="none" stroke="#7A5E14" stroke-width="7" opacity="0.55"/>
  <text x="256" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="bold" fill="#0F1730">A</text>
</svg>
